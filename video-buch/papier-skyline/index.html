<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Papier-Skyline</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Archivo"; font-weight: 800; src: url(assets/fonts/archivo-latin-800-normal.woff2) format("woff2"); }
      :root { --y: #f3c936; --k: #141312; --b1: 0; --b2: 0; --b3: 0; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #161514; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1b1a19; }
      .clip, .layer { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .w { position: absolute; }
      .w > img { display: block; width: 100%; height: auto; }
      /* Papier-Zittern (Boil): drei globale Zufallswerte pro Stop-Motion-Schritt, je Ebene anders gewichtet */
      .b { transform: translate(calc((var(--b1) * var(--kx, 1.4)) * 1px), calc((var(--b2) * var(--ky, 1.4)) * 1px)) rotate(calc(var(--b3) * var(--kr, 0.35) * 1deg)); }
      .sh { filter: drop-shadow(6px 10px 7px rgba(0,0,0,.55)); }
      .shL { filter: drop-shadow(14px 22px 16px rgba(0,0,0,.6)); }
      .t { position: absolute; font-family: "Anton", sans-serif; text-transform: uppercase; color: var(--k); white-space: nowrap; line-height: .95; text-align: center; }
      #karton { background: url(assets/img/karton.jpg) center / cover; }
      #night { background: #06070b; opacity: 0; }
      #floor { background: #2a2825; top: 1596px; height: 400px; }
      #floor::after { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.008 0.05' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #floorEdge { top: 1578px; height: 40px; background: #e9e4d8; }
      #vig { z-index: 80; background: radial-gradient(120% 85% at 50% 45%, transparent 52%, rgba(0,0,0,.72) 100%); pointer-events: none; }
      #grain { z-index: 81; opacity: .14; mix-blend-mode: overlay; width: 2160px; height: 3840px; left: -540px; top: -960px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #flash { z-index: 82; background: #fff7d6; opacity: 0; mix-blend-mode: screen; }
      #glow { position: absolute; left: 12%; top: 49%; width: 76%; height: 37%; mix-blend-mode: screen; opacity: .0;
        background: radial-gradient(60% 60% at 50% 50%, rgba(255,214,90,.95), rgba(255,190,40,.0) 75%); }
      #clock, .clockb { left: 16.5%; top: 21.6%; width: 36%; height: 11%; display: flex; align-items: center; justify-content: center; }
      .ck { font-family: "Anton"; font-size: 70px; color: var(--y); letter-spacing: 2px; text-shadow: 0 0 10px rgba(243,201,54,.45); opacity: .92; }
      .gelb { filter: sepia(1) saturate(5.5) hue-rotate(-8deg) brightness(1.04) drop-shadow(6px 10px 7px rgba(0,0,0,.55)); }
      .sonneGelb { filter: sepia(1) saturate(3.4) hue-rotate(-14deg) brightness(.97) contrast(1.05); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="30">
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="30" data-volume="1"></audio>

      <div id="karton" class="clip" data-start="0" data-duration="30"></div>

      <!-- ================= Szene A · 0–6 s · „Aus dem wird nichts.“ ================= -->
      <div id="sA" class="clip" data-start="0" data-duration="6" style="z-index:2">
        <div class="w" id="aF1" style="left:-70px; top:120px; width:330px; opacity:.55"><img class="b sh" src="assets/img/fetzen.png" style="--kr:.6"></div>
        <div class="w" id="aF2" style="left:690px; top:1480px; width:520px; opacity:.6"><img class="b sh" src="assets/img/band_beige.png" style="--kx:-2"></div>
        <div class="w" id="aF3" style="left:760px; top:860px; width:260px; opacity:.45"><img class="b sh" src="assets/img/band_creme.png" style="--ky:-2"></div>
        <div id="aCam" class="layer">
          <div class="w" id="aScrap" style="left:345px; top:1255px; width:400px"><img class="b sh" src="assets/img/fetzen.png"></div>
          <div class="w" id="aMan" style="left:398px; top:905px; width:300px"><img class="b sh" src="assets/img/pose_kauern.png" style="--kr:.25"></div>
        </div>
        <div class="w" id="aCard" style="left:250px; top:150px; width:580px">
          <img class="b shL" src="assets/img/zettel1.png" style="--kr:.3">
          <div class="t" id="aw1" style="left:0; width:100%; top:262px; font-size:108px">Aus dem</div>
          <div class="t" id="aw2" style="left:0; width:100%; top:380px; font-size:118px">wird</div>
          <div class="t" id="aw3" style="left:0; width:100%; top:505px; font-size:132px">nichts.</div>
        </div>
      </div>

      <!-- ================= Welt · 6–30 s · Kiosk → Skyline ================= -->
      <div id="sB" class="clip" data-start="5.75" data-duration="17.0" style="z-index:3">
        <div id="night" class="layer"></div>
        <!-- ferne Ebene (Parallax langsamer) -->
        <div id="far" class="layer" style="transform-origin:540px 1600px">
          <div class="w" id="moon" style="left:780px; top:170px; width:230px"><img class="b sh" src="assets/img/mond.png" style="--kr:.5"></div>
          <div class="w star" style="left:120px; top:260px; width:52px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w star" style="left:420px; top:150px; width:40px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w star" style="left:620px; top:420px; width:46px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w star" style="left:250px; top:600px; width:36px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w star" style="left:930px; top:560px; width:42px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w star" style="left:60px; top:820px; width:34px"><img class="b" src="assets/img/stern.png"></div>
          <div class="w" id="sky" style="left:-140px; top:900px; width:1360px; filter:brightness(.72)"><img class="b" src="assets/img/skyline.png" style="--kr:.1"></div>
        </div>
        <div id="sunL" class="layer">
          <div class="w" id="sun" style="left:385px; top:350px; width:520px"><img class="b" src="assets/img/sonne.png" style="--kr:.4"><img id="sunY" class="b sonneGelb" src="assets/img/sonne.png" style="--kr:.4; position:absolute; left:0; top:0; opacity:0"></div>
        </div>
        <div id="clouds" class="layer">
          <div class="w" id="cl1" style="left:-80px; top:300px; width:420px"><img class="b sh" src="assets/img/wolke1.png"></div>
          <div class="w" id="cl2" style="left:760px; top:620px; width:360px"><img class="b sh" src="assets/img/wolke2.png"></div>
          <div class="w" id="cl3" style="left:600px; top:110px; width:470px"><img class="b sh" src="assets/img/wolke3.png"></div>
        </div>
        <!-- Weltebene: Boden, Türme, Kiosk, Figur (Kamera skaliert um den Fußpunkt 540/1600) -->
        <div id="world" class="layer" style="transform-origin:540px 1600px">
          <div id="floor" class="w" style="left:-1400px; width:3880px"></div>
          <div class="w pop" id="tGrau"   style="left:-470px; bottom:320px; width:235px"><img class="b sh" src="assets/img/turm_grau.png"></div>
          <div class="w pop" id="tZeit"   style="left:-300px; bottom:320px; width:235px"><img class="b sh" src="assets/img/turm_zeitung.png"></div>
          <div class="w pop" id="tKraft"  style="left:-80px;  bottom:320px; width:200px"><img class="b sh" src="assets/img/turm_kraft.png"></div>
          <div class="w pop" id="tDunkel" style="left:1290px; bottom:320px; width:215px"><img class="b sh" src="assets/img/turm_dunkel.png"></div>
          <div class="w pop" id="tWeiss"  style="left:1150px; bottom:320px; width:235px"><img class="b sh" src="assets/img/turm_weiss.png"></div>
          <div class="w pop" id="tHaupt"  style="left:330px;  bottom:320px; width:760px"><img class="b shL" src="assets/img/turm_haupt.png" style="--kr:.12"></div>
          <div class="w" id="jubel" style="left:530px; top:-610px; width:380px; transform-origin:50% 100%"><img class="b gelbImg sh" src="assets/img/pose_jubel_gelb.png" style="--kr:.6"></div>
          <div class="w pop" id="kiosk" style="left:110px; bottom:300px; width:410px">
            <img class="b shL" src="assets/img/kiosk.png" style="--kr:.2">
            <div id="glow"></div>
            <div id="clock" class="w"><span class="ck" id="ck0">02:58</span></div><div id="clock1" class="w clockb"><span class="ck" id="ck1">02:59</span></div><div id="clock2" class="w clockb"><span class="ck" id="ck2">03:00</span></div>
          </div>
          <div class="w pop" id="laptop" style="left:600px; bottom:312px; width:340px"><img class="b sh" src="assets/img/pose_laptop.png" style="--kr:.3"></div>
        </div>
        <!-- Texte Szene B/C (Bildschirmebene) -->
        <div id="ui" class="layer">
          <div class="w" id="bCap" style="left:150px; top:1700px; width:780px"><img class="b sh" src="assets/img/band_creme.png"><div class="t" style="left:0; width:100%; top:44px; font-size:96px">Am alten Laptop.</div></div>
          <div class="w" id="c1" style="left:70px;  top:80px;  width:620px"><img class="b sh" src="assets/img/band_creme.png"><div class="t" style="left:0; width:100%; top:30px; font-size:100px">Kein Plan.</div></div>
          <div class="w" id="c2" style="left:300px; top:215px; width:740px"><img class="b sh" src="assets/img/band_creme2.png"><div class="t" style="left:0; width:100%; top:38px; font-size:100px">Keine Ausreden.</div></div>
          <div class="w" id="c3" style="left:40px;  top:1700px; width:1000px"><img class="b sh" src="assets/img/band_beige.png"><div class="t" style="left:0; width:100%; top:52px; font-size:100px">Keine Kompromisse.</div></div>
        </div>
      </div>

      <!-- ================= Szene D · 22.6–30 s · das Buch ================= -->
      <div id="sD" class="clip" data-start="22.6" data-duration="7.4" style="z-index:4">
        <div class="w" id="dF1" style="left:-90px; top:1180px; width:360px; opacity:.5"><img class="b sh" src="assets/img/fetzen.png" style="--kr:.6"></div>
        <div class="w" id="dF2" style="left:800px; top:190px; width:420px; opacity:.45; transform:rotate(80deg)"><img class="b sh" src="assets/img/band_beige.png"></div>
        <div class="w" id="dF3" style="left:830px; top:1150px; width:300px; opacity:.5; transform:rotate(-12deg)"><img class="b sh" src="assets/img/wolke2.png"></div>
        <div id="dCam" class="layer" style="transform-origin:540px 900px">
          <div class="w pop" id="book" style="left:240px; top:330px; width:600px">
            <div class="b shL" style="--kr:.15; background:#f4f0e6; padding:9px; clip-path:polygon(0 .6%,4% 0,18% .5%,33% 0,51% .7%,66% .1%,83% .6%,100% 0,99.4% 14%,100% 31%,99.5% 52%,100% 71%,99.3% 88%,100% 100%,82% 99.4%,61% 100%,43% 99.3%,24% 100%,6% 99.4%,0 100%,.6% 83%,0 64%,.7% 41%,0 22%)">
              <img src="assets/img/cover.jpg" style="display:block; width:100%">
            </div>
          </div>
          <div class="w" id="tape1" style="left:180px; top:300px; width:230px; transform:rotate(-38deg); opacity:.88"><img class="b" src="assets/img/band_creme.png"></div>
          <div class="w" id="tape2" style="left:680px; top:1220px; width:230px; transform:rotate(-38deg); opacity:.88"><img class="b" src="assets/img/band_creme.png"></div>
          <div class="w" id="sitz" style="left:150px; top:28px; width:310px; transform-origin:60% 62%"><img class="b sh" src="assets/img/pose_sitzen_gelb.png" style="--kr:.8"></div>
          <div class="w" id="cta" style="left:110px; top:1365px; width:860px"><img class="b sh gelbBand" src="assets/img/band_creme2.png" style="filter:sepia(1) saturate(6) hue-rotate(-9deg) brightness(1.03) drop-shadow(6px 10px 7px rgba(0,0,0,.55))"><div class="t" style="left:0; width:100%; top:44px; font-size:118px">Jetzt erhältlich</div></div>
          <div class="w" id="shops" style="left:90px; top:1590px; width:900px"><img class="b sh" src="assets/img/band_creme.png"><div class="t" style="left:0; width:100%; top:78px; font-size:29px; font-family:Archivo; font-weight:800; letter-spacing:1px">Amazon · Thalia · Hugendubel · bücher.de</div></div>
        </div>
      </div>

      <!-- Übergang: Zeitungsseite wischt durchs Bild -->
      <div class="w" id="wipe" style="left:-130px; top:1950px; width:1340px; z-index:60; transform:rotate(-4deg)"><img class="b shL" src="assets/img/zeitung.png"></div>

      <div id="vig" class="clip" data-start="0" data-duration="30"></div>
      <div id="grain" class="clip" data-start="0" data-duration="30"></div>
      <div id="flash" class="clip" data-start="0" data-duration="30"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const FPS = 12;                                  // Stop-Motion: Bewegung „auf Zweien“ (12 Schritte/s)
      const q = (t) => Math.round(t * FPS) / FPS;      // Startzeit aufs Stop-Motion-Raster
      const tl = gsap.timeline({ paused: true });
      const stepped = (ease, dur) => { const n = Math.max(1, Math.round(dur * FPS)); const e = gsap.parseEase(ease || "power2.out"); return (p) => e(Math.floor(p * n + 1e-6) / n); };
      // Stop-Motion-Tween: from/to wie fromTo, aber in 12er-Schritten
      function S(sel, from, to, t, dur, ease, imm) {
        tl.fromTo(sel, from, Object.assign({ duration: dur, ease: stepped(ease, dur), immediateRender: !!imm }, to), q(t));
      }
      const T = (sel, to, t, dur, ease) => tl.to(sel, Object.assign({ duration: dur, ease: stepped(ease, dur) }, to), q(t));

      // ---------- Boil: globale Zufallswerte je Schritt (8 Schritte/s) ----------
      let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1;
      for (let i = 0; i <= 30 * 8; i++) tl.set(document.documentElement, { "--b1": rnd(), "--b2": rnd(), "--b3": rnd() }, i / 8);
      // jede Ebene bekommt eigene Gewichte, damit nicht alles synchron zittert
      document.querySelectorAll(".b").forEach((el, i) => {
        const s = (k) => ((Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1);
        if (!el.style.getPropertyValue("--kx")) el.style.setProperty("--kx", (s(1) * 2.2).toFixed(2));
        if (!el.style.getPropertyValue("--ky")) el.style.setProperty("--ky", (s(2) * 2.2).toFixed(2));
        if (!el.style.getPropertyValue("--kr")) el.style.setProperty("--kr", (s(3) * 0.5).toFixed(2));
      });
      // Korn springt mit
      for (let i = 0; i <= 30 * 12; i++) tl.set("#grain", { x: ((i * 137) % 540) - 270, y: ((i * 251) % 960) - 480 }, i / 12);

      gsap.set(".pop", { transformOrigin: "50% 100%", transformPerspective: 1500 });

      // =============== A · 0–6 s ===============
      S("#aCam", { scale: 1 }, { scale: 1.12, transformOrigin: "550px 1150px" }, 0, 5.6, "sine.inOut", true);
      S(["#aF1", "#aF2", "#aF3"], { y: 0 }, { y: (i) => [-60, 40, -30][i] }, 0, 5.6, "none", true);
      S("#aScrap", { y: 260, rotation: -18, opacity: 0 }, { y: 0, rotation: -3, opacity: 1 }, 0.1, 0.5, "back.out(1.6)", true);
      S("#aMan", { y: 120, opacity: 0 }, { y: 0, opacity: 1 }, 0.5, 0.4, "back.out(2)", true);
      S("#aCard", { y: -900, rotation: 9 }, { y: 0, rotation: -3 }, 1.0, 0.5, "back.out(1.3)", true);
      ["#aw1", "#aw2", "#aw3"].forEach((w, i) => S(w, { scale: 1.6, opacity: 0, rotation: [-6, 5, -3][i] }, { scale: 1, opacity: 1, rotation: [-2, 2, -1][i] }, 1.75 + i * 0.5, 0.25, "power3.out", true));
      T("#aMan", { rotation: -2, x: -6 }, 3.6, 0.5, "none");      // kleiner Ruck: er hebt den Kopf nicht – noch nicht
      // Wisch-Übergang
      S("#wipe", { y: 0 }, { y: -2050 }, 5.25, 0.5, "power2.in", true);
      T("#wipe", { y: -4300 }, 5.85, 0.55, "power2.out");

      // =============== B · 6–13 s · 03:00 Uhr ===============
      tl.set("#night", { opacity: 0.55 }, 0);
      gsap.set(["#clouds", "#sunL", "#c1", "#c2", "#c3", "#jubel"], { opacity: 0 });
      S("#kiosk", { rotationX: 88 }, { rotationX: 0 }, 6.15, 0.65, "back.out(1.4)", true);
      S("#laptop", { rotationX: 88 }, { rotationX: 0 }, 6.9, 0.5, "back.out(1.6)", true);
      S(".star", { scale: 0 }, { scale: 1, stagger: 0.17 }, 6.4, 0.25, "back.out(3)", true);
      S("#moon", { y: 200, opacity: 0 }, { y: 0, opacity: 1 }, 6.2, 0.6, "power2.out", true);
      for (let i = 0; i < 26; i++) tl.set(".star", { opacity: (j) => (Math.sin(i * 1.7 + j * 2.3) > 0.55 ? 0.35 : 1) }, q(7.2 + i * 0.22));
      // Uhr springt
      gsap.set([".clockb"], { opacity: 0 });
      tl.set("#clock", { opacity: 0 }, q(7.6)); tl.set("#clock1", { opacity: 1 }, q(7.6));
      tl.set("#clock1", { opacity: 0 }, q(8.6)); tl.set("#clock2", { opacity: 1 }, q(8.6));
      S("#ck2", { scale: 1.5 }, { scale: 1 }, 8.6, 0.25, "back.out(3)");
      // Fensterlicht flackert
      for (let i = 0; i < 30; i++) tl.set("#glow", { opacity: [0.5, 0.65, 0.42, 0.7, 0.55][i % 5] }, q(6.8 + i * 0.2));
      // Tippen: Figur zuckt
      for (let i = 0; i < 20; i++) tl.set("#laptop", { y: i % 2 ? -3 : 0, rotation: i % 3 ? 0.4 : -0.3 }, q(7.5 + i * 0.25));
      S("#bCap", { y: 300, rotation: 6 }, { y: 0, rotation: -2 }, 9.2, 0.4, "back.out(1.5)", true);
      // leichte Kamerafahrt Richtung Kiosk
      S("#world", { scale: 1, y: 0 }, { scale: 1.06, y: 30 }, 6.0, 6.5, "sine.inOut", true);

      // =============== C · 13–22.6 s · die Stadt wächst ===============
      T("#bCap", { y: 400, rotation: 10 }, 12.6, 0.35, "power2.in");
      T("#laptop", { rotationX: 90 }, 12.9, 0.35, "power2.in");
      T("#world", { scale: 0.62, y: 150 }, 13.0, 2.6, "power2.inOut");
      T("#far", { scale: 0.86, y: 70 }, 13.0, 2.6, "power2.inOut");
      T("#glow", { opacity: 0.25 }, 13.0, 1.0, "none");
      const towers = [["#tZeit", 13.35], ["#tKraft", 13.8], ["#tWeiss", 14.2], ["#tGrau", 14.55], ["#tDunkel", 14.85]];
      gsap.set(towers.map((x) => x[0]).concat("#tHaupt"), { rotationX: 90 });
      towers.forEach(([s, t]) => S(s, { rotationX: 90 }, { rotationX: 0 }, t, 0.5, "back.out(1.5)"));
      S("#tHaupt", { rotationX: 90 }, { rotationX: 0 }, 15.6, 0.75, "back.out(1.3)");
      // Nacht -> Tag
      T("#night", { opacity: 0.12 }, 14.2, 2.4, "sine.inOut");
      T(["#moon", ".star"], { opacity: 0, y: 120 }, 14.2, 0.8, "power2.in");
      S("#clouds", { opacity: 0, x: -60 }, { opacity: 1, x: 0 }, 15.0, 0.6, "power2.out");
      S(["#cl1", "#cl2", "#cl3"], { x: 0 }, { x: (i) => [70, -60, 40][i] }, 15.0, 15, "none");
      S("#sunL", { opacity: 0 }, { opacity: 1 }, 15.9, 0.3, "none");
      S("#sun", { y: 480 }, { y: 0 }, 15.9, 2.6, "power2.out");
      // Aussagen vom Buch-Untertitel
      S("#c1", { opacity: 0, y: -260, rotation: -9 }, { opacity: 1, y: 0, rotation: -3 }, 16.7, 0.35, "back.out(1.6)");
      S("#c2", { opacity: 0, x: 500, rotation: 8 }, { opacity: 1, x: 0, rotation: 2 }, 17.4, 0.35, "back.out(1.6)");
      S("#c3", { opacity: 0, y: 300, rotation: 6 }, { opacity: 1, y: 0, rotation: -1.5 }, 18.1, 0.35, "back.out(1.6)");
      // Höhepunkt: er steht oben – in Gelb
      S("#jubel", { opacity: 1, scaleY: 0, scaleX: 0.6 }, { scaleY: 1, scaleX: 1 }, 19.0, 0.45, "back.out(2.2)");
      tl.set("#sunY", { opacity: 1 }, q(19.1));
      S("#flash", { opacity: 0.55 }, { opacity: 0 }, 19.0, 0.5, "power2.out");
      S("#sun", { scale: 1 }, { scale: 1.12 }, 19.0, 0.5, "back.out(3)");
      for (let i = 0; i < 12; i++) tl.set("#jubel", { rotation: i % 2 ? 2.5 : -2.5, y: i % 2 ? -8 : 0 }, q(19.6 + i * 0.25));
