<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url(assets/fonts/inter-tight-latin-800-normal.woff2) format("woff2"); }
      :root { --y: #f7c91e; --w: #f2f0ea; --k: #0a0a0a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--k); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--k); color: var(--w); font-family: "Inter Tight", sans-serif; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .v { object-fit: cover; }
      .abs { position: absolute; }
      .cap { font-weight: 800; font-size: 30px; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
      .big { font-family: "Anton"; text-transform: uppercase; line-height: .9; letter-spacing: .01em; white-space: nowrap; }
      .rule { height: 3px; background: var(--y); transform-origin: 0 50%; }
      .mask { overflow: hidden; display: block; padding-bottom: .04em; }
      .mask > span { display: inline-block; }
      #grain { z-index: 90; opacity: .12; mix-blend-mode: overlay; width: 2160px; height: 3840px; inset: auto; left: -540px; top: -960px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #vig { z-index: 89; background: radial-gradient(120% 80% at 50% 50%, transparent 45%, rgba(0,0,0,.8) 100%); }
      #shade { z-index: 30; background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, transparent 20%, transparent 60%, rgba(0,0,0,.85) 100%); }
      #leak { z-index: 88; mix-blend-mode: screen; opacity: 0; background: radial-gradient(60% 40% at 85% 20%, rgba(255,190,60,.85), transparent 70%), radial-gradient(50% 35% at 10% 85%, rgba(255,120,40,.6), transparent 70%); }
      #vHero { -webkit-mask-image: linear-gradient(180deg,#000 82%,transparent 97%); mask-image: linear-gradient(180deg,#000 82%,transparent 97%); }
      #flash { z-index: 95; background: #fff; opacity: 0; }
      #black { z-index: 94; background: #000; opacity: 1; }
      .t { z-index: 40; }
      .cta { left: 190px; width: 700px; height: 104px; border: 3px solid var(--y); color: var(--y); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 32px; letter-spacing: .3em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.8" data-width="1080" data-height="1920" data-fps="30">
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="20.8" data-volume="1"></audio>

      <!-- Kamerafahrten (Blender) -->
      <video id="vEye" class="clip v" src="assets/video/eye.mp4" data-start="0" data-duration="3.32" muted playsinline style="z-index:1"></video>
      <video id="vSpine" class="clip v" src="assets/video/spine.mp4" data-start="3.32" data-duration="3.2" muted playsinline style="z-index:2"></video>
      <video id="vTitle" class="clip v" src="assets/video/title.mp4" data-start="6.52" data-duration="3.0" muted playsinline style="z-index:3"></video>
      <!-- Montage im Beat -->
      <video id="cut1" class="clip v cut" src="assets/video/eye.mp4" data-start="9.52" data-duration="0.4" data-media-start="2.2" muted playsinline style="z-index:4"></video>
      <video id="cut2" class="clip v cut" src="assets/video/spine.mp4" data-start="9.92" data-duration="0.4" data-media-start="1.6" muted playsinline style="z-index:5"></video>
      <video id="cut3" class="clip v cut" src="assets/video/title.mp4" data-start="10.32" data-duration="0.4" data-media-start="0.4" muted playsinline style="z-index:6"></video>
      <video id="cut4" class="clip v cut" src="assets/video/eye.mp4" data-start="10.72" data-duration="0.4" data-media-start="0.6" muted playsinline style="z-index:7"></video>
      <video id="cut5" class="clip v cut" src="assets/video/spine.mp4" data-start="11.12" data-duration="0.4" data-media-start="2.6" muted playsinline style="z-index:8"></video>
      <video id="cut6" class="clip v cut" src="assets/video/title.mp4" data-start="11.52" data-duration="0.4" data-media-start="0.9" muted playsinline style="z-index:9"></video>
      <video id="cut7" class="clip v cut" src="assets/video/eye.mp4" data-start="11.92" data-duration="0.2" data-media-start="1.6" muted playsinline style="z-index:10"></video>
      <video id="cut8" class="clip v cut" src="assets/video/spine.mp4" data-start="12.12" data-duration="0.2" data-media-start="0.6" muted playsinline style="z-index:11"></video>
      <video id="cut9" class="clip v cut" src="assets/video/title.mp4" data-start="12.32" data-duration="0.2" data-media-start="1.2" muted playsinline style="z-index:12"></video>
      <video id="cut10" class="clip v cut" src="assets/video/eye.mp4" data-start="12.52" data-duration="0.2" data-media-start="2.8" muted playsinline style="z-index:13"></video>
      <video id="cut11" class="clip v cut" src="assets/video/spine.mp4" data-start="12.72" data-duration="0.23" data-media-start="2.0" muted playsinline style="z-index:14"></video>
      <!-- Hero -->
      <video id="vHero" class="clip v" src="assets/video/book.mp4" data-start="12.95" data-duration="7.85" muted playsinline style="z-index:20"></video>

      <div id="shade" class="clip" data-start="0" data-duration="20.8"></div>

      <!-- Typografie -->
      <div id="t1" class="clip t" data-start="0" data-duration="3.32">
        <div class="abs rule" id="r1" style="left:90px;top:1560px;width:90px"></div>
        <div class="abs cap" style="left:90px;top:1600px"><span class="mask"><span id="c1">„Aus dem wird nichts.“</span></span></div>
      </div>
      <div id="t2" class="clip t" data-start="3.32" data-duration="3.2">
        <div class="abs cap" style="left:90px;top:1400px"><span class="mask"><span id="o1">Ohne</span></span></div>
        <div class="abs big" style="left:84px;top:1450px;font-size:250px;color:var(--y)"><span class="mask"><span id="w1">Plan.</span></span></div>
      </div>
      <div id="t3" class="clip t" data-start="6.52" data-duration="3.0">
        <div class="abs cap" style="left:90px;top:1400px"><span class="mask"><span id="o2">Ohne</span></span></div>
        <div class="abs big" style="left:84px;top:1450px;font-size:220px;color:var(--w)"><span class="mask"><span id="w2">Ausreden.</span></span></div>
      </div>
      <div id="t4" class="clip t" data-start="9.52" data-duration="3.43">
        <div class="abs cap" style="left:90px;top:1400px"><span class="mask"><span id="o3">Ohne</span></span></div>
        <div class="abs big" style="left:84px;top:1450px;font-size:166px;color:var(--y)"><span class="mask"><span id="w3">Kompromisse.</span></span></div>
      </div>
      <div id="t5" class="clip t" data-start="12.95" data-duration="7.85">
        <div class="abs cap" style="left:0;width:1080px;text-align:center;top:190px"><span class="mask"><span id="q1">Du siehst das Ergebnis.</span></span></div>
        <div class="abs cap" style="left:0;width:1080px;text-align:center;top:244px;color:var(--y)"><span class="mask"><span id="q2">Nicht, was es gekostet hat.</span></span></div>
        <div class="abs big" style="left:0;width:1080px;text-align:center;top:1490px;font-size:104px;color:var(--y)"><span class="mask"><span id="tt">Die Lizenz zum Erfolg</span></span></div>
        <div class="abs cap" style="left:0;width:1080px;text-align:center;top:1604px;font-size:24px;color:#bbb"><span class="mask"><span id="au">Soheil Hosseini</span></span></div>
        <div class="abs cta" id="cta" style="top:1672px">Jetzt im Handel</div>
        <div class="abs cap" id="shops" style="left:0;width:1080px;text-align:center;top:1806px;font-size:20px;color:#9a9a9a;letter-spacing:.24em">Amazon · Thalia · Hugendubel · bücher.de</div>
      </div>

      <div id="vig" class="clip" data-start="0" data-duration="20.8"></div>
      <div id="leak" class="clip" data-start="0" data-duration="20.8"></div>
      <div id="grain" class="clip" data-start="0" data-duration="20.8"></div>
      <div id="black" class="clip" data-start="0" data-duration="20.8"></div>
      <div id="flash" class="clip" data-start="0" data-duration="20.8"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      let seed = 9; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; const R = (a, b) => a + (b - a) * rnd();
      const up = (sel, t, d = 0.6) => tl.from(sel, { yPercent: 115, duration: d, ease: "expo.out" }, t);
      const flash = (t, o = 0.85, d = 0.22) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const leak = (t, o = 0.9) => tl.fromTo("#leak", { opacity: o }, { opacity: 0, duration: 0.9, ease: "sine.out", immediateRender: false }, t);
      const punch = (sel, t, s = 1.12) => tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, t);
      for (let i = 0; i < 20.8 * 24; i++) tl.set("#grain", { x: Math.round(R(-500, 500)), y: Math.round(R(-900, 900)) }, i / 24);

      // Aufblende aus Schwarz
      tl.fromTo("#black", { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 0.05);
      // 1 · Auge
      tl.fromTo("#vEye", { scale: 1.08 }, { scale: 1.0, duration: 3.32, ease: "none" }, 0);
      tl.from("#r1", { scaleX: 0, duration: 0.7, ease: "expo.out" }, 0.9); up("#c1", 1.1, 0.8);
      // 2 · Rücken
      flash(3.32, 0.7); leak(3.32); punch("#vSpine", 3.32);
      up("#o1", 3.5); up("#w1", 3.72, 0.55);
      // 3 · Titel-Makro
      flash(6.52, 0.7); leak(6.52); punch("#vTitle", 6.52);
      up("#o2", 6.7); up("#w2", 6.92, 0.55);
      // 4 · Montage im Beat
      $$(".cut").forEach((c, i) => { const t = parseFloat(c.dataset.start); punch(c, t, 1.18); flash(t, i > 5 ? 0.55 : 0.35, 0.12); });
      up("#o3", 9.6); up("#w3", 9.75, 0.5);
      // 5 · Drop: Hero
      flash(12.95, 1, 0.6); leak(12.95, 1);
      up("#q1", 14.0, 0.8); up("#q2", 15.1, 0.8);
      tl.to(["#q1", "#q2"], { opacity: 0.45, duration: 0.6 }, 17.0);
      tl.to("#vHero", { scale: 0.93, y: -90, duration: 1.0, ease: "power3.inOut" }, 16.9);
      up("#tt", 17.3, 0.7); up("#au", 17.8);
      tl.fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 18.5);
      tl.set("#cta", { opacity: 0 }, 0);
      tl.from("#shops", { opacity: 0, duration: 0.6 }, 19.0);
      tl.to("#cta", { backgroundColor: "rgba(247,201,30,1)", color: "#0a0a0a", duration: 0.35, ease: "power2.out" }, 19.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
