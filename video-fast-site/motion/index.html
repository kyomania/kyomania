<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="43.6" data-width="1920" data-height="1080">

      <!-- Diner: KI-Szenen (Seedance, lippensynchron auf ElevenLabs-v4-Stimmen) -->
      <video id="v-mann" class="clip full" src="assets/video/mann.mp4" data-start="0" data-duration="4.6" data-media-start="0.25" data-track-index="1" data-has-audio="true" data-volume="1" playsinline style="z-index:1"></video>
      <video id="v-oma" class="clip full" src="assets/video/oma.mp4" data-start="4.6" data-duration="3.0" data-media-start="0.25" data-track-index="1" data-has-audio="true" data-volume="1" playsinline style="z-index:2"></video>
      <video id="v-vortex" class="clip full" src="assets/video/vortex.mp4" data-start="7.6" data-duration="5.4" data-media-start="0" data-track-index="1" data-has-audio="true" data-volume="1" playsinline style="z-index:3"></video>

      <!-- Motion Design im Handy: startet und endet auf exakt dem Handy-Screen-Frame -->
      <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html" data-start="13.0" data-duration="4.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="cache" data-composition-id="cache" data-composition-src="compositions/cache.html" data-start="17.7" data-duration="3.9" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="images" data-composition-id="images" data-composition-src="compositions/images.html" data-start="21.6" data-duration="4.3" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="ddos" data-composition-id="ddos" data-composition-src="compositions/ddos.html" data-start="25.9" data-duration="2.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="setup" data-composition-id="setup" data-composition-src="compositions/setup.html" data-start="28.6" data-duration="4.7" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>

      <!-- Rueckweg: der Strudel rueckwaerts, dann der Mann mit Kaffee -->
      <video id="v-pullout" class="clip full" src="assets/video/pullout.mp4" data-start="33.3" data-duration="3.0" data-track-index="1" data-has-audio="true" data-volume="0.9" playsinline style="z-index:5"></video>
      <video id="v-ende" class="clip full" src="assets/video/ende.mp4" data-start="36.3" data-duration="3.3" data-media-start="0.6" data-track-index="1" data-has-audio="true" data-volume="1" playsinline style="z-index:6"></video>

      <!-- Endcard mit animiertem Logo -->
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="39.6" data-duration="4.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:7"></div>

      <!-- Ton -->
      <audio id="a-vo" src="assets/audio/vo.mp3" data-start="13.05" data-track-index="10" data-volume="1"></audio>
      <audio id="a-music" src="assets/audio/music.mp3" data-start="3.0" data-duration="40.0" data-track-index="11" data-volume="0.28" data-fade-out="1.2"></audio>
      <audio id="a-roll" src="assets/audio/sfx_rollator.mp3" data-start="4.7" data-duration="2.9" data-track-index="12" data-volume="0.7" data-fade-out="0.3"></audio>
      <audio id="a-logo" src="assets/audio/sfx_logo.mp3" data-start="40.4" data-track-index="14" data-volume="0.8"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
