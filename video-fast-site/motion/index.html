<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40.1" data-width="1920" data-height="1080">

      <!-- Diner: KI-Szenen (Seedance). Bild stumm, Ton = ElevenLabs v4 (Julian / Mabel) -->
      <video id="v-mann" class="clip full" src="assets/video/mann.mp4" data-start="0" data-duration="4.6" data-media-start="0.25" data-track-index="1" muted playsinline style="z-index:1"></video>
      <video id="v-oma" class="clip full" src="assets/video/oma.mp4" data-start="4.6" data-duration="3.0" data-media-start="0.25" data-track-index="1" muted playsinline style="z-index:2"></video>

      <!-- Motion Design: startet auf exakt dem Handy-Screen-Frame -->
      <div id="xspeed" data-composition-id="xspeed" data-composition-src="compositions/x-speed.html" data-start="13.0" data-duration="4.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>

</html>
