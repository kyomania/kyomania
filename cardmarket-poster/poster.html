<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@500;700&display=swap');
*{margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#7d8589;font-family:Inter}
#lg{position:absolute;width:880px;left:100px;top:880px;opacity:0}#wb{position:absolute;inset:0;background:#d9dee1;opacity:0}
</style><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script></head><body>
<div id="wb"></div><img id="lg" src="logo_original.png">
<script type="module">
import * as THREE from 'three';
await document.fonts.load('900 100px "Big Shoulders Display"');await document.fonts.load('700 20px Inter');
// poster texture
const PW=1200,PH=1800;const pc=document.createElement('canvas');pc.width=PW;pc.height=PH;const x=pc.getContext('2d');
x.fillStyle='#0b0f14';x.fillRect(0,0,PW,PH);
const ink='#efe3d8',mint='#5ee0d2';x.textBaseline='alphabetic';
function line(txt,y,h,col){x.font=`900 ${h}px "Big Shoulders Display"`;const w=x.measureText(txt).width;x.save();x.translate(90,y);x.scale((PW-180)*0.93/w,1);x.fillStyle=col;x.fillText(txt,0,0);x.restore();}
line('TRACK',600,640,ink);line('TRADE',1150,640,ink);line('COLLECT.',1700,640,ink);
x.fillStyle=mint;x.font='900 70px "Big Shoulders Display"';x.fillText('→',980,1240);x.fillText('←',1060,1240);
x.fillStyle='#0b0f14';x.fillRect(820,1180,340,130);x.fillStyle=ink;x.font='700 22px Inter';x.fillText('CARDMARKET.PRO',840,1215);x.fillText('TCG & SPORTS CARDS',840,1245);x.fillText('WORLDWIDE  2026',840,1275);
x.fillStyle=mint;x.font='900 70px "Big Shoulders Display"';x.fillText('→ ←',860,1300);
const tex=new THREE.CanvasTexture(pc);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(1080,1920);r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;r.shadowMap.enabled=true;document.body.prepend(r.domElement);r.domElement.style.position='absolute';
const scene=new THREE.Scene();scene.background=new THREE.Color('#77797b');
const cam=new THREE.PerspectiveCamera(32,1080/1920,0.1,200);
scene.add(new THREE.HemisphereLight('#ffffff','#5b6366',1.5));const dl=new THREE.DirectionalLight('#ffffff',2.2);dl.position.set(-5,8,10);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-8,right:8,top:10,bottom:-10});scene.add(dl);
const rim=new THREE.DirectionalLight('#9ff5ea',1.2);rim.position.set(6,-2,-4);scene.add(rim);
const W=6,H=9;
const side=new THREE.MeshStandardMaterial({map:tex,roughness:0.5});const face=new THREE.MeshStandardMaterial({map:tex,roughness:0.5});
let sd=5;const R=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const cells=[];const grp=new THREE.Group();scene.add(grp);
let cx=0;let ci=0;while(cx<1-1e-6){const cwn=Math.min(1-cx,[0.018,0.025,0.035,0.05,0.07][Math.floor(R()*5)]);
 let ry=0;while(ry<1-1e-6){const chn=Math.min(1-ry,0.08+R()*0.45);
  const u0=cx,u1=cx+cwn,v1=1-ry,v0=1-ry-chn;const w=cwn*W,h=chn*H;
  const g=new THREE.BoxGeometry(w,h,1);const uv=g.attributes.uv;
  // faces: 0 +x(0-3),1 -x(4-7),2 +y(8-11),3 -y(12-15),4 +z(16-19),5 -z(20-23)
  const setF=(f,a,b,c,d)=>{uv.setXY(f*4,...a);uv.setXY(f*4+1,...b);uv.setXY(f*4+2,...c);uv.setXY(f*4+3,...d)};
  setF(4,[u0,v1],[u1,v1],[u0,v0],[u1,v0]);
  setF(0,[u1-0.001,v1],[u1-0.001,v1],[u1-0.001,v0],[u1-0.001,v0]);
  setF(1,[u0+0.001,v1],[u0+0.001,v1],[u0+0.001,v0],[u0+0.001,v0]);
  setF(2,[u0,v1-0.001],[u1,v1-0.001],[u0,v1-0.001],[u1,v1-0.001]);
  setF(3,[u0,v0+0.001],[u1,v0+0.001],[u0,v0+0.001],[u1,v0+0.001]);
  setF(5,[0.001,0.999],[0.001,0.999],[0.001,0.999],[0.001,0.999]);
  uv.needsUpdate=true;const m=new THREE.Mesh(g,[side,side,side,side,face,side]);m.castShadow=m.receiveShadow=true;
  m.position.set(-W/2+W*(cx+cwn/2),H/2-H*(ry+chn/2),0);grp.add(m);cells.push({m,d:R(),p:R(),c:ci,rr:ry*30});ry+=chn;}
 cx+=cwn;ci++;}
// black pillars sticking out
const blk=new THREE.MeshStandardMaterial({color:'#0d0f11',roughness:0.55});
for(let i=0;i<14;i++){const w=0.1+R()*0.4,h=2+R()*5;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.6+R()*1.4),blk);m.castShadow=true;const sx=(R()<0.5?-1:1)*(W/2-R()*0.8);m.position.set(sx,(R()-0.5)*H*0.9,-0.4-R()*0.6);grp.add(m);}
// glass slabs
const gm=new THREE.MeshPhysicalMaterial({color:'#5ee0d2',transparent:true,opacity:0.5,roughness:0.15,metalness:0,clearcoat:1,emissive:'#1a8f84',emissiveIntensity:0.35});
const gm2=gm.clone();gm2.color.set('#9ff5ea');gm2.opacity=0.4;
const slabs=[];for(let i=0;i<5;i++){const w=0.06+R()*0.2,h=2+R()*5;const s=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.5+R()*1.2),i%3?gm:gm2);grp.add(s);slabs.push({s,x:-W/2+R()*W,h,sp:0.6+R()*1.6,ph:R()*10,z:0.4+R()*1.4})}
const C=v=>Math.min(Math.max(v,0),1),E=v=>1-Math.pow(1-C(v),3),EIO=v=>{v=C(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
// shots: [start, type, params]
const SH=[[0,'orbitL'],[1.92,'flat'],[2.4,'orbitR'],[4.32,'close'],[5.71,'orbitL2'],[7.13,'flat'],[7.6,'top'],[9.0,'out']];
window.seek=function(t){
 let si=0;SH.forEach((s,k)=>{if(t>=s[0])si=k});const sh=SH[si][1],lt=t-SH[si][0];
 // extrusion amount
 let ex=1;if(sh=='flat')ex=0;else ex=E(lt/0.35);if(sh=='out')ex=1-EIO(lt/0.8);
 cells.forEach(o=>{const wave=Math.sin(t*2.2+o.c*0.35+o.rr*0.1)*0.5+0.5;const d=(0.05+Math.pow(o.d,2)*2.2*(0.55+0.45*wave))*ex;o.m.scale.z=0.02+d;o.m.position.z=(0.02+d)/2+ (o.p>0.85?Math.sin(t*3+o.d*9)*0.15*ex:0);});
 slabs.forEach(o=>{const y=((t*o.sp+o.ph)%3)/3*(H+o.h)-(H+o.h)/2;o.s.position.set(o.x,y,o.z*ex+0.1);o.s.visible=ex>0.05;});
 // camera
 const T=new THREE.Vector3(0,0,0.3);
 if(sh=='flat'){cam.position.set(0,0,19.5);cam.fov=32;}
 if(sh=='orbitL'){const a=-0.32+lt*0.06;cam.position.set(Math.sin(a)*15,0.3,Math.cos(a)*15);cam.fov=36;}
 if(sh=='orbitR'){const a=0.3-lt*0.06;cam.position.set(Math.sin(a)*19,-0.3+lt*0.15,Math.cos(a)*19);cam.fov=34;}
 if(sh=='close'){cam.position.set(2.2-lt*0.3,-0.5,7.5);T.set(-0.2-lt*0.2,-0.6,0.6);cam.fov=40;}
 if(sh=='orbitL2'){const a=-0.45+lt*0.12;cam.position.set(Math.sin(a)*11,1.0-lt*0.3,Math.cos(a)*11);cam.fov=36;}
 if(sh=='top'){const a=0.38-lt*0.05;cam.position.set(Math.sin(a)*17,-1.5+lt*0.3,Math.cos(a)*17);cam.fov=38;}
 if(sh=='out'){const k=EIO(lt/0.9);cam.position.set(0,0,19.5+k*6);cam.fov=32;}
 cam.lookAt(T);cam.updateProjectionMatrix();
 grp.rotation.z=sh=='orbitR'?0.04:0;
 r.render(scene,cam);
 const w=document.getElementById('wb'),l=document.getElementById('lg');const q=t-9.9;w.style.opacity=E(q/0.35);l.style.opacity=E((q-0.25)/0.4);l.style.transform=`scale(${0.94+0.06*E((q-0.25)/0.9)})`;
};
window.ready=true;seek(0);
</script></body></html>
