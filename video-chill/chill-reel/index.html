<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; font-weight: 400; src: url(assets/fonts/fraunces-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Fraunces"; font-weight: 400; font-style: italic; src: url(assets/fonts/fraunces-latin-400-italic.woff2) format("woff2"); }
      @font-face { font-family: "Fraunces"; font-weight: 900; src: url(assets/fonts/fraunces-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Fraunces"; font-weight: 900; font-style: italic; src: url(assets/fonts/fraunces-latin-900-italic.woff2) format("woff2"); }
      @font-face { font-family: "JB Mono"; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "JB Mono"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
      :root { --blue: #2d4c66; --deep: #16273a; --cream: #f6efe2; --sun1: #ffd27a; --sun2: #ff7a59; --sun3: #c43d72; --alarm: #ff3b3b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--blue); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--blue); font-family: "Fraunces", serif; color: var(--cream); }
      .abs { position: absolute; }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #world { position: absolute; inset: 0; transform-origin: 540px 1000px; }

      /* background */
      #bgBlue { background: radial-gradient(120% 70% at 50% 40%, #39607f 0%, #2d4c66 45%, #1b3046 100%); }
      #bgDusk { background: linear-gradient(180deg, #15203d 0%, #2a3566 38%, #7a3f72 68%, #d9636a 88%, #f2a066 100%); opacity: 0; }
      #sun { left: 90px; top: 520px; width: 900px; height: 900px; border-radius: 50%;
        background: linear-gradient(180deg, var(--sun1) 0%, #ffb067 35%, var(--sun2) 62%, var(--sun3) 100%);
        -webkit-mask-image: linear-gradient(180deg, #000 0 52%, transparent 52% 55%, #000 55% 62%, transparent 62% 66.5%, #000 66.5% 72%, transparent 72% 77.5%, #000 77.5% 82%, transparent 82% 88.5%, #000 88.5% 91%, transparent 91%);
        box-shadow: 0 0 0 0 transparent; }
      #sunGlow { left: -260px; top: 180px; width: 1600px; height: 1600px; border-radius: 50%; background: radial-gradient(circle, rgba(255,170,110,0.55) 0%, rgba(255,120,110,0.18) 35%, transparent 65%); opacity: 0; }
      #rays { left: -660px; top: -40px; width: 2400px; height: 2400px; opacity: 0;
        background: repeating-conic-gradient(from 0deg, rgba(255,220,160,0.10) 0deg 6deg, transparent 6deg 18deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%); }

      /* typography */
      .ln { display: block; overflow: hidden; padding-bottom: 0.08em; }
      .ln > span { display: inline-block; }
      #tag { left: 72px; top: 118px; font-family: "JB Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.22em; color: #16273a;
        background: var(--cream); padding: 14px 22px 12px; border-radius: 10px; display: flex; align-items: center; gap: 14px; }
      #tag .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--sun2); }
      #tag .cur { width: 18px; height: 34px; background: #16273a; }
      #tag .ch { opacity: 0; }
      #l1 { left: 72px; top: 196px; font-size: 96px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.05; }
      #stressBox { left: 66px; top: 300px; height: 190px; width: 960px; }
      #stressHot { position: absolute; left: 0; top: 0; font-family: "JB Mono", monospace; font-weight: 700; font-size: 150px; color: var(--alarm); letter-spacing: -0.02em; line-height: 1; text-shadow: 6px 6px 0 #16273a; }
      #stressHot span { display: inline-block; }
      #stressCalm { position: absolute; left: 4px; top: -18px; font-size: 176px; font-weight: 900; font-style: italic; letter-spacing: -0.035em; line-height: 1;
        color: #ffe2b4; text-shadow: 0 6px 30px rgba(255,140,90,0.45); }
      #stressCalm span { display: inline-block; }
      #l3 { left: 72px; top: 486px; font-size: 76px; font-weight: 400; letter-spacing: -0.015em; text-shadow: 0 3px 18px rgba(22,39,58,0.85), 0 1px 3px rgba(22,39,58,0.9); }
      #l4 { left: 0; width: 1080px; text-align: center; top: 1452px; font-size: 236px; font-weight: 900; font-style: italic; letter-spacing: -0.045em; line-height: 1; color: #ff5f45; text-shadow: 0 10px 0 #16273a, 0 24px 40px rgba(0,0,0,0.35); transform-origin: 30% 60%; white-space: nowrap; }
      #swoosh { left: 90px; top: 1690px; width: 900px; height: 120px; overflow: visible; }

      /* dog */
      #dogrig { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1520px; }
      #dog { position: absolute; left: 0; top: -8px; width: 1080px; height: 1935px; }
      .lens { position: absolute; width: 206px; height: 206px; border-radius: 50%; overflow: hidden; mix-blend-mode: screen; opacity: 0; }
      .lens .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #2a2f6a 0%, #8a3b78 45%, #ff7a59 70%, #ffc46e 100%); }
      .lens .lsun { position: absolute; left: 48px; top: 70px; width: 110px; height: 110px; border-radius: 50%; background: linear-gradient(180deg, #fff1b8, #ff9c5c);
        -webkit-mask-image: linear-gradient(180deg, #000 0 55%, transparent 55% 62%, #000 62% 70%, transparent 70% 78%, #000 78% 85%, transparent 85%); }
      .lens .sea { position: absolute; left: 0; top: 150px; width: 206px; height: 60px; background: repeating-linear-gradient(180deg, rgba(20,20,60,0.85) 0 6px, rgba(255,140,90,0.5) 6px 9px); }
      .lens .glint { position: absolute; left: -120px; top: -60px; width: 46px; height: 340px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent); transform: rotate(32deg); }
      #lensL { left: 272px; top: 910px; }
      #lensR { left: 580px; top: 910px; }
      #ledge { left: 0; top: 1483px; width: 1080px; height: 445px; }
      #star { left: 0; top: 0; width: 120px; height: 120px; opacity: 0; mix-blend-mode: screen;
        background: radial-gradient(circle, #fff 0 6%, rgba(255,255,255,0.0) 30%), linear-gradient(0deg, transparent 47%, #fff 50%, transparent 53%), linear-gradient(90deg, transparent 47%, #fff 50%, transparent 53%); }

      /* chaos */
      .card { position: absolute; width: 660px; padding: 26px 30px; border-radius: 30px; background: rgba(250,250,252,0.97); color: #15151a; display: flex; gap: 22px; align-items: center;
        box-shadow: 0 24px 50px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.6) inset; }
      .card .ic { flex: none; width: 84px; height: 84px; border-radius: 20px; display: grid; place-items: center; font-family: "JB Mono", monospace; font-weight: 700; font-size: 40px; color: #fff; }
      .card .meta { font-family: "JB Mono", monospace; font-size: 28px; color: #6b6b78; letter-spacing: 0.04em; display: flex; justify-content: space-between; }
      .card .tx { font-family: "Fraunces", serif; font-weight: 900; font-size: 38px; line-height: 1.12; letter-spacing: -0.01em; margin-top: 4px; }
      .card .badge { position: absolute; right: -14px; top: -14px; min-width: 52px; height: 52px; padding: 0 12px; border-radius: 26px; background: var(--alarm); color: #fff; font-family: "JB Mono", monospace; font-weight: 700; font-size: 26px; display: grid; place-items: center; border: 4px solid #fff; }
      #counter { left: 0; width: 1080px; top: 64px; text-align: center; font-family: "JB Mono", monospace; font-weight: 700; font-size: 44px; letter-spacing: 0.08em; color: #fff; }
      #cn { counter-reset: num var(--n); } #cn::after { content: counter(num); }
      #counter b { display: inline-block; background: var(--alarm); padding: 10px 26px; border-radius: 16px; min-width: 520px; }
      #alarm { background: radial-gradient(90% 60% at 50% 50%, transparent 30%, rgba(255,30,50,0.65) 100%); opacity: 0; mix-blend-mode: multiply; }
      #flash { background: #fff; opacity: 0; }

      /* outro */
      #chip { left: 50%; top: 1806px; transform: translateX(-50%); font-family: "JB Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.14em; color: var(--cream);
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.22); padding: 18px 34px; border-radius: 999px; display: flex; gap: 18px; align-items: center; white-space: nowrap; }
      #chip .led { width: 20px; height: 20px; border-radius: 50%; background: #5fe38c; box-shadow: 0 0 18px #5fe38c; }
      .dust { position: absolute; border-radius: 50%; background: #ffe2b0; filter: blur(2px); opacity: 0; mix-blend-mode: screen; }
      #grain { z-index: 90; opacity: 0.16; mix-blend-mode: overlay; width: 2160px; height: 3840px; left: -540px; top: -960px; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>"); }
      #vig { z-index: 89; background: radial-gradient(110% 80% at 50% 45%, transparent 55%, rgba(5,10,25,0.55) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.5" data-width="1080" data-height="1920" data-fps="30">
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="12.5" data-volume="1"></audio>

      <div id="world">
        <div id="bgBlue" class="clip"></div>
        <div id="bgDusk" class="clip"></div>
        <div id="rays" class="abs"></div>
        <div id="sunGlow" class="abs"></div>
        <div id="sun" class="abs"></div>
        <div id="dustLayer" class="clip"></div>

        <!-- Typo (hinter dem Hund) -->
        <div id="tag" class="abs"><span class="dot"></span><span id="tagtx"></span><span class="cur"></span></div>
        <div id="l1" class="abs"><span class="ln"><span>Mach dir keinen</span></span></div>
        <div id="stressBox" class="abs">
          <div id="stressHot"></div>
          <div id="stressCalm"></div>
        </div>
        <div id="l3" class="abs"><span class="ln"><span>die Firma gehört dir</span></span></div>

        <!-- Hund -->
        <div id="dogrig">
          <img id="dog" src="assets/img/dog.png" alt="" />
          <div id="lensL" class="lens"><div class="sky"></div><div class="lsun"></div><div class="sea"></div><div class="glint"></div></div>
          <div id="lensR" class="lens"><div class="sky"></div><div class="lsun"></div><div class="sea"></div><div class="glint"></div></div>
          <div id="star" class="abs"></div>
        </div>
        <img id="ledge" class="abs" src="assets/img/ledge.png" alt="" />
        <div id="l4" class="abs">eh nicht.</div>
        <svg id="swoosh" class="abs" viewBox="0 0 900 120"><path id="swp" d="M10 70 C 180 20, 420 105, 600 55 S 840 40, 890 80" fill="none" stroke="#ffe2b4" stroke-width="16" stroke-linecap="round" /></svg>
        <div id="chip" class="abs"><span class="led"></span><span>STATUS: FEIERABEND</span></div>

        <!-- Chaos -->
        <div id="cards" class="clip"></div>
        <div id="counter" class="abs"><b id="cnum"><span id="cn"></span><span id="cplus" style="opacity:0">+</span> UNGELESEN</b></div>
      </div>
      <div id="alarm" class="clip"></div>
      <div id="flash" class="clip"></div>
      <div id="vig" class="clip"></div>
      <div id="grain" class="abs"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      let seed = 42; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; const R = (a, b) => a + (b - a) * rnd();
      const FPS = 30, DUR = 12.5, FREEZE = 2.4, BEAT = 0.75;

      // ---------- Grain ----------
      for (let i = 0; i < DUR * 12; i++) tl.set("#grain", { x: Math.round(R(-500, 500)), y: Math.round(R(-900, 900)) }, i / 12);

      // ---------- 1 · CHAOS ----------
      const CARDS = [
        ["M", "#e5484d", "MAIL", "Re: AW: Fwd: Re: KPIs Q4", "12"],
        ["K", "#3e63dd", "KALENDER", "Meeting zur Vorbereitung des Meetings", "1"],
        ["C", "#8e4ec6", "CHAT · CHEF", "Hast du kurz 5 Min? 🙂", "3"],
        ["!", "#f76b15", "DEADLINE", "Abgabe: gestern", "!"],
        ["#", "#12a594", "#allgemein", "47 neue Nachrichten", "47"],
        ["€", "#e5484d", "CONTROLLING", "Umsatz −38 % — bitte erklären", "2"],
        ["X", "#30a46c", "TABELLE", "Reagiert nicht. Warten oder schließen?", "1"],
        ["C", "#8e4ec6", "CHAT · CHEF", "Kannst du am Samstag…?", "4"],
        ["T", "#3e63dd", "TELEFON", "3 verpasste Anrufe", "3"],
        ["M", "#e5484d", "MAIL", "BITTE BIS EOD!!!", "28"],
        ["K", "#3e63dd", "KALENDER", "Pflicht-Teamevent: Bowling", "1"],
        ["P", "#6f6e77", "DRUCKER", "Papierstau in Fach 2", "1"],
        ["S", "#f76b15", "STRATEGIE", "Synergien heben bis Q1", "9"],
        ["M", "#e5484d", "MAIL", "Dringend: Antwort auf Dringend", "64"],
        ["C", "#8e4ec6", "CHAT · CHEF", "???", "5"],
        ["K", "#3e63dd", "KALENDER", "Feedbackgespräch 1:1 — jetzt", "1"],
        ["M", "#e5484d", "MAIL", "Erinnerung an die Erinnerung", "99+"],
        ["!", "#f76b15", "IT", "Passwort läuft in 1 Std. ab", "!"],
      ];
      const host = document.getElementById("cards");
      const N = CARDS.length, cardTimes = [];
      CARDS.forEach(([ic, col, app, tx, badge], i) => {
        const el = document.createElement("div");
        el.className = "card"; el.id = "c" + i;
        el.innerHTML = `<div class="ic" style="background:${col}">${ic}</div><div style="flex:1"><div class="meta"><span>${app}</span><span>jetzt</span></div><div class="tx">${tx}</div></div><div class="badge">${badge}</div>`;
        const x = R(-40, 460), y = 170 + ((i * 0.618) % 1) * 1540 + R(-40, 40), rot = R(-9, 9);
        el.style.left = x + "px"; el.style.top = y + "px";
        host.appendChild(el);
        const t = 0.08 + 2.15 * Math.sqrt(i / N);
        cardTimes.push(t);
        tl.set(el, { opacity: 0 }, 0);
        tl.fromTo(el, { opacity: 1, scale: 0.5, rotation: rot - R(-14, 14), y: R(-60, 60) }, { scale: 1, rotation: rot, y: 0, duration: 0.28, ease: "back.out(2.2)", immediateRender: false }, t);
      });
      window.__cardTimes = cardTimes;
      // Ungelesen-Zähler
      tl.set("#cn", { "--n": 3 }, 0); tl.set("#cplus", { opacity: 0 }, 0);
      for (let f = 1; f <= FREEZE * FPS; f++) {
        const p = f / (FREEZE * FPS), n = Math.min(9999, Math.round(3 + 9996 * Math.pow(p, 3.2)));
        tl.set("#cn", { "--n": n }, f / FPS);
      }
      tl.set("#cplus", { opacity: 1 }, FREEZE - 0.15);
      tl.from("#counter", { y: -160, duration: 0.35, ease: "back.out(2)" }, 0.05);
      // Alarm-Puls + Shake, eskalierend
      for (let f = 0; f < FREEZE * FPS; f++) {
        const t = f / FPS, p = t / FREEZE, a = 2 + 26 * Math.pow(p, 2.2);
        tl.set("#world", { x: R(-a, a), y: R(-a, a), rotation: R(-a, a) * 0.03 }, t);
        tl.set("#alarm", { opacity: (0.25 + 0.75 * p) * (0.5 + 0.5 * Math.sin(t * 18)) }, t);
      }
      // ---------- 2 · FREEZE ----------
      tl.set("#world", { x: 0, y: 0, rotation: 0 }, FREEZE);
      tl.set("#alarm", { opacity: 0 }, FREEZE);
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, FREEZE);
      tl.to("#cards .card, #counter", { filter: "grayscale(1) blur(3px) brightness(0.8)", opacity: 0.55, duration: 0.25 }, FREEZE);
      tl.set("#cnum", { background: "#555" }, FREEZE);
      // Hund steigt hinter der Kante auf
      tl.fromTo("#dogrig", { y: 820 }, { y: 0, duration: 1.5, ease: "power3.out" }, FREEZE + 0.05);
      // Karten fallen weg (Schwerkraft)
      [...host.children].forEach((el, i) => {
        const t = FREEZE + BEAT + 0.04 * i;
        tl.to(el, { y: 2300, rotation: `+=${R(-70, 70)}`, x: `+=${R(-200, 200)}`, duration: 1.1, ease: "power2.in" }, t);
      });
      tl.to("#counter", { y: -240, opacity: 0, duration: 0.5, ease: "power2.in" }, FREEZE + BEAT);

      // ---------- 3 · SUNSET ----------
      const T3 = FREEZE + 2 * BEAT; // 3.9
      tl.to("#bgDusk", { opacity: 1, duration: 1.6, ease: "sine.inOut" }, T3 - 0.4);
      tl.fromTo("#sun", { y: 1150, scale: 0.8 }, { y: 0, scale: 1, duration: 2.4, ease: "power2.out" }, T3 - 0.3);
      tl.to("#sunGlow", { opacity: 1, duration: 2, ease: "sine.out" }, T3);
      tl.to("#rays", { opacity: 1, duration: 2, ease: "sine.out" }, T3 + 0.2);
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 24, duration: DUR - T3, ease: "none" }, T3);
      // Brillen-Reflexion + Glint
      tl.to(".lens", { opacity: 0.62, duration: 0.6, ease: "power2.out" }, T3 - 0.15);
      const glint = (t) => {
        tl.fromTo(".lens .glint", { x: 0 }, { x: 420, duration: 0.55, ease: "power2.inOut", immediateRender: false }, t);
        tl.fromTo("#star", { opacity: 0, scale: 0.2, rotation: 0, x: 640, y: 905 }, { opacity: 1, scale: 1.4, rotation: 90, duration: 0.25, ease: "power2.out", immediateRender: false }, t + 0.3);
        tl.to("#star", { opacity: 0, scale: 0.3, rotation: 180, duration: 0.35, ease: "power2.in" }, t + 0.55);
      };
      glint(T3); glint(DUR - 1.1);
      tl.fromTo(".lens .lsun", { y: 60 }, { y: -8, duration: DUR - T3, ease: "sine.out" }, T3);
      // Staub im Gegenlicht
      const dl = document.getElementById("dustLayer");
      for (let i = 0; i < 34; i++) {
        const d = document.createElement("div"), s = R(4, 14);
        d.className = "dust"; d.style.width = d.style.height = s + "px"; d.style.left = R(0, 1080) + "px"; d.style.top = R(500, 1500) + "px";
        dl.appendChild(d);
        const t0 = T3 + R(0, 2);
        tl.to(d, { opacity: R(0.35, 0.9), duration: 1, ease: "sine.out" }, t0);
        tl.to(d, { y: -R(150, 420), x: R(-80, 80), duration: DUR - t0, ease: "none" }, t0);
      }

      // ---------- 4 · DER TIPP ----------
      const T4 = FREEZE + 3 * BEAT; // 4.65
      const tagtx = document.getElementById("tagtx"), TAG = "TIPP DES TAGES";
      tagtx.innerHTML = TAG.split("").map((c) => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
      tl.from("#tag", { scaleX: 0, transformOrigin: "0 50%", duration: 0.3, ease: "power3.out" }, T4);
      [...tagtx.children].forEach((c, i) => tl.set(c, { opacity: 1 }, T4 + 0.25 + i * 0.035));
      for (let k = 0; k < 14; k++) tl.set("#tag .cur", { opacity: k % 2 ? 0 : 1 }, T4 + 0.8 + k * 0.4);

      const T5 = T4 + BEAT; // 5.4
      tl.from("#l1 .ln > span", { yPercent: 115, duration: 0.55, ease: "power4.out" }, T5);
      // STRESS — rot, zitternd
      const hot = document.getElementById("stressHot"), calm = document.getElementById("stressCalm");
      hot.innerHTML = "STRESS".split("").map((c) => `<span>${c}</span>`).join("");
      calm.innerHTML = "Stress,".split("").map((c) => `<span>${c}</span>`).join("");
      const T6 = T5 + BEAT; // 6.15
      tl.from("#stressHot span", { y: -260, opacity: 0, rotation: () => R(-40, 40), duration: 0.32, stagger: 0.03, ease: "back.out(2.5)" }, T6);
      for (let f = Math.round((T6 + 0.3) * FPS); f < (T6 + BEAT) * FPS; f++) {
        tl.set("#stressHot span", { x: () => R(-9, 9), y: () => R(-9, 9), rotation: () => R(-6, 6) }, f / FPS);
      }
      const T7 = T6 + BEAT; // 6.9 — Stress zerbröselt, kommt chillig zurück
      [...hot.children].forEach((s, i) => {
        tl.to(s, { y: 1500, x: R(-160, 160), rotation: R(-200, 200), duration: 1.0, ease: "power2.in" }, T7 + i * 0.035);
      });
      tl.to("#stressHot", { color: "#9aa7b8", duration: 0.2 }, T7);
      tl.from("#stressCalm span", { y: 70, opacity: 0, rotation: 6, duration: 0.9, stagger: 0.05, ease: "elastic.out(1, 0.55)" }, T7 + 0.12);
      // sanftes Wogen
      tl.to("#stressCalm span", { y: (i) => Math.sin(i) * 6, duration: 1.4, ease: "sine.inOut", stagger: { each: 0.12, repeat: 3, yoyo: true } }, T7 + 1.1);

      const T8 = T7 + BEAT; // 7.65
      tl.from("#l3 .ln > span", { yPercent: 115, duration: 0.55, ease: "power4.out" }, T8);
      const T9 = T8 + BEAT; // 8.4  — Stempel
      tl.fromTo("#l4", { scale: 2.4, opacity: 0, rotation: -8, filter: "blur(18px)" }, { scale: 1, opacity: 1, rotation: -3, filter: "blur(0px)", duration: 0.32, ease: "power4.in", immediateRender: false }, T9 - 0.32);
      tl.set("#l4", { opacity: 0 }, 0);
      for (let f = 0; f < 8; f++) { const a = 14 * (1 - f / 8); tl.set("#world", { x: R(-a, a), y: R(-a, a) }, T9 + f / FPS); }
      tl.set("#world", { x: 0, y: 0 }, T9 + 8 / FPS);
      const swp = document.getElementById("swp"), L = swp.getTotalLength();
      tl.fromTo(swp, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, T9 + 0.15);

      // ---------- Lo-fi-Nicken auf den Beat ----------
      for (let t = FREEZE + 2 * BEAT; t < DUR - 0.4; t += BEAT) {
        tl.to("#dogrig", { y: 7, rotation: 0.7, duration: BEAT * 0.3, ease: "power2.out" }, t);
        tl.to("#dogrig", { y: 0, rotation: 0, duration: BEAT * 0.7, ease: "sine.inOut" }, t + BEAT * 0.3);
      }
      // langsamer Push-in
      tl.fromTo("#world", { scale: 1 }, { scale: 1.045, duration: DUR - FREEZE, ease: "sine.inOut" }, FREEZE);

      // ---------- 5 · OUTRO ----------
      const T10 = T9 + 2 * BEAT; // 9.9
      tl.from("#chip", { y: 160, opacity: 0, duration: 0.6, ease: "back.out(1.8)" }, T10);
      for (let k = 0; k < 6; k++) tl.fromTo("#chip .led", { scale: 1.6 }, { scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, T10 + 0.4 + k * BEAT);
      tl.to("#vig", { opacity: 1.0, duration: 1 }, DUR - 1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
