<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; font-weight: 400; src: url(assets/fonts/unbounded-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Unbounded"; font-weight: 900; src: url(assets/fonts/unbounded-latin-900-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 400; src: url(assets/fonts/inter-tight-latin-400-normal.woff2) format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url(assets/fonts/inter-tight-latin-800-normal.woff2) format("woff2"); }
      :root {
        --ink: #070708; --coal: #1b1b1e; --steel: #5a5a60;
        --gold: #ffcf1f; --gold2: #f2a900; --pale: #fff3b0; --paper: #f4f1ea;
        --display: "Unbounded", sans-serif; --sans: "Inter Tight", sans-serif;
        --goldgrad: linear-gradient(100deg, #b87400 0%, #ffcf1f 28%, #fff6c4 46%, #ffcf1f 62%, #c98700 100%);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--sans); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .abs { position: absolute; }
      .ch { display: inline-block; will-change: transform; }
      .disp { font-family: var(--display); font-weight: 900; letter-spacing: -0.045em; line-height: 0.9; text-transform: uppercase; }
      .gold { background: var(--goldgrad); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
      .eyebrow { font-family: var(--sans); font-weight: 800; font-size: 26px; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gold); }

      #bg { z-index: 0; background: radial-gradient(70% 90% at 50% 55%, #17171a 0%, #070708 70%); }
      .glow { position: absolute; border-radius: 50%; filter: blur(140px); }
      #g1 { width: 900px; height: 900px; left: 510px; top: 90px; background: #f2a900; opacity: 0; }
      #g2 { width: 700px; height: 700px; left: -200px; top: 500px; background: #3a3a40; opacity: 0.5; }
      #lines { z-index: 1; }
      .ln { position: absolute; height: 2px; background: linear-gradient(90deg, rgba(255,207,31,0), rgba(255,207,31,0.9), rgba(255,207,31,0)); }

      #s1 { z-index: 10; }
      #s1 .logo { left: 760px; top: 240px; width: 400px; }
      #s1 .sweep { left: -400px; top: 0; width: 300px; height: 1080px; background: linear-gradient(90deg, rgba(255,243,176,0), rgba(255,243,176,0.25), rgba(255,243,176,0)); transform: skewX(-18deg); }
      #s1 .wm { left: 0; width: 1920px; top: 730px; text-align: center; font-family: var(--display); font-weight: 400; font-size: 44px; letter-spacing: 0.55em; color: var(--paper); text-transform: uppercase; }

      #s2 { z-index: 11; }
      #s2 .eb { left: 0; width: 1920px; top: 250px; text-align: center; }
      #s2 .t1 { left: 0; width: 1920px; top: 330px; text-align: center; font-size: 300px; color: var(--paper); }
      #s2 .t2 { left: 0; width: 1920px; top: 600px; text-align: center; font-size: 300px; }
      #s2 .bar { left: 360px; top: 935px; width: 1200px; height: 4px; background: var(--gold); transform-origin: 0 50%; }

      #s3 { z-index: 12; }
      #s3 .tri { left: 960px; top: 540px; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; opacity: 0.08; }
      #s3 .big { left: 0; width: 1920px; top: 220px; display: flex; justify-content: center; font-size: 430px; line-height: 1; }
      #s3 .big .ch { padding: 0 0.01em; }
      #s3 .sub { left: 0; width: 1920px; top: 820px; text-align: center; font-family: var(--display); font-weight: 900; font-size: 92px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--paper); }

      #s4 { z-index: 13; }
      #s4 .t { left: 0; width: 1920px; top: 330px; text-align: center; font-size: 150px; color: var(--paper); }
      #s4 .clock { left: 0; width: 1920px; top: 560px; text-align: center; font-family: var(--display); font-weight: 400; font-size: 120px; letter-spacing: 0.08em; color: var(--gold); font-variant-numeric: tabular-nums; }
      #s4 .lbl { left: 0; width: 1920px; top: 720px; text-align: center; font-family: var(--sans); font-weight: 800; font-size: 22px; letter-spacing: 0.9em; color: var(--steel); text-transform: uppercase; padding-left: 0.9em; }

      #s5 { z-index: 14; }
      #s5 .logo { left: 230px; top: 300px; width: 460px; }
      #s5 .wm { left: 760px; top: 345px; font-family: var(--display); font-weight: 900; font-size: 150px; letter-spacing: -0.04em; color: var(--paper); }
      #s5 .url { left: 770px; top: 545px; font-family: var(--sans); font-weight: 800; font-size: 56px; letter-spacing: 0.02em; color: var(--paper); }
      #s5 .pill { left: 770px; top: 660px; padding: 26px 54px; border-radius: 999px; background: var(--goldgrad); background-size: 220% 100%; color: #111; font-family: var(--display); font-weight: 900; font-size: 44px; text-transform: uppercase; letter-spacing: 0.01em; box-shadow: 0 20px 80px rgba(255,180,0,0.35); }
      #s5 .tag { left: 770px; top: 280px; }

      #vig { z-index: 89; background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.8) 100%); }
      #grain { z-index: 90; opacity: 0.09; mix-blend-mode: overlay; width: 3840px; height: 2160px; inset: auto; left: -960px; top: -540px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      #flash { z-index: 95; background: #fff6c4; opacity: 0; }
      #bars { z-index: 96; }
      .lb { position: absolute; left: 0; width: 1920px; height: 540px; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080" data-fps="30">
      <audio id="vo" src="assets/audio/vo_mix.wav" data-start="0" data-duration="14.38" data-volume="1"></audio>

      <div id="bg" class="clip" data-start="0" data-duration="15" data-track-index="0"><div id="g1" class="glow"></div><div id="g2" class="glow"></div></div>
      <div id="lines" class="clip" data-start="0" data-duration="15" data-track-index="1"></div>

      <div id="s1" class="clip" data-start="0" data-duration="2.5" data-track-index="2">
        <img class="abs logo" src="assets/logo.png" />
        <div class="abs sweep"></div>
        <div class="abs wm">Wiresoft</div>
      </div>

      <div id="s2" class="clip" data-start="2.2" data-duration="3.25" data-track-index="3">
        <div class="abs eb eyebrow">Nur diese Woche</div>
        <div class="abs t1 disp">Black</div>
        <div class="abs t2 disp">Week</div>
        <div class="abs bar"></div>
      </div>

      <div id="s3" class="clip" data-start="5.2" data-duration="4.5" data-track-index="4">
        <svg class="abs tri" viewBox="0 0 100 100"><polygon points="8,20 92,20 50,92" fill="none" stroke="#ffcf1f" stroke-width="1.2"/></svg>
        <div class="abs big disp"><span class="ch gold minus">–</span><span class="ch gold d">2</span><span class="ch gold d">0</span><span class="ch gold d">%</span></div>
        <div class="abs sub">auf alles</div>
      </div>

      <div id="s4" class="clip" data-start="9.5" data-duration="2.5" data-track-index="5">
        <div class="abs t disp">Nur für kurze Zeit</div>
        <div class="abs clock" id="clock">71:59:59</div>
        <div class="abs lbl">Stunden · Minuten · Sekunden</div>
      </div>

      <div id="s5" class="clip" data-start="11.75" data-duration="3.25" data-track-index="6">
        <img class="abs logo" src="assets/logo.png" />
        <div class="abs tag eyebrow">Black Week · −20 % auf alles</div>
        <div class="abs wm">wiresoft</div>
        <div class="abs url">www.wiresoft.com</div>
        <div class="abs pill">Jetzt sichern →</div>
      </div>

      <div id="vig" class="clip" data-start="0" data-duration="15" data-track-index="7"></div>
      <div id="grain" class="clip" data-start="0" data-duration="15" data-track-index="8"></div>
      <div id="flash" class="clip" data-start="0" data-duration="15" data-track-index="9"></div>
      <div id="bars" class="clip" data-start="0" data-duration="1.25" data-track-index="10"><div class="lb" id="lbT" style="top:0"></div><div class="lb" id="lbB" style="top:540px"></div></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => document.querySelectorAll(s);
      let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); const R = (a, b) => a + rnd() * (b - a);
      const split = (el) => { const t = el.textContent; el.textContent = ""; return [...t].map((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c === " " ? " " : c; el.appendChild(s); return s; }); };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const flash = (t, o = 0.7, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);

      // ambient gold lines drifting
      for (let i = 0; i < 14; i++) {
        const l = document.createElement("div"); l.className = "ln";
        l.style.top = R(40, 1040) + "px"; l.style.width = R(300, 900) + "px"; l.style.opacity = R(0.15, 0.5);
        $("#lines").appendChild(l);
        tl.fromTo(l, { x: -1000 }, { x: 2100, duration: R(2.5, 5), ease: "none", repeat: 4 }, R(-3, 0.5));
      }
      tl.fromTo("#g1", { opacity: 0, scale: 0.6 }, { opacity: 0.18, scale: 1, duration: 2.5, ease: "power2.out" }, 0);
      tl.to("#g1", { x: -300, duration: 12, ease: "sine.inOut" }, 2.5);

      // letterbox open
      tl.fromTo("#lbT", { y: 0 }, { y: -540, duration: 1.1, ease: "expo.inOut" }, 0.1);
      tl.fromTo("#lbB", { y: 0 }, { y: 540, duration: 1.1, ease: "expo.inOut" }, 0.1);

      // S1 logo reveal
      tl.fromTo("#s1 .logo", { scale: 0.7, opacity: 0, rotationY: 40, filter: "blur(20px)" }, { scale: 1, opacity: 1, rotationY: 0, filter: "blur(0px)", duration: 1.3, ease: "expo.out" }, 0.4);
      tl.fromTo("#s1 .sweep", { x: 0 }, { x: 2600, duration: 1.0, ease: "power2.inOut" }, 0.9);
      tl.from(split($("#s1 .wm")), { opacity: 0, y: 30, duration: 0.5, stagger: 0.05, ease: "power3.out" }, 1.0);
      tl.to("#s1", { scale: 1.5, opacity: 0, filter: "blur(16px)", duration: 0.35, ease: "power3.in" }, 2.15);

      // S2 BLACK WEEK
      flash(2.4, 0.5, 0.35);
      tl.from("#s2 .eb", { opacity: 0, scaleX: 1.4, duration: 0.7, ease: "expo.out" }, 2.3);
      tl.from(split($("#s2 .t1")), { yPercent: 110, opacity: 0, duration: 0.55, stagger: 0.045, ease: "expo.out" }, 2.4);
      const wk = split($("#s2 .t2")); wk.forEach((c) => c.classList.add("gold"));
      tl.from(wk, { yPercent: -110, opacity: 0, duration: 0.55, stagger: 0.045, ease: "expo.out" }, 2.75);
      tl.fromTo(wk, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 2.6, ease: "sine.inOut" }, 2.6);
      tl.fromTo("#s2 .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 3.0);
      tl.fromTo("#s2 .t1, #s2 .t2", { scale: 1 }, { scale: 1.06, duration: 2.6, ease: "none" }, 2.6);
      tl.to("#s2", { x: -1920, duration: 0.45, ease: "expo.in" }, 5.0);

      // S3 -20%
      flash(5.35, 0.9, 0.4);
      tl.fromTo("#s3 .tri", { rotation: -30, scale: 0.5 }, { rotation: 20, scale: 1.1, duration: 4.5, ease: "power1.out" }, 5.2);
      tl.from("#s3 .d", { yPercent: 70, scale: 1.6, opacity: 0, duration: 0.6, stagger: 0.09, ease: "back.out(1.6)" }, 5.3);
      tl.from("#s3 .minus", { x: -300, opacity: 0, duration: 0.6, ease: "expo.out" }, 5.55);
      tl.fromTo("#s3 .gold", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 3.5, ease: "sine.inOut" }, 5.4);
      tl.from(split($("#s3 .sub")), { y: 80, opacity: 0, duration: 0.45, stagger: 0.04, ease: "expo.out" }, 6.35);
      tl.fromTo("#s3 .big", { scale: 1 }, { scale: 0.94, duration: 3.6, ease: "none", transformOrigin: "50% 60%" }, 6.0);
      tl.to("#s3", { scale: 3, opacity: 0, duration: 0.4, ease: "power3.in" }, 9.3);

      // S4 countdown
      flash(9.55, 0.35, 0.3);
      tl.from(split($("#s4 .t")), { opacity: 0, y: -60, rotationX: -90, duration: 0.45, stagger: 0.025, ease: "expo.out" }, 9.6);
      tl.from("#s4 .clock, #s4 .lbl", { opacity: 0, y: 40, duration: 0.5, ease: "expo.out", stagger: 0.1 }, 9.9);
      const ck = { s: 71 * 3600 + 59 * 60 + 59 };
      const pad = (n) => String(n).padStart(2, "0");
      tl.to(ck, { s: 71 * 3600 + 58 * 60 + 2, duration: 2.2, ease: "power1.in", onUpdate: () => { const v = Math.round(ck.s); $("#clock").textContent = `${pad(Math.floor(v / 3600))}:${pad(Math.floor((v % 3600) / 60))}:${pad(v % 60)}`; } }, 9.8);
      tl.to("#s4", { y: -200, opacity: 0, duration: 0.35, ease: "power3.in" }, 11.6);

      // S5 end card
      flash(11.85, 0.6, 0.4);
      tl.fromTo("#s5 .logo", { x: -300, rotation: -20, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 11.8);
      tl.from("#s5 .tag", { opacity: 0, x: 40, duration: 0.5, ease: "expo.out" }, 12.0);
      tl.from(split($("#s5 .wm")), { opacity: 0, yPercent: 80, duration: 0.5, stagger: 0.04, ease: "expo.out" }, 12.0);
      tl.from("#s5 .url", { opacity: 0, x: 40, duration: 0.5, ease: "expo.out" }, 12.55);
      tl.fromTo("#s5 .pill", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2.2)", transformOrigin: "0% 50%" }, 13.0);
      tl.fromTo("#s5 .pill", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.6, ease: "sine.inOut", immediateRender: false }, 13.3);
      tl.to("#s5 .logo", { y: -12, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 12.6);
      tl.to("#vig", { opacity: 1, duration: 0.1 }, 14.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
