<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f14;
        --ink: #ffffff;
        --mint: #5ee0d2;
        --font-display: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; font-family: var(--font-display); color: var(--ink); }
      #bg, #main { position: absolute; left: 0; width: 1080px; }
      #bg { top: 0; height: 1920px; object-fit: cover; }
      #main { top: 240px; height: 1440px; object-fit: cover; }
      .host { position: absolute; z-index: 5; }
      #count-wrap { position: absolute; left: 0; right: 0; top: 300px; text-align: center; z-index: 6; }
      #count-num { font-size: 92px; font-weight: 800; letter-spacing: -2px; color: var(--ink); }
      #count-lbl { font-size: 26px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: var(--mint); margin-top: 4px; }
      #logo-wrap { position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; }
      #logo-dim { position: absolute; inset: 0; background: #0b0f14; }
      #logo { position: relative; width: 860px; }
      #tabs { position:absolute; left:190px; top:1450px; width:700px; height:110px; border-radius:24px; background:rgba(11,15,20,.82); border:2px solid rgba(255,255,255,.14); display:flex; align-items:center; padding:12px; z-index:6; }
      #tabs-pill { position:absolute; left:12px; top:12px; width:330px; height:84px; border-radius:16px; background:#1d262b; }
      .tab { position:relative; flex:1; text-align:center; font-size:34px; font-weight:600; color:#fff; }
      #claim { position: absolute; left: 90px; right: 90px; top: 1060px; text-align: center; font-size: 34px; font-weight: 600; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <video id="bg" class="clip" src="assets/main_bg.mp4" muted data-start="0" data-duration="20" data-track-index="0"></video>
      <video id="main" class="clip" src="assets/main.mp4" muted data-start="0" data-duration="20" data-track-index="1"></video>

      <div id="tabs" class="clip" data-start="0.3" data-duration="3.4" data-track-index="2">
        <div id="tabs-pill"></div><span class="tab" id="tab1">Karten suchen</span><span class="tab" id="tab2">Mit Foto finden</span>
      </div>

      <div id="count-wrap" class="clip" data-start="3.6" data-duration="3.6" data-track-index="3">
        <div id="count-num">0</div>
        <div id="count-lbl">Karten im Katalog</div>
      </div>

      <div id="h-pile" class="host" data-track-kind="graphics" data-composition-id="notification-pileup" data-composition-src="compositions/components/notification-pileup.html"
        data-start="7.0" data-duration="5.2" data-track-index="4" data-variable-values='{"count":5,"speed":1.3}'
        style="left:150px; top:820px; width:780px; height:760px;"></div>

      <div id="h-arc" class="host" data-track-kind="graphics" data-composition-id="mk-usage-arc" data-composition-src="compositions/components/mk-usage-arc.html"
        data-start="9.4" data-duration="3.0" data-track-index="5"
        style="left:340px; top:270px; width:400px; height:230px;"></div>

      <div id="h-cloud" class="host" data-track-kind="graphics" data-composition-id="avatar-cloud" data-composition-src="compositions/components/avatar-cloud.html" data-variable-values='{"label":"Sammler weltweit"}'
        data-start="12.2" data-duration="4.0" data-track-index="6"
        style="left:90px; top:270px; width:900px; height:260px;"></div>

      <div id="h-chat1" class="host" data-track-kind="graphics" data-composition-id="chat-message" data-composition-src="compositions/components/chat-message.html"
        data-start="12.4" data-duration="3.8" data-track-index="7" data-variable-values='{"type":"recv","text":"Ist die Karte noch zu haben?"}'
        style="left:60px; top:1180px; width:960px; height:200px;"></div>
      <div id="h-chat2" class="host" data-track-kind="graphics" data-composition-id="chat-message" data-composition-src="compositions/components/chat-message.html"
        data-start="13.4" data-duration="2.8" data-track-index="8" data-variable-values='{"type":"sent","text":"Ja! Versand heute 🚀"}'
        style="left:60px; top:1360px; width:960px; height:200px;"></div>

      <div id="logo-wrap" class="clip" data-start="16.2" data-duration="5.8" data-track-index="9">
        <div id="logo-dim"></div>
        <img id="logo" src="assets/wordmark.png" alt="cardmarket.pro" />
        <div id="claim">Deine nächste Lieblingskarte wartet.</div>
      </div>

      <div id="h-ig" class="host" data-track-kind="graphics" data-composition-id="instagram-follow" data-composition-src="compositions/instagram-follow.html"
        data-start="18.5" data-duration="3.5" data-track-index="10" data-width="1080" data-height="1920"
        style="left:0; top:-420px; width:1080px; height:1920px; z-index:8;"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const num = document.getElementById("count-num");
      const st = { v: 0 };
      tl.fromTo("#count-num", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.6);
      tl.fromTo("#count-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.8);
      tl.to(st, { v: 3606497, duration: 2.2, ease: "power2.out", onUpdate: () => { num.textContent = Math.round(st.v).toLocaleString("de-DE"); } }, 3.7);
      tl.to("#count-num, #count-lbl", { opacity: 0, duration: 0.3 }, 6.85);
      tl.fromTo("#logo-dim", { opacity: 0 }, { opacity: 0.82, duration: 0.5 }, 16.2);
      tl.fromTo("#logo", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 16.35);
      tl.fromTo("#claim", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 16.8);
      tl.fromTo("#tabs", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.to("#tabs-pill", { x: 346, duration: 0.45, ease: "power3.inOut" }, 1.6);
      tl.to("#tabs", { opacity: 0, duration: 0.3 }, 3.35);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
