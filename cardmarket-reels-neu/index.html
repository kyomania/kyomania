<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090b;
        --white: #ffffff;
        --mint: #5ee0d2;
        --dark: #0b0f14;
        --sans: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: var(--sans); }
      #film { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; }
      #shade-top { position: absolute; left: 0; right: 0; top: 0; height: 560px; z-index: 2;
        background: linear-gradient(180deg, rgba(7,9,11,.82) 0%, rgba(7,9,11,.4) 55%, rgba(7,9,11,0) 100%); }
      #shade-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; z-index: 2;
        background: linear-gradient(0deg, rgba(7,9,11,.9) 0%, rgba(7,9,11,.5) 50%, rgba(7,9,11,0) 100%); }

      .mask { overflow: hidden; display: block; padding-bottom: 6px; }
      .w { display: block; font-weight: 900; color: var(--white); text-transform: uppercase; line-height: .92; letter-spacing: -0.04em; }
      .w i { font-style: normal; color: var(--mint); }

      #intro { position: absolute; left: 70px; top: 110px; z-index: 5; }
      #intro .w { font-size: 128px; }

      .big { position: absolute; left: 60px; right: 60px; bottom: 150px; z-index: 5; }
      .big .w { white-space: nowrap; }
      .echo { position: absolute; left: 0; bottom: 0; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: .92;
        color: transparent; -webkit-text-stroke: 3px var(--mint); white-space: nowrap; transform-origin: 0 100%; }
      .pills { display: flex; gap: 16px; margin-top: 26px; }
      .pill { font-weight: 700; font-size: 32px; padding: 14px 26px; border-radius: 40px; white-space: nowrap; }
      .pill.f { background: var(--mint); color: var(--dark); }
      .pill.o { border: 3px solid var(--mint); color: var(--white); background: rgba(7,9,11,.45); }

      #outro { position: absolute; left: 0; right: 0; bottom: 150px; z-index: 5; text-align: center; }
      #outro .w { font-size: 150px; }

      #claim { position: absolute; left: 60px; right: 60px; top: 965px; z-index: 5; text-align: center;
        font-weight: 700; font-size: 40px; color: var(--dark); letter-spacing: -0.01em; }

      #flash { position: absolute; inset: 0; z-index: 3; background: #fff6e4; opacity: 0; pointer-events: none; }
      .host { position: absolute; z-index: 4; left: 0; top: 0; width: 1080px; height: 1350px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1350">
      <video id="film" class="clip" src="assets/story.mp4" muted data-start="0" data-duration="20" data-track-index="0"></video>
      <div id="shade-top" class="clip" data-start="0" data-duration="3.4" data-track-index="1"></div>
      <div id="shade-bot" class="clip" data-start="3.3" data-duration="12.4" data-track-index="2"></div>

      <div id="intro" class="clip" data-start="0.15" data-duration="3.2" data-track-index="3">
        <span class="mask"><span class="w" id="i1">Jede Karte</span></span>
        <span class="mask"><span class="w" id="i2">erzählt eine</span></span>
        <span class="mask"><span class="w" id="i3">Geschichte<i>.</i></span></span>
      </div>

      <div id="b1" class="big clip" data-start="3.45" data-duration="3.3" data-track-index="4">
        <div style="position:relative"><span class="echo" id="e1" style="font-size:150px">Entdecken.</span><span class="mask"><span class="w" id="w1" style="font-size:150px">Entdecken<i>.</i></span></span></div>
        <div class="pills"><span class="pill f" id="p1a">3,6 Mio. Karten</span><span class="pill o" id="p1b">Such per Foto</span></div>
      </div>

      <div id="b2" class="big clip" data-start="8.1" data-duration="1.95" data-track-index="5">
        <div style="position:relative"><span class="echo" id="e2" style="font-size:168px">Sammeln.</span><span class="mask"><span class="w" id="w2" style="font-size:168px">Sammeln<i>.</i></span></span></div>
        <div class="pills"><span class="pill f" id="p2a">Sammlungswert im Blick</span></div>
      </div>

      <div id="b3" class="big clip" data-start="11.7" data-duration="1.75" data-track-index="6">
        <div style="position:relative"><span class="echo" id="e3" style="font-size:122px">Weitergeben.</span><span class="mask"><span class="w" id="w3" style="font-size:122px">Weitergeben<i>.</i></span></span></div>
        <div class="pills"><span class="pill f" id="p3a">0 % Provision</span></div>
      </div>

      <div id="outro" class="clip" data-start="13.55" data-duration="2.1" data-track-index="7">
        <span class="mask"><span class="w" id="o1">Gib sie</span></span>
        <span class="mask"><span class="w" id="o2">weiter<i>.</i></span></span>
      </div>

      <div id="claim" class="clip" data-start="18.0" data-duration="2.0" data-track-index="8">Deine nächste Lieblingskarte wartet.</div>

      <div id="leak1" class="host" data-track-kind="graphics" data-composition-id="organic-light-leak-overlay" data-composition-src="compositions/organic-light-leak-overlay.html"
        data-start="6.6" data-duration="1.4" data-track-index="9" data-width="1920" data-height="1080"></div>
      <div id="leak2" class="host" data-track-kind="graphics" data-composition-id="organic-light-leak-overlay" data-composition-src="compositions/organic-light-leak-overlay.html"
        data-start="9.75" data-duration="1.4" data-track-index="10" data-width="1920" data-height="1080"></div>
      <div id="leak3" class="host" data-track-kind="graphics" data-composition-id="organic-light-leak-overlay" data-composition-src="compositions/organic-light-leak-overlay.html"
        data-start="15.3" data-duration="1.4" data-track-index="11" data-width="1920" data-height="1080"></div>

      <div id="flash" class="clip" data-start="0" data-duration="20" data-track-index="12"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const hit = (t, k) => {
        tl.fromTo("#flash", { opacity: 0.75 * k }, { opacity: 0, duration: 0.22, ease: "power2.out" }, t);
        tl.fromTo("#film", { scale: 1 + 0.07 * k }, { scale: 1, duration: 0.45, ease: "power3.out" }, t);
      };
      // Intro: three lines snap up, fast
      ["#i1", "#i2", "#i3"].forEach((id, n) => {
        tl.fromTo(id, { yPercent: 110 }, { yPercent: 0, duration: 0.38, ease: "power4.out" }, 0.2 + n * 0.32);
      });
      tl.to("#intro .w", { yPercent: -110, duration: 0.28, stagger: 0.05, ease: "power3.in" }, 3.0);
      // Big words on the transformations
      [["1", 3.45, 6.45, 1], ["2", 8.1, 9.75, 0.8], ["3", 11.7, 13.15, 0.8]].forEach(([n, a, b, k]) => {
        hit(a, k);
        tl.fromTo("#w" + n, { yPercent: 105, scale: 1.25, transformOrigin: "0% 100%" }, { yPercent: 0, scale: 1, duration: 0.32, ease: "power4.out" }, a);
        tl.fromTo("#e" + n, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.35, duration: 0.6, ease: "power2.out" }, a + 0.05);
        tl.fromTo("#b" + n + " .pill", { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, stagger: 0.18, ease: "back.out(2.2)" }, a + 0.35);
        tl.to("#w" + n, { x: 18, duration: b - a, ease: "none" }, a + 0.32);
        tl.to("#b" + n + " .pill", { opacity: 0, y: 14, duration: 0.2, stagger: 0.04 }, b);
        tl.to("#w" + n, { yPercent: -105, duration: 0.25, ease: "power3.in" }, b + 0.05);
      });
      // Outro words
      hit(13.55, 0.5);
      tl.fromTo("#o1", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, 13.6);
      tl.fromTo("#o2", { yPercent: 110 }, { yPercent: 0, duration: 0.36, ease: "power4.out" }, 13.85);
      tl.to("#outro .w", { yPercent: -110, duration: 0.28, stagger: 0.05, ease: "power3.in" }, 15.25);
      // Claim on the white end frame
      tl.fromTo("#claim", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 18.02);
      tl.to("#shade-bot", { opacity: 0, duration: 0.35 }, 15.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
