<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #f3eee2; --mint: #3fd4c4; --ink: #1b2228; --teal: #0d8f82; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .boil { translate: var(--bx, 0px) var(--by, 0px); }
      .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; z-index: 50; }
      .stamp { position: absolute; font-family: "Archivo Black", sans-serif; line-height: .85; letter-spacing: -.02em; text-transform: uppercase; }
      .stamp .m, .stamp .k { position: absolute; left: 0; top: 0; white-space: nowrap; mix-blend-mode: multiply; }
      .stamp .m { color: var(--mint); transform: translate(10px, 7px); }
      .stamp .k { color: var(--ink); opacity: .92; }
      .stamp .sz { visibility: hidden; white-space: nowrap; }
      .hand { position: absolute; font-family: "Caveat", cursive; font-weight: 700; color: var(--ink); }
      .halftone { position: absolute; border-radius: 50%; mix-blend-mode: multiply;
        background-image: radial-gradient(circle, var(--mint) 38%, transparent 41%); background-size: 26px 26px; }
      .mono { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 28px; letter-spacing: .14em; color: var(--ink); text-transform: uppercase; }
      .pcard { position: absolute; width: 300px; height: 420px; border-radius: 16px; border: 8px solid var(--ink); mix-blend-mode: multiply; }
      .pcard svg { position: absolute; left: 50%; top: 50%; width: 150px; height: 180px; margin: -90px 0 0 -75px; }
      .tape { position: absolute; width: 150px; height: 46px; background: rgba(200,190,160,.6); left: 75px; top: -22px; transform: rotate(-4deg); }
      .tag { position: absolute; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" /><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .28  0 0 0 .55 0" /></filter>
      <symbol id="mk" viewBox="100 60 600 720">
        <path d="M210,170 L640,70 L690,130 L605,690 Q600,725 560,730 L180,770 Q110,775 110,700 L150,230 Q155,180 210,170 Z M435,258 L370,385 L345,410 Q330,440 340,490 Q350,525 380,525 L580,525 L565,640 Q562,648 550,648 L320,648 Q240,640 210,560 Q195,520 205,420 Q220,350 280,320 Z M495,238 L610,238 Q620,240 612,252 L548,375 Q540,385 528,385 L420,385 Q410,383 415,372 Z" fill-rule="evenodd" />
      </symbol>
    </svg>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">

      <!-- S1 BUY -->
      <div id="s1" class="clip" data-start="0" data-duration="1.4" data-track-index="0">
        <div class="halftone boil" id="h1" style="left:240px;top:600px;width:640px;height:640px"></div>
        <div class="stamp boil" id="w1" style="left:110px;top:820px;font-size:360px;transform:rotate(-6deg)"><span class="sz" data-layout-ignore>Buy</span><span class="m" data-layout-ignore>Buy</span><span class="k">Buy</span></div>
        <div class="hand boil" id="n1" style="left:560px;top:1340px;font-size:72px;transform:rotate(-4deg)">first edition!!</div>
        <svg class="boil" id="a1" style="position:absolute;left:430px;top:1280px" width="160" height="120" viewBox="0 0 160 120"><path d="M150 70 C 110 110, 50 100, 20 30 M20 30 L 10 70 M20 30 L 55 45" fill="none" stroke="#1b2228" stroke-width="8" stroke-linecap="round" /></svg>
        <div class="mono" style="left:80px;top:140px">Zine Nº 01</div><div class="mono" style="right:80px;top:140px">cardmarket.pro</div>
      </div>

      <!-- S2 SELL -->
      <div id="s2" class="clip" data-start="1.4" data-duration="1.4" data-track-index="0">
        <div class="stamp boil" id="w2" style="left:90px;top:420px;font-size:330px;transform:rotate(4deg)"><span class="sz" data-layout-ignore>Sell</span><span class="m" data-layout-ignore>Sell</span><span class="k">Sell</span></div>
        <svg class="tag boil" id="tag" style="left:260px;top:980px;transform-origin:280px 40px" width="560" height="640" viewBox="0 0 560 640">
          <path d="M280 20 L520 160 L520 600 L40 600 L40 160 Z" fill="#3fd4c4" style="mix-blend-mode:multiply" transform="translate(10 8)" />
          <path d="M280 20 L520 160 L520 600 L40 600 L40 160 Z" fill="none" stroke="#1b2228" stroke-width="10" />
          <circle cx="280" cy="120" r="26" fill="#f3eee2" stroke="#1b2228" stroke-width="8" />
        </svg>
        <div class="hand" id="p5" style="left:400px;top:1200px;font-size:150px">€5</div>
        <svg id="x5" style="position:absolute;left:380px;top:1220px" width="240" height="140" viewBox="0 0 240 140"><path d="M10 120 C 80 60, 160 40, 230 10 M15 20 C 90 60, 160 90, 225 130" stroke="#1b2228" stroke-width="12" fill="none" stroke-linecap="round" /></svg>
        <div class="hand" id="p12" style="left:390px;top:1390px;font-size:190px;transform:rotate(-8deg)">€12!</div>
        <div class="mono" style="left:80px;top:140px">Price check</div><div class="mono" style="right:80px;top:140px">Nº 02</div>
      </div>

      <!-- S3 TRADE -->
      <div id="s3" class="clip" data-start="2.8" data-duration="1.4" data-track-index="0">
        <div class="stamp boil" id="w3" style="left:60px;top:400px;font-size:245px;transform:rotate(-3deg)"><span class="sz" data-layout-ignore>Trade</span><span class="m" data-layout-ignore>Trade</span><span class="k">Trade</span></div>
        <div class="pcard boil" id="cA" style="left:120px;top:1000px;background:#3fd4c4;transform:rotate(-8deg)"><div class="tape"></div><svg><use href="#mk" fill="#1b2228" /></svg></div>
        <div class="pcard boil" id="cB" style="left:660px;top:1020px;background:#f3eee2;transform:rotate(7deg)"><div class="tape"></div><svg><use href="#mk" fill="#0d8f82" /></svg></div>
        <svg class="boil" style="position:absolute;left:360px;top:1500px" width="360" height="200" viewBox="0 0 360 200"><path d="M30 40 C 120 180, 240 180, 330 40 M330 40 L 290 50 M330 40 L 325 85" stroke="#1b2228" stroke-width="9" fill="none" stroke-linecap="round" /></svg>
        <div class="hand" style="left:330px;top:1680px;font-size:80px">swap?</div>
      </div>

      <!-- S4 collage -->
      <div id="s4" class="clip" data-start="4.2" data-duration="1.4" data-track-index="0">
        <div id="collage"></div>
        <svg id="circ" class="boil" style="position:absolute;left:600px;top:1070px" width="420" height="560" viewBox="0 0 420 560"><path d="M210 20 C 380 20, 410 200, 400 300 C 390 470, 260 545, 180 540 C 60 530, 15 400, 20 280 C 25 120, 90 30, 230 30" stroke="#1b2228" stroke-width="10" fill="none" stroke-linecap="round" /></svg>
        <div class="hand boil" id="this" style="left:480px;top:1560px;font-size:110px;transform:rotate(-6deg)">THIS ONE!</div>
      </div>

      <!-- S5 mark -->
      <div id="s5" class="clip" data-start="5.6" data-duration="1.0" data-track-index="0">
        <div class="halftone boil" style="left:140px;top:560px;width:800px;height:800px"></div>
        <svg class="boil" id="mkM" style="position:absolute;left:325px;top:690px;mix-blend-mode:multiply" width="450" height="540"><use href="#mk" fill="#3fd4c4" /></svg>
        <svg class="boil" id="mkK" style="position:absolute;left:310px;top:680px;mix-blend-mode:multiply" width="450" height="540"><use href="#mk" fill="#1b2228" /></svg>
        <svg id="ring" style="position:absolute;left:90px;top:510px" width="900" height="900" viewBox="0 0 900 900">
          <defs><path id="cp" d="M450,450 m-400,0 a400,400 0 1,1 800,0 a400,400 0 1,1 -800,0" /></defs>
          <text font-family="JetBrains Mono" font-weight="700" font-size="38" letter-spacing="10" fill="#1b2228"><textPath href="#cp">CARDMARKET.PRO · BUY · SELL · TRADE · COLLECT · ZINE Nº 01 · </textPath></text>
        </svg>
      </div>

      <!-- S6 end -->
      <div id="s6" class="clip" data-start="6.6" data-duration="1.4" data-track-index="0">
        <img id="word" src="assets/wordmark-light.png" alt="cardmarket.pro" style="position:absolute;left:90px;top:820px;width:900px;mix-blend-mode:multiply" />
        <div class="hand boil" id="sub" style="left:0;right:0;top:1030px;text-align:center;font-size:84px">buy · sell · trade · collect</div>
        <div class="stamp" id="yr" style="left:700px;top:560px;font-size:110px;transform:rotate(12deg)"><span class="sz" data-layout-ignore>2026</span><span class="m" data-layout-ignore>2026</span><span class="k">2026</span></div>
      </div>

      <svg class="grain clip" data-start="0" data-duration="8" data-track-index="2" id="grain" width="1080" height="1920"><rect width="1080" height="1920" filter="url(#noise)" /></svg>

      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="8" data-volume="0.65" data-fade-out="0.8" data-track-index="5"></audio>
      <audio id="st1" src="assets/stamp.wav" data-start="0.1" data-duration="0.18" data-volume="0.9" data-track-index="6"></audio>
      <audio id="st2" src="assets/stamp.wav" data-start="1.5" data-duration="0.18" data-volume="0.9" data-track-index="6"></audio>
      <audio id="st3" src="assets/stamp.wav" data-start="2.9" data-duration="0.18" data-volume="0.9" data-track-index="6"></audio>
      <audio id="st4" src="assets/stamp.wav" data-start="5.65" data-duration="0.18" data-volume="0.9" data-track-index="6"></audio>
      <audio id="st5" src="assets/stamp.wav" data-start="6.9" data-duration="0.18" data-volume="0.9" data-track-index="6"></audio>
      <audio id="sw1" src="assets/whoosh.wav" data-start="3.3" data-duration="0.35" data-volume="0.5" data-track-index="7"></audio>
    </div>

    <script>
      // collage cards (deterministic)
      const col = document.getElementById("collage");
      const COLS = ["#3fd4c4", "#f3eee2", "#0d8f82", "#3fd4c4", "#f3eee2", "#1b2228", "#3fd4c4", "#f3eee2", "#0d8f82"];
      const POS = [[60, 300, -12], [420, 240, 6], [760, 360, -5], [90, 820, 9], [430, 780, -7], [720, 1140, 4], [120, 1360, -4], [420, 1330, 11], [700, 640, -10]];
      POS.forEach(([x, y, r], i) => {
        const f = COLS[i] === "#1b2228" ? "#3fd4c4" : "#1b2228";
        col.insertAdjacentHTML("beforeend", `<div class="pcard boil cc" style="left:${x}px;top:${y}px;background:${COLS[i]};transform:rotate(${r}deg)"><div class="tape"></div><svg><use href="#mk" fill="${f}" /></svg></div>`);
      });
      const boils = [...document.querySelectorAll(".boil")];
      const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

      const tl = gsap.timeline({ paused: true });
      const st = { t: 0 };
      tl.to(st, { t: 8, duration: 8, ease: "none", onUpdate: () => {
        const f = Math.floor(st.t * 8); // 8fps boil
        boils.forEach((el, i) => { el.style.setProperty("--bx", ((hash(f, i) - 0.5) * 6).toFixed(1) + "px"); el.style.setProperty("--by", ((hash(i, f) - 0.5) * 6).toFixed(1) + "px"); });
        document.getElementById("grain").style.transform = `translate(${(hash(f, 99) - .5) * 30}px, ${(hash(99, f) - .5) * 30}px)`;
      } }, 0);
      const stampIn = (sel, t) => tl.fromTo(sel, { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "steps(2)" }, t);
      // S1
      tl.fromTo("#h1", { scale: 0 }, { scale: 1, duration: 0.5, ease: "steps(4)" }, 0);
      stampIn("#w1", 0.1);
      tl.fromTo("#n1", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.6);
      tl.fromTo("#a1", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.75);
      // S2
      stampIn("#w2", 1.5);
      tl.fromTo("#tag", { rotation: -14 }, { rotation: 6, duration: 0.6, ease: "steps(5)", yoyo: true, repeat: 1 }, 1.5);
      tl.fromTo("#p5", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.75);
      tl.fromTo("#x5", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.05);
      tl.fromTo("#p12", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.12, ease: "steps(2)" }, 2.25);
      // S3 swap in stop-motion steps
      stampIn("#w3", 2.9);
      tl.to("#cA", { x: 540, y: 30, rotation: 10, duration: 0.6, ease: "steps(5)" }, 3.3);
      tl.to("#cB", { x: -540, y: -20, rotation: -9, duration: 0.6, ease: "steps(5)" }, 3.3);
      // S4 collage drop
      tl.fromTo(".cc", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "steps(2)", stagger: 0.09 }, 4.2);
      tl.fromTo("#circ", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 5.05);
      tl.fromTo("#this", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 5.2);
      // S5
      tl.fromTo(["#mkK", "#mkM"], { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "steps(2)" }, 5.65);
      tl.fromTo("#ring", { rotation: 0 }, { rotation: 60, duration: 1.0, ease: "steps(8)", transformOrigin: "50% 50%" }, 5.6);
      // S6
      tl.fromTo("#word", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.16, ease: "steps(2)" }, 6.65);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 7.0);
      stampIn("#yr", 6.9);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
