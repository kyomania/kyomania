<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Display"; font-weight: 500; src: url(assets/fonts/InterDisplay-Medium.otf); }
      @font-face { font-family: "Display"; font-weight: 600; src: url(assets/fonts/InterDisplay-SemiBold.otf); }
      @font-face { font-family: "Display"; font-weight: 700; src: url(assets/fonts/InterDisplay-Bold.otf); }
      @font-face { font-family: "Text"; font-weight: 500; src: url(assets/fonts/Inter-Medium.otf); }
      @font-face { font-family: "Text"; font-weight: 600; src: url(assets/fonts/Inter-SemiBold.otf); }
      @font-face { font-family: "Mono"; font-weight: 500; src: url(assets/fonts/jetbrains-mono-latin-500-normal.woff2); }
      :root { --ink: #1d1d1f; --grey: #86868b; --blue: #3e71b6; --green: #0c9958; --red: #df482b; --yellow: #fbb419;
        --display: "Display", sans-serif; --text: "Text", sans-serif; --mono: "Mono", monospace; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: var(--text); color: #fff; -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      video.clip { object-fit: cover; }
      .layer { pointer-events: none; }

      /* ---------- glass product cards ---------- */
      .card { position: absolute; left: 0; top: 0; width: 450px; height: 174px; margin: -87px 0 0 -225px; border-radius: 30px;
        background: linear-gradient(135deg, rgba(255,255,255,0.42), rgba(255,255,255,0.16)); border: 1.5px solid rgba(255,255,255,0.65);
        backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
        box-shadow: 0 24px 60px rgba(40,30,20,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
        display: flex; align-items: center; gap: 22px; padding: 18px 24px 18px 18px; color: var(--ink); will-change: transform, filter, opacity; }
      .card .ph { position: relative; width: 136px; height: 136px; border-radius: 20px; overflow: hidden; flex: none; background: #e9e6e1; }
      .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .sk { position: absolute; inset: 0; background: #ece9e4; opacity: 0; }
      .card .spin { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 3.5px solid rgba(29,29,31,0.15); border-top-color: rgba(29,29,31,0.55); opacity: 0; }
      .card .meta { flex: 1; min-width: 0; }
      .card .n { font: 600 28px/1.15 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
      .card .p { font: 500 23px var(--text); color: #3a3a3c; margin-top: 4px; }
      .card .bar { height: 5px; border-radius: 9px; background: rgba(29,29,31,0.12); margin-top: 14px; overflow: hidden; }
      .card .bar i { display: block; height: 100%; width: 100%; background: rgba(29,29,31,0.6); transform-origin: 0 50%; transform: scaleX(1); }
      .card .add { position: absolute; right: 18px; top: 18px; font: 600 15px var(--text); color: #fff; background: var(--ink); border-radius: 999px; padding: 7px 14px; }

      /* focus card (clip B) */
      #fc { z-index: 5; position: absolute; left: 175px; top: 250px; width: 470px; height: 190px; margin: 0; padding: 22px; gap: 24px; }
      #fc .ph { width: 146px; height: 146px; }
      #fc .n { font-size: 30px; }
      #fc .p { font-size: 24px; }
      #fc .btn { margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; font: 600 20px var(--text); color: #fff; background: var(--ink); border-radius: 999px; padding: 11px 22px; }
      #fc .ok { position: absolute; inset: 0; border-radius: 30px; background: rgba(255,255,255,0.97); display: flex; align-items: center; justify-content: center; gap: 18px; opacity: 0;
        font: 600 34px var(--display); letter-spacing: -0.01em; color: var(--ink); }
      #fc .ok .ck { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }

      /* ---------- bridge ---------- */
      #bridge { background: #000; display: flex; align-items: center; justify-content: center; }
      #bridge .t { font: 600 92px var(--display); letter-spacing: -0.03em; }

      /* ---------- flow graph (dense node network, tilt + depth of field) ---------- */
      #graph { background: #0b0b0c; }
      .dof { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 46%;
        background: radial-gradient(120% 95% at 50% 46%, #19191b 0%, #0e0e10 55%, #070708 100%); }
      .dof.far { filter: blur(9px); }
      .dof.mid { filter: blur(3.6px); -webkit-mask-image: linear-gradient(to bottom, transparent 4%, #000 18%, #000 80%, transparent 94%); mask-image: linear-gradient(to bottom, transparent 4%, #000 18%, #000 80%, transparent 94%); }
      .dof.sharp { -webkit-mask-image: linear-gradient(to bottom, transparent 24%, #000 36%, #000 62%, transparent 74%); mask-image: linear-gradient(to bottom, transparent 24%, #000 36%, #000 62%, transparent 74%); }
      .rot { position: absolute; left: 960px; top: 520px; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0; }
      .pan { position: absolute; left: 0; top: 0; width: 3400px; height: 2200px; transform-origin: 0 0; }
      .pan svg { position: absolute; left: 0; top: 0; width: 3400px; height: 2200px; overflow: visible; }
      .nd { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 16px; background: linear-gradient(160deg, #2c2c30, #1c1c1f);
        border: 1.5px solid rgba(255,255,255,0.10); box-shadow: 0 6px 18px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
      .nd svg { width: 30px; height: 30px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .nd .lb { position: absolute; top: 78px; left: 50%; width: 180px; margin-left: -90px; text-align: center; font: 500 12px/1.3 var(--mono); color: #6e6e73; }
      .nd.key { width: 86px; height: 86px; margin: -43px 0 0 -43px; border-radius: 20px; border-color: rgba(255,255,255,0.16); }
      .nd.key svg { width: 38px; height: 38px; }
      .nd.key .lb { top: 100px; width: 240px; margin-left: -120px; font: 600 17px/1.3 var(--text); color: #aeaeb2; }
      .nd.key .lb b { display: block; font: 500 13px var(--mono); color: #6e6e73; margin-top: 2px; }
      .nd .glow { position: absolute; inset: -1.5px; border-radius: inherit; background: linear-gradient(160deg, #b9fff0, #59e3c2); opacity: 0;
        box-shadow: 0 0 26px rgba(120,255,215,0.75), 0 0 70px rgba(80,230,190,0.45); }
      .nd .glow.red { background: linear-gradient(160deg, #ff9a86, #df482b); box-shadow: 0 0 26px rgba(255,110,80,0.7), 0 0 70px rgba(223,72,43,0.4); }
      .nd .ico2 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .nd .ico2 svg { stroke: #0b3d33; }
      #gcap { position: absolute; left: 120px; bottom: 110px; z-index: 5; }
      #gcap .e { font: 600 22px var(--text); color: #8e8e93; letter-spacing: 0.06em; text-transform: uppercase; }
      #gcap .t { position: relative; height: 96px; margin-top: 8px; }
      #gcap .t div { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 84px/1.05 var(--display); letter-spacing: -0.03em; color: #fff; opacity: 0; }
      #gshade { position: absolute; left: 0; bottom: 0; width: 1920px; height: 420px; background: linear-gradient(rgba(7,7,8,0), rgba(7,7,8,0.85)); z-index: 4; }
      /* ---------- end card ---------- */
      #end { background: #000; }
      #end .ic { position: absolute; left: 50%; top: 250px; width: 170px; height: 170px; margin-left: -85px; }
      #end .t { position: absolute; left: 0; width: 1920px; top: 500px; text-align: center; font: 600 76px var(--display); letter-spacing: -0.03em; }
      #end .t .g { color: #86868b; }
      #end .c { position: absolute; left: 0; width: 1920px; top: 640px; text-align: center; font: 500 34px var(--text); color: #a1a1a6; }
      #end .c b { color: #fff; font-weight: 600; }
      .ln { display: block; overflow: hidden; padding-bottom: 0.08em; }
      .ln > span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080" data-fps="30">
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="25" data-volume="1"></audio>

      <!-- ===== 1: waiting (0 – 4.6) ===== -->
      <video id="bgA" class="clip" src="assets/clips/manA.mp4" muted playsinline data-start="0" data-duration="4.6" data-media-start="0" data-track-index="1"></video>
      <div id="backA" class="clip layer" data-start="0" data-duration="4.6" data-track-index="2"></div>
      <video id="mtA" class="clip" src="assets/clips/manA_alpha.webm" muted playsinline data-start="0" data-duration="4.6" data-media-start="0" data-track-index="3"></video>
      <div id="frontA" class="clip layer" data-start="0" data-duration="4.6" data-track-index="4"></div>

      <!-- ===== 2: bridge (4.6 – 5.8) ===== -->
      <div id="bridge" class="clip" data-start="4.6" data-duration="1.2" data-track-index="5"><div class="t"><span class="ln" id="brt"><span>Here's the fix.</span></span></div></div>

      <!-- ===== 3: flow graph (5.8 – 15.06) — generated clip ===== -->
      <video id="flowv" class="clip" src="assets/clips/flow.mp4" muted playsinline data-start="5.8" data-duration="9.26" data-media-start="0" data-track-index="6"></video>
      <div id="graph" class="clip" data-start="5.8" data-duration="9.26" data-track-index="13" style="background:transparent">
        <div id="gshade"></div>
        <div id="gcap"><div class="e">fast.site · request flow</div>
          <div class="t"><div id="gc1">Nearest edge.</div><div id="gc2">Straight from cache.</div><div id="gc3">Images, −35 %.</div><div id="gc4">Attacks blocked.</div></div></div>
      </div>

      <!-- ===== 4: instant (15.06 – 18.6) ===== -->
      <video id="bgB" class="clip" src="assets/clips/manB.mp4" muted playsinline data-start="15.06" data-duration="3.54" data-media-start="0.4" data-track-index="7"></video>
      <div id="backB" class="clip layer" data-start="15.06" data-duration="3.54" data-track-index="8"></div>
      <video id="mtB" class="clip" src="assets/clips/manB_alpha.webm" muted playsinline data-start="15.06" data-duration="3.54" data-media-start="0.4" data-track-index="9"></video>
      <div id="frontB" class="clip layer" data-start="15.06" data-duration="3.54" data-track-index="10">
        <div class="card" id="fc">
          <div class="ph"><img src="assets/img/sneaker.jpg" /></div>
          <div class="meta"><div class="n">Runner 01</div><div class="p">€129</div><div class="btn" id="fcb">Add to bag</div></div>
          <div class="ok" id="fok" data-layout-ignore><div class="ck"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M7 14.5l4.5 4.5L21 9.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Order confirmed</div>
        </div>
      </div>

      <!-- ===== 5: rocket (18.6 – 22.14) ===== -->
      <video id="rocket" class="clip" src="assets/clips/rocket.mp4" muted playsinline data-start="18.6" data-duration="3.54" data-media-start="0.5" data-track-index="11"></video>

      <!-- ===== 6: end card (22.14 – 25) ===== -->
      <div id="end" class="clip" data-start="22.14" data-duration="2.86" data-track-index="12">
        <svg class="ic" id="endic" viewBox="0 0 200 200">{{TOP}}{{BOT}}</svg>
        <div class="t"><span class="ln" id="endt"><span>Make your website faster. <span class="g">Keep your hosting.</span></span></span></div>
        <div class="c" id="endc"><b>fast.site</b> · Try it free for 7 days</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const tl = gsap.timeline({ paused: true });
      const EX = "expo.out", E = "power3.out";
      const lineIn = (sel, t, d = 0.8) => tl.fromTo(sel + " > span", { yPercent: 110 }, { yPercent: 0, duration: d, ease: EX }, t);

      // ---------------- orbiting cards ----------------
      const products = [
        ["sneaker.jpg", "Runner 01", "€129"], ["hoodie.jpg", "Heavy Hoodie", "€89"], ["cap.jpg", "Field Cap", "€39"],
        ["bottle.jpg", "Stone Bottle", "€34"], ["beanie.jpg", "Rib Beanie", "€29"], ["sneaker.jpg", "Runner 02", "€139"]
      ];
      const cardHTML = (p) => `<div class="ph"><img src="assets/img/${p[0]}" style="${p[1] === "Runner 02" ? "transform:scaleX(-1)" : ""}"/><div class="sk"></div><div class="spin"></div></div>
        <div class="meta"><div class="n">${p[1]}</div><div class="p">${p[2]}</div><div class="bar"><i></i></div></div><div class="add">Add</div>`;
      function makeSet(backId, frontId) {
        return products.map((p) => {
          const b = document.createElement("div"); b.className = "card"; b.innerHTML = cardHTML(p); $(backId).appendChild(b);
          const f = document.createElement("div"); f.className = "card"; f.innerHTML = cardHTML(p); $(frontId).appendChild(f);
          return [b, f];
        });
      }
      const setA = makeSet("#backA", "#frontA");
      products[0] = ["sneaker.jpg", "Trail 03", "€149"];
      const setB = makeSet("#backB", "#frontB");
      const ring = (i) => (i % 2 === 0 ? { cy: 300, rx: 700, ry: 70 } : { cy: 650, rx: 760, ry: 90 });
      function place(set, cx, angle0, vis, loadK, kPop) {
        set.forEach((pair, i) => {
          const r = ring(i), a = angle0 + i * (Math.PI * 2 / 6) + (i % 2) * 0.5;
          const d = Math.sin(a);                 // +1 in front of him, -1 behind him
          const x = cx + r.rx * Math.cos(a), y = r.cy + r.ry * d;
          const sc = (0.74 + 0.26 * (d + 1) / 2) * (kPop ?? 1);
          const blur = d < 0 ? (-d) * 5 : 0;
          const ry = -Math.cos(a) * 32;
          const op = vis[i] * (d < 0 ? 0.82 + 0.18 * (1 + d) : 1);
          const front = d >= 0;
          const tgt = front ? pair[1] : pair[0], other = front ? pair[0] : pair[1];
          other.style.opacity = 0;
          tgt.style.opacity = op;
          tgt.style.transform = `translate(${x}px, ${y}px) perspective(900px) rotateY(${ry}deg) scale(${sc})`;
          tgt.style.filter = blur > 0.2 ? `blur(${blur.toFixed(2)}px)` : "none";
          // loading state
          [pair[0], pair[1]].forEach((c) => {
            c.querySelector("img").style.filter = loadK > 0 ? `blur(${(loadK * 9).toFixed(1)}px) saturate(${1 - loadK * 0.7})` : "none";
            c.querySelector(".sk").style.opacity = loadK * 0.75;
            c.querySelector(".spin").style.opacity = loadK;
            c.querySelector(".spin").style.transform = `rotate(${(loadK > 0 ? orbit.t * 360 : 0)}deg)`;
            c.querySelector(".bar i").style.transform = `scaleX(${loadK > 0 ? (0.08 + 0.25 * ((orbit.t * 0.35 + i * 0.13) % 1)) : 1})`;
          });
        });
      }
      // scene 1 orbit: starts moving, then slows almost to a stop while loading
      const orbit = { t: 0 };
      const visA = [0, 0, 0, 0, 0, 0];
      function angleA(t) { // angular speed 0.55 rad/s, decelerating to 0.05 rad/s between 2.6 s and 3.8 s
        if (t < 2.6) return 0.55 * t;
        if (t < 3.8) { const u = t - 2.6; return 1.43 + 0.55 * u - 0.5 * (0.5 / 1.2) * u * u; }
        return 1.79 + 0.05 * (t - 3.8);
      }
      tl.fromTo(orbit, { t: 0 }, { t: 4.6, duration: 4.6, ease: "none", onUpdate: () => {
        const t = orbit.t;
        for (let i = 0; i < 6; i++) visA[i] = Math.min(1, Math.max(0, (t - 0.25 - i * 0.12) / 0.5));
        const loadK = Math.min(1, Math.max(0, (t - 2.5) / 0.5));
        const fade = t > 4.25 ? Math.max(0, 1 - (t - 4.25) / 0.35) : 1;
        place(setA, 1060, -0.6 + angleA(t), visA.map((v) => v * fade), loadK, 0.96 + 0.04 * Math.min(1, t / 1));
      } }, 0);

      // scene 4 orbit: instant, fast spin settling down
      const orbitB = { t: 0 };
      const visB = [1, 1, 1, 1, 1, 1];
      tl.fromTo(orbitB, { t: 0 }, { t: 3.54, duration: 3.54, ease: "none", onUpdate: () => {
        const t = orbitB.t;
        const ang = 2.4 * (1 - Math.exp(-t / 0.55)) + 0.25 * t; // whip then cruise
        const pop = 1 + 0.08 * Math.exp(-t / 0.18);
        place(setB, 1080, 0.9 + ang, visB, 0, pop);
      } }, 15.06);

      // focus card: tap -> added -> order confirmed
      tl.fromTo("#fc", { opacity: 0, scale: 0.9, x: -40 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: EX }, 15.08);
      tl.to("#fcb", { scale: 0.92, duration: 0.08 }, 15.62);
      tl.to("#fcb", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 15.7);
      tl.set("#fcb", { textContent: "Added ✓", backgroundColor: "#0c9958" }, 15.7);
      tl.set("#fcb", { textContent: "Add to bag", backgroundColor: "#1d1d1f" }, 0);
      tl.fromTo("#fok", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.35, ease: EX }, 17.0);
      tl.to("#fc", { y: -10, duration: 1.4, ease: "sine.inOut" }, 17.0);

      // ---------------- bridge ----------------
      lineIn("#brt", 4.68, 0.7);

      // ---------------- flow graph: generated clip + captions synced to the voice ----------------
      [["#gc1", 6.4, 8.6], ["#gc2", 8.9, 10.8], ["#gc3", 11.0, 13.0], ["#gc4", 13.2, 15.0]].forEach(([s, a, b]) => {
        tl.fromTo(s, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: EX }, a);
        tl.to(s, { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, b);
      });
      tl.fromTo("#gcap .e", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.1);
      tl.fromTo("#flowv", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 5.8);

      // ---------------- end card ----------------
      tl.fromTo("#endic", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: EX }, 22.2);
      lineIn("#endt", 22.45, 0.8);
      tl.fromTo("#endc", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, 22.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
