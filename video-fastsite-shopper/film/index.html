      @font-face { font-family: "Display"; font-weight: 600; src: url(assets/fonts/InterDisplay-SemiBold.otf); }

      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      video.clip { object-fit: cover; }
      .layer { pointer-events: none; }

      /* ---------- glass product cards ---------- */
      .card { position: absolute; left: 0; top: 0; width: 450px; height: 174px; margin: -87px 0 0 -225px; border-radius: 30px;
        background: linear-gradient(135deg, rgba(255,255,255,0.42), rgba(255,255,255,0.16)); border: 1.5px solid rgba(255,255,255,0.65);
        backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
        box-shadow: 0 24px 60px rgba(40,30,20,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
        display: flex; align-items: center; gap: 22px; padding: 18px 24px 18px 18px; color: var(--ink); will-change: transform, filter, opacity; }
      .card .ph { position: relative; width: 136px; height: 136px; border-radius: 20px; overflow: hidden; flex: none; background: #e9e6e1; }
      .card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .sk { position: absolute; inset: 0; background: #ece9e4; opacity: 0; }
      .card .spin { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 3.5px solid rgba(29,29,31,0.15); border-top-color: rgba(29,29,31,0.55); opacity: 0; }
      .card .meta { flex: 1; min-width: 0; }
      .card .n { font: 600 28px/1.15 var(--display); letter-spacing: -0.01em; white-space: nowrap; }
      .card .p { font: 500 23px var(--text); color: #3a3a3c; margin-top: 4px; }
      .card .bar { height: 5px; border-radius: 9px; background: rgba(29,29,31,0.12); margin-top: 14px; overflow: hidden; }
      .card .bar i { display: block; height: 100%; width: 100%; background: rgba(29,29,31,0.6); transform-origin: 0 50%; transform: scaleX(1); }
      .card .add { position: absolute; right: 18px; top: 18px; font: 600 15px var(--text); color: #fff; background: var(--ink); border-radius: 999px; padding: 7px 14px; }

        font: 600 34px var(--display); letter-spacing: -0.01em; color: var(--ink); }
      #fc .ok .ck { width: 52px; height: 52px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }

      /* ---------- bridge ---------- */
      #bridge { background: #000; display: flex; align-items: center; justify-content: center; }
      #bridge .t { font: 600 92px var(--display); letter-spacing: -0.03em; }

      /* ---------- flow graph ---------- */
      #graph { background: radial-gradient(120% 90% at 50% 40%, #121214 0%, #050506 70%); }
      #persp { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 50%; }
      #plane { position: absolute; left: 0; top: 0; width: 5600px; height: 1500px; transform-origin: 0 0; }
      #grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.10) 1.4px, transparent 1.6px); background-size: 56px 56px; }
      #wires { position: absolute; left: 0; top: 0; width: 5600px; height: 1500px; overflow: visible; }
      .node { position: absolute; width: 330px; height: 196px; margin: -98px 0 0 -165px; border-radius: 30px; padding: 26px 28px;

      .node .s { font: 500 20px var(--mono); margin-top: 6px; color: #6e6e73; }
      .node .lit { position: absolute; inset: -1.5px; border-radius: 30px; border: 2px solid var(--c); opacity: 0; }
      .node.faint { opacity: 0.45; }
      #gtitle { position: absolute; left: 120px; top: 90px; font: 600 30px var(--text); color: #6e6e73; letter-spacing: 0.02em; }

      /* ---------- end card ---------- */
      #end { background: #000; }
      #end .ic { position: absolute; left: 50%; top: 250px; width: 170px; height: 170px; margin-left: -85px; }
      #end .t { position: absolute; left: 0; width: 1920px; top: 500px; text-align: center; font: 600 76px var(--display); letter-spacing: -0.03em; }
      #end .t .g { color: #86868b; }

      #end .c b { color: #fff; font-weight: 600; }
