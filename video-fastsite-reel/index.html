<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --blue: #3f71b5; --green: #0f9956; --red: #df4a2a; --yellow: #f9b41b;
        --paper: #f3efe7; --ink: #0b0d12;
        --font-display: "Inter Tight", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); background: var(--ink); }
      #world { position: absolute; inset: -40px; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .big { position: absolute; left: 60px; right: 60px; font-weight: 900; text-transform: uppercase; line-height: 0.86;
        letter-spacing: -0.05em; color: #fff; }
      .big .ln { display: block; white-space: nowrap; }
      .big .ch { display: inline-block; }
      .tag { position: absolute; font-family: var(--font-mono); font-size: 34px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; padding: 14px 26px; border-radius: 999px; }
      #logo { overflow: visible !important; position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; z-index: 40; }
      #logo svg { width: 100%; height: 100%; overflow: visible; }
      .sweep { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
      .swc { position: absolute; left: -400px; width: 1880px; height: 1880px; top: 20px; overflow: visible; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 90; }
      #s1 { background: var(--ink); }
      .timer { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-family: var(--font-mono);
        font-weight: 700; color: #fff; font-size: 210px; letter-spacing: -0.04em; }
      .timer small { display: block; font-size: 34px; letter-spacing: 0.2em; opacity: .8; margin-bottom: 10px; }
      .streak { position: absolute; height: 10px; border-radius: 5px; background: #fff; left: 0; }
      .pct { position: absolute; left: 0; right: 0; top: 180px; text-align: center; font-weight: 900; font-size: 380px;
        letter-spacing: -0.07em; color: var(--ink); line-height: 1; }
      .kb { position: absolute; left: 50%; top: 600px; margin-left: -330px; width: 660px; text-align: center; background: var(--ink); color: #fff;
        border-radius: 999px; padding: 22px 0; font-family: var(--font-mono); font-size: 44px; white-space: nowrap; }
      .kb b { color: var(--yellow); font-weight: 700; }
      .dot { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--red); }
      .ring { position: absolute; left: 50%; top: 50%; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%;
        border: 14px solid var(--green); }
      #s5 { background: var(--paper); }
      .codewall { position: absolute; inset: 0; padding: 120px 60px; font-family: var(--font-mono); font-size: 34px; line-height: 1.55;
        color: var(--ink); white-space: pre; }
      .codewall .k { color: var(--blue); } .codewall .s { color: #b83c22; } .codewall .c { color: #0b7a44; }
      .crush { position: absolute; inset: 0; transform-origin: 50% 50%; overflow: hidden; }
      #s6 { background: var(--paper); }
      .marq { position: absolute; left: 0; white-space: nowrap; font-weight: 900; font-size: 260px; letter-spacing: -0.06em;
        line-height: 1; color: var(--ink); }
      .marq.o { color: transparent; -webkit-text-stroke: 4px var(--ink); }
      .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(11, 1fr); padding: 20px; }
      .cell { display: flex; align-items: center; justify-content: center; }
      .cell svg { width: 130px; height: 130px; overflow: visible; }
      #s7 { background: var(--ink); }
      .brand { position: absolute; left: 0; right: 0; top: 1130px; text-align: center; font-weight: 900; font-size: 200px;
        letter-spacing: -0.06em; color: #fff; white-space: nowrap; }
      .brand .d { color: var(--yellow); }
      .cta { position: absolute; left: 50%; top: 1420px; margin-left: -300px; width: 600px; text-align: center; background: #fff; color: var(--ink);
        border-radius: 999px; padding: 36px 0; font-weight: 900; font-size: 64px; letter-spacing: -0.03em; }
      .sub { position: absolute; left: 0; right: 0; top: 1600px; text-align: center; font-family: var(--font-mono);
        font-size: 32px; color: #fff; opacity: .8; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="world">
      <div id="s1" class="clip" data-start="0" data-duration="1.2" data-track-index="0">
        <div class="big" style="top:1300px;font-size:200px"><span class="ln">Your</span><span class="ln">website.</span></div>
      </div>
      <div id="s2" class="clip" data-start="1.2" data-duration="1.25" data-track-index="0">
        <img class="bg" src="assets/bg1.png" alt="" />
        <div class="streak" style="top:420px;width:620px"></div>
        <div class="streak" style="top:1180px;width:820px;background:var(--yellow)"></div>
        <div class="streak" style="top:1520px;width:520px;background:var(--green)"></div>
        <div class="timer"><small>Load time</small><span id="secs">4.8</span>s</div>
        <div class="big" style="top:1300px;font-size:230px"><span class="ln">Just</span><span class="ln">faster.</span></div>
      </div>
      <div id="s3" class="clip" data-start="2.45" data-duration="1.5" data-track-index="0">
        <img class="bg" src="assets/bg2.png" alt="" />
        <div class="pct">−35%</div>
        <div class="kb">JPG <span id="kb">303.4</span> KB <b>→ WEBP</b></div>
        <div class="big" style="top:1330px;font-size:190px;color:var(--ink)"><span class="ln">Smarter</span><span class="ln">images.</span></div>
      </div>
      <div id="s4" class="clip" data-start="3.95" data-duration="1.45" data-track-index="0">
        <img class="bg" src="assets/bg3.png" alt="" />
        <div class="ring"></div>
        <div id="dots"></div>
        <div class="tag" style="left:60px;top:200px;background:var(--red);color:#fff">DDoS · Blocked</div>
        <div class="big" style="top:1380px;font-size:165px;color:var(--ink)"><span class="ln">Built-in</span><span class="ln">protection.</span></div>
      </div>
      <div id="s5" class="clip" data-start="5.4" data-duration="1.35" data-track-index="0">
        <img class="bg" src="assets/bg4.png" alt="" />
        <div class="crush" id="crush" style="background:var(--paper)"><div class="codewall" id="codewall" data-layout-ignore></div></div>
        <div class="big" style="top:1330px;font-size:200px;color:var(--ink)"><span class="ln">No code</span><span class="ln">needed.</span></div>
      </div>
      <div id="s6" class="clip" data-start="6.75" data-duration="1.7" data-track-index="0">
        <div class="grid" id="grid"></div>
        <div class="marq" id="m1" style="top:330px">fast.site fast.site fast.site</div>
        <div class="marq o" id="m2" style="top:1330px">fast.site fast.site fast.site</div>
      </div>
      <div id="s7" class="clip" data-start="8.45" data-duration="1.55" data-track-index="0">
        <div class="brand">fast<span class="d">.</span>site</div>
        <div class="cta">Start free trial</div>
        <div class="sub">7 days free · No credit card</div>
      </div>
      <div id="logo" class="clip" data-start="0" data-duration="10" data-track-index="1" style="inset:auto;left:50%;top:50%">
        <svg viewBox="0 0 1024 1024">
          <line id="lg" x1="512" y1="135" x2="840" y2="462" stroke="#0f9956" stroke-width="196" stroke-linecap="round" />
          <line id="lb" x1="182" y1="462" x2="512" y2="135" stroke="#3f71b5" stroke-width="196" stroke-linecap="round" />
          <line id="ly" x1="512" y1="566" x2="840" y2="893" stroke="#f9b41b" stroke-width="196" stroke-linecap="round" />
          <line id="lr" x1="182" y1="893" x2="512" y2="566" stroke="#df4a2a" stroke-width="196" stroke-linecap="round" />
        </svg>
      </div>
      </div>
      <div class="sweep clip" id="sweeps" data-start="0" data-duration="10" data-track-index="2"></div>
      <div class="flash clip" id="flash" data-start="0" data-duration="10" data-track-index="3"></div>

      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="10" data-volume="0.5" data-fade-out="0.4" data-track-index="5"></audio>
      <audio id="vo" src="assets/vo.mp3" data-start="0.1" data-duration="9.8" data-volume="1.25" data-track-index="6"></audio>
      <audio id="sw1a" src="assets/whoosh.wav" data-start="1.0" data-duration="0.35" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sw2a" src="assets/whoosh.wav" data-start="2.25" data-duration="0.35" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sw3a" src="assets/whoosh.wav" data-start="3.75" data-duration="0.35" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sw4a" src="assets/whoosh.wav" data-start="5.2" data-duration="0.35" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sw5a" src="assets/whoosh.wav" data-start="6.55" data-duration="0.35" data-volume="0.35" data-track-index="7"></audio>
      <audio id="sw6a" src="assets/whoosh.wav" data-start="8.25" data-duration="0.35" data-volume="0.4" data-track-index="7"></audio>
      <audio id="tk1" src="assets/tick.wav" data-start="0.55" data-duration="0.05" data-volume="0.4" data-track-index="8"></audio>
      <audio id="tk2" src="assets/tick.wav" data-start="3.3" data-duration="0.05" data-volume="0.4" data-track-index="8"></audio>
      <audio id="tk3" src="assets/tick.wav" data-start="8.6" data-duration="0.05" data-volume="0.45" data-track-index="8"></audio>
    </div>

    <script>
      const C = ["#3f71b5", "#0f9956", "#df4a2a", "#f9b41b"];
      const CUTS = [1.2, 2.45, 3.95, 5.4, 6.75, 8.45];

      document.querySelectorAll(".big .ln").forEach((ln) => {
        ln.innerHTML = [...ln.textContent].map((c) => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
      });

      const sweeps = document.getElementById("sweeps");
      CUTS.forEach((t, i) => {
        const g = document.createElement("div");
        g.id = "swg" + i; g.style.cssText = "position:absolute;inset:0";
        g.innerHTML = C.map((_, k) =>
          `<svg viewBox="0 0 100 100" class="swc"><polyline points="8,70 50,28 92,70" fill="none" stroke="${C[(k + i) % 4]}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>`).join("");
        sweeps.appendChild(g);
      });

      const dots = document.getElementById("dots");
      for (let i = 0; i < 28; i++) { const d = document.createElement("div"); d.className = "dot"; dots.appendChild(d); }

      const code = [
        `<span class="k">const</span> cache = <span class="k">new</span> EdgeCache({`,
        `  ttl: <span class="s">"1h"</span>, regions: <span class="s">"*"</span>`,
        `});`, `<span class="c">// TODO: optimize images??</span>`,
        `<span class="k">for</span> (img <span class="k">of</span> imgs) convert(img, <span class="s">"webp"</span>);`,
        `<span class="k">if</span> (req.rate > LIMIT) block(req.ip);`,
        `nginx.conf.reload();`, `<span class="c">// FIXME: ddos rules</span>`,
        `purgeCDN(); warmCache();`, `<span class="k">await</span> deploy(<span class="s">"prod"</span>);`,
        `<span class="c">// why is it still slow</span>`,
      ];
      document.getElementById("codewall").innerHTML = code.concat(code, code).join("\n");

      const grid = document.getElementById("grid");
      for (let i = 0; i < 66; i++) {
        const r = Math.floor(i / 6), c = i % 6, k = (r + c) % 4;
        const cell = document.createElement("div"); cell.className = "cell";
        cell.innerHTML = `<svg viewBox="0 0 100 100"><g class="chev" style="transform-origin:50px 50px">` +
          `<line x1="50" y1="30" x2="82" y2="66" stroke="${C[(k + 1) % 4]}" stroke-width="20" stroke-linecap="round"/>` +
          `<line x1="18" y1="66" x2="50" y2="30" stroke="${C[k]}" stroke-width="20" stroke-linecap="round"/></g></svg>`;
        grid.appendChild(cell);
      }

      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      const slam = (sel, t, from = { yPercent: 120, rotation: 8 }) =>
        tl.fromTo(sel + " .big .ch", { ...from, opacity: 0 }, { yPercent: 0, xPercent: 0, rotation: 0, scale: 1, skewX: 0, opacity: 1, duration: 0.32, ease: "expo.out", stagger: 0.022 }, t);
      const shakeKeys = [[18, -12], [-14, 10], [10, 8], [-6, -5], [0, 0]];
      const shake = (t, amp = 1) => shakeKeys.forEach(([x, y], i) =>
        tl.to("#world", { x: x * amp, y: y * amp, duration: 0.04, ease: "none" }, t + i * 0.04));
      const flash = (t, o = 0.7) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.2, ease: "power2.out", ...IR }, t);
      const punch = (sel, t, d, s = 1.35) => tl.fromTo(sel + " .bg", { scale: s }, { scale: 1, duration: d, ease: "expo.out" }, t);

      CUTS.forEach((t, i) => {
        tl.fromTo(`#swg${i} .swc`, { y: 2100 }, { y: -2300, duration: 0.55, ease: "power2.inOut", stagger: 0.045 }, t - 0.32);
      });

      // S1 logo assembles
      tl.fromTo("#logo", { scale: 3.2, y: 0 }, { scale: 3.2, y: 0, duration: 0.01 }, 0);
      tl.fromTo("#lb", { x: -900, y: 600 }, { x: 0, y: 0, duration: 0.38, ease: "expo.out" }, 0.05);
      tl.fromTo("#lg", { x: 900, y: 600 }, { x: 0, y: 0, duration: 0.38, ease: "expo.out" }, 0.13);
      tl.fromTo("#lr", { x: -900, y: -700 }, { x: 0, y: 0, duration: 0.38, ease: "expo.out" }, 0.21);
      tl.fromTo("#ly", { x: 900, y: -700 }, { x: 0, y: 0, duration: 0.38, ease: "expo.out" }, 0.29);
      shake(0.55, 1.4); flash(0.55, 0.35);
      tl.to("#logo", { scale: 1, y: -330, duration: 0.45, ease: "expo.inOut" }, 0.62);
      slam("#s1", 0.7);

      // S2 speed
      punch("#s2", 1.2, 1.25, 1.6);
      tl.to("#logo", { y: 40, scale: 0.85, duration: 0.3, ease: "expo.out" }, 1.2);
      tl.fromTo("#s2 .streak", { x: -1200 }, { x: 1400, duration: 0.5, ease: "power2.in", stagger: 0.12, repeat: 1 }, 1.25);
      const secs = { v: 4.8 };
      tl.fromTo(secs, { v: 4.8 }, { v: 0.9, duration: 0.75, ease: "expo.out", onUpdate: () => (document.getElementById("secs").textContent = secs.v.toFixed(1)) }, 1.35);
      tl.fromTo("#s2 .timer", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 1.25);
      slam("#s2", 1.4, { xPercent: -200, skewX: -30 });
      shake(2.05, 0.8);

      // S3 images
      punch("#s3", 2.45, 1.5, 1.5);
      tl.fromTo("#s3 .bg", { filter: "blur(30px)" }, { filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 2.45);
      const kb = { v: 303.4 };
      tl.fromTo(kb, { v: 303.4 }, { v: 198.2, duration: 0.7, ease: "power2.inOut", onUpdate: () => (document.getElementById("kb").textContent = kb.v.toFixed(1)) }, 2.6);
      tl.fromTo("#s3 .kb", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, 2.5);
      tl.fromTo("#s3 .pct", { scale: 4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 3.3);
      shake(3.45, 1.3); flash(3.45, 0.3);
      slam("#s3", 2.55, { yPercent: -120, rotation: -10 });
      tl.to("#logo", { rotation: 360, duration: 0.5, ease: "expo.inOut" }, 2.45);

      // S4 protection
      punch("#s4", 3.95, 1.45, 1.3);
      tl.fromTo("#s4 .ring", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.98);
      document.querySelectorAll("#dots .dot").forEach((d, i) => {
        const a = (i / 28) * Math.PI * 2 + (i % 3) * 0.13;
        const R = 1300, r = 310, t0 = 4.1 + (i % 7) * 0.07;
        tl.fromTo(d, { x: Math.cos(a) * R, y: Math.sin(a) * R, scale: 1, opacity: 1 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r, duration: 0.35, ease: "power2.in" }, t0);
        tl.to(d, { scale: 3.5, opacity: 0, duration: 0.18, ease: "power2.out" }, t0 + 0.35);
      });
      [4.45, 4.66, 4.88].forEach((t) => tl.fromTo("#s4 .ring", { scale: 1.12 }, { scale: 1, duration: 0.16, ease: "power2.out", ...IR }, t));
      shake(4.45, 0.6); shake(4.88, 0.6);
      tl.fromTo("#s4 .tag", { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 4.5);
      slam("#s4", 4.0);
      tl.to("#logo", { scale: 1.1, duration: 0.3, ease: "expo.out" }, 3.95);

      // S5 code crush
      tl.fromTo("#codewall", { y: 0 }, { y: -700, duration: 0.8, ease: "none" }, 5.4);
      tl.fromTo("#crush", { scaleY: 1 }, { scaleY: 0, duration: 0.3, ease: "expo.in" }, 5.85);
      shake(6.15, 1.5); flash(6.15, 0.4);
      punch("#s5", 6.15, 0.6, 1.25);
      slam("#s5", 6.0, { scale: 3, yPercent: 0 });
      tl.to("#logo", { scale: 0.9, y: -120, duration: 0.3, ease: "expo.out" }, 5.4);

      // S6 pattern
      tl.fromTo("#s6 .chev", { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)", stagger: { each: 0.006, from: "center", grid: [11, 6] } }, 6.75);
      tl.to("#s6 .chev", { y: -22, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: { each: 0.012, from: "start", grid: [11, 6], axis: "y" } }, 7.2);
      tl.fromTo("#m1", { x: 0 }, { x: -1400, duration: 1.7, ease: "none" }, 6.75);
      tl.fromTo("#m2", { x: -1400 }, { x: 0, duration: 1.7, ease: "none" }, 6.75);
      tl.to("#logo", { scale: 1.9, y: 0, duration: 0.4, ease: "expo.out" }, 6.75);
      tl.to("#logo", { rotation: 720, duration: 0.6, ease: "expo.inOut" }, 7.5);

      // S7 CTA
      tl.to("#logo", { scale: 1.5, y: -300, duration: 0.4, ease: "expo.out" }, 8.45);
      tl.fromTo("#s7 .brand", { scale: 2.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 8.6);
      shake(8.75, 1.2);
      tl.fromTo("#s7 .cta", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 8.85);
      tl.fromTo("#s7 .sub", { opacity: 0, y: 20 }, { opacity: 0.8, y: 0, duration: 0.3 }, 9.05);
      tl.fromTo("#s7 .cta", { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "power2.out", ...IR }, 9.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
