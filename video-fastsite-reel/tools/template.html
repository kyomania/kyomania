<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ink: #0d0f14; --font-mono: "JetBrains Mono", monospace; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .fill { position: absolute; inset: 0; }
      .mono { position: absolute; font-family: var(--font-mono); font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.5; }
      .gl { position: absolute; opacity: .6; }
      .gc { position: absolute; left: 50%; top: 50%; border: 2px solid; border-radius: 50%; opacity: .6; }
      .pill { position: absolute; height: 46px; border-radius: 23px; }
      .pin { position: absolute; left: 50%; top: 640px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; }
      .logo { position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; }
      .lg { width: 100%; height: 100%; overflow: visible; }
      .lg line { stroke-width: 196; stroke-linecap: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
{{SHOTS}}
      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="10" data-volume="0.9" data-fade-out="0.6" data-track-index="5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // subtle slow push on photo shots, logo stays locked
      document.querySelectorAll(".shot").forEach((s) => {
        const st = parseFloat(s.dataset.start), du = parseFloat(s.dataset.duration);
        const f = s.querySelector(".bg, .fill");
        tl.fromTo(f, { scale: 1.04 }, { scale: 1, duration: du, ease: "none" }, st);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
