<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0f14;font-family:Inter,Arial,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.L{position:absolute;inset:0;display:none;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lbl{position:absolute;font-size:15px;letter-spacing:4px;font-weight:500;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.sl{position:absolute;font-size:14px;letter-spacing:3px;font-weight:500;text-transform:uppercase}
.pill{position:absolute;height:120px;border-radius:60px;font-size:50px;font-weight:500;display:flex;align-items:center;gap:22px;padding:0 50px;white-space:nowrap;letter-spacing:-1px}
</style></head><body><div id="stage">
<div class="L" id="Lpanel"><div class="lbl" id="pl1" style="left:150px;top:200px">cardmarket.pro · brand system</div><div class="lbl" id="pl2" style="left:150px;bottom:200px">logo construction</div>
 <svg width="1080" height="1920" style="position:absolute;inset:0"><g id="pg" fill="none" stroke-width="1.5"></g></svg></div>
<div class="L" id="Lcons"><svg width="1080" height="1920" style="position:absolute;inset:0"><g id="cg" fill="none" stroke-width="2"></g><g id="cn"></g></svg>
 <div class="sl" id="cl1" style="left:690px;top:640px">card frame</div><div class="sl" id="cl2" style="left:690px;top:880px">cardmarket.pro</div><div class="sl" id="cl3" style="left:690px;top:1120px">track index</div><div class="sl" id="cl4" style="left:160px;top:880px">grid 8pt</div></div>
<div class="L" id="Lui"><div id="rows" style="position:absolute;left:0;top:30px"></div></div>
<div class="L" id="Lphoto"><img id="ph" class="bg"></div>
</div>
<div id="ov" style="position:absolute;inset:0;pointer-events:none">
 <img id="FL" src="a/icon.png" style="position:absolute;width:190px;left:445px;top:700px">
 <img id="WM" src="a/wordmark.png" style="position:absolute;width:480px;left:300px;top:1180px;transform:rotate(-90deg)">
 <div style="position:absolute;right:56px;top:120px;text-align:right;color:#fff" id="tag"><svg width="34" height="34" viewBox="0 0 24 24" style="display:block;margin:0 0 10px auto"><g fill="none" stroke="#fff" stroke-width="2" id="tgi"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.5"/></g></svg><div style="font-size:20px;font-weight:700;letter-spacing:1px">@CARDMARKET.PRO</div><div style="font-size:14px;opacity:.6;margin-top:4px">TCG • SPORTS CARDS</div></div>
 <div id="end" style="position:absolute;inset:0;display:none"><svg id="ig" width="150" height="150" viewBox="0 0 24 24" style="position:absolute;left:465px;top:480px"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><g fill="none" stroke-width="2" id="igg"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.5"/></g></svg>
 <div style="position:absolute;width:100%;top:640px;text-align:center;color:#fff;font-size:34px;font-weight:700;letter-spacing:3px">@CARDMARKET.PRO</div></div>
</div>
<div style="display:none" id="pre"></div>
<script>
const $=id=>document.getElementById(id);const C=x=>Math.min(Math.max(x,0),1);const E=x=>1-Math.pow(1-C(x),3);
const COL={mint:'#5ee0d2',pet:'#0e3a3a',grey:'#8a9399',dark:'#0b0f14',slate:'#6f8a99',light:'#e8eef0'};
const PH=['st/c1_1.jpg','st/c1_2.jpg','st/c1_3.jpg','st/c2_1.jpg','st/c2_2.jpg','st/c2_3.jpg','st/c3_1.jpg','st/c3_2.jpg','st/c3_3.jpg','st/c4_1.jpg','st/c4_2.jpg','st/c4_3.jpg','st/c5_1.jpg','st/c5_2.jpg','st/c5_3.jpg','st/c6_1.jpg','st/c6_2.jpg','st/c6_3.jpg','st/c7_1.jpg','st/c7_2.jpg','st/c7_3.jpg','st/c8_1.jpg','st/c8_2.jpg','st/c8_3.jpg','st/c9_1.jpg','st/c9_2.jpg','st/c9_3.jpg'];
$('pre').innerHTML=PH.map(s=>`<img src="${s}">`).join('');
// panel lines
let P='';for(let i=0;i<14;i++)P+=`<line x1="${i*80}" y1="0" x2="${i*80+500}" y2="1920" stroke-opacity=".18"/>`;$('pg').innerHTML=P;
// construction drawing around logo (center 540,800)
let G=`<path d="M430 690 L650 650 L630 930 L420 960 Z"/><circle cx="540" cy="805" r="230"/><circle cx="540" cy="805" r="150"/>`;
G+=`<line x1="540" y1="420" x2="540" y2="1500"/><line x1="200" y1="805" x2="880" y2="805"/><path d="M540 1040 L540 1180 L760 1180 L900 1500"/><path d="M540 1180 L320 1180 L180 1500"/><path d="M200 400 Q520 380 540 560"/>`;
$('cg').innerHTML=G;[...$('cg').children].forEach(e=>{const l=e.getTotalLength();e.style.strokeDasharray=l;e.dataset.l=l});
$('cn').innerHTML=[[540,1180],[760,1180],[320,1180],[540,1040],[200,400]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="11"/>`).join('');
// UI rows
const W=[['Buy Cards','Buy Now','Sell Now'],['Track Price','Track Index','Trade Now'],['Collect','Collect More','Get Started'],['See Prices','See Details','Scan Card'],['Trade Now','Track Now','Join Now']];
const ST=[0,1,0,2,1,2,0,1,2,0];let R='';for(let r=0;r<10;r++)for(let k=0;k<4;k++)R+=`<div class="pill" data-r="${r}" data-k="${k}" style="top:${r*185}px;left:${k*560-200+(r%2)*160}px"></div>`;$('rows').innerHTML=R;
function scr(a,b,q){const n=Math.round(q*Math.max(a.length,b.length));return b.slice(0,n)+a.slice(n)}
// SHOTS
const S=[];const add=(t,type,o)=>S.push(Object.assign({t,type},o));
// intro: construction on petrol w/ panel flicker
add(0,'cons',{bg:COL.pet,ln:COL.mint});add(0.5,'panel',{bg:COL.grey,ln:'#fff'});add(0.6,'cons',{bg:COL.pet,ln:COL.mint,t0:0});add(1.2,'panel',{bg:COL.mint,ln:COL.dark});add(1.3,'cons',{bg:COL.dark,ln:COL.mint,t0:0});
// rapid montage from drop
const ord=[3,7,10,13,16,1,22,25,5,14,19,8,23,2,17,11,26,4];const gfx=[['panel',{bg:COL.mint,ln:COL.dark}],['ui',{sch:0}],['cons',{bg:COL.slate,ln:COL.mint}],['panel',{bg:COL.pet,ln:COL.mint}],['ui',{sch:1}],['cons',{bg:COL.grey,ln:'#fff'}]];
const seq=[];ord.forEach((o,i)=>{seq.push(['photo',{src:o}]);if(i%3==2)seq.push(gfx[(i/3|0)%gfx.length])});
let t=1.92,k=0,d=0.1;while(t<4.4){const it=seq[Math.floor(k/2)%seq.length];add(t,it[0],Object.assign({inv:k%2==1},it[1]));k++;t+=d;if(t>3.2)d=Math.min(0.3,d+0.03)}
// UI scramble
add(4.4,'ui',{sch:0,slow:1});add(5.1,'ui',{sch:1,slow:1});
// construction diagram
add(5.71,'cons',{bg:COL.slate,ln:COL.mint,t0:5.71});add(6.32,'cons',{bg:COL.grey,ln:'#fff',t0:5.71,inv:false});
// hero person
add(7.13,'photo',{src:11,hero:1});add(7.92,'photo',{src:11,hero:1,inv:true});
add(9.0,'photo',{src:11,hero:1,end:1});
function seek(t){
 let s=S[0];for(const x of S)if(t>=x.t)s=x;const lt=t-s.t;
 ['Lpanel','Lcons','Lui','Lphoto'].forEach(id=>$(id).style.display='none');
 const L=$({panel:'Lpanel',cons:'Lcons',ui:'Lui',photo:'Lphoto'}[s.type]);L.style.display='block';
 if(s.type=='panel'){L.style.background=s.bg;$('pg').setAttribute('stroke',s.ln);$('pl1').style.color=$('pl2').style.color=s.ln;}
 if(s.type=='cons'){L.style.background=s.bg;$('cg').setAttribute('stroke',s.ln);$('cn').setAttribute('fill',s.ln);['cl1','cl2','cl3','cl4'].forEach(i=>$(i).style.color=s.ln);
  const ct=t-(s.t0!==undefined?s.t0:-5);[...$('cg').children].forEach((e,i)=>e.style.strokeDashoffset=e.dataset.l*(1-E(ct/1.1-i*0.05)));$('cn').style.opacity=E((ct-0.4)/0.3);}
 if(s.type=='ui'){const sc=s.sch;L.style.background=sc?COL.light:COL.pet;
  document.querySelectorAll('.pill').forEach(p=>{const r=+p.dataset.r,kk=+p.dataset.k;const sty=(ST[r]+kk)%3;
   const fg=sc?(sty==0?COL.dark:sty==1?COL.light:'transparent'):(sty==0?COL.mint:sty==1?'transparent':COL.slate);
   p.style.background=fg;p.style.border=`4px solid ${sc?COL.dark:COL.mint}`;p.style.color=(sty==0)?(sc?'#fff':COL.dark):(sc?COL.dark:COL.mint);
   const ph=(t*6+r*0.7+kk*0.3);const w=W[r%5];const i0=Math.floor(ph)%3;p.textContent=scr(w[i0],w[(i0+1)%3],C((ph%1)*2-0.6))+'  ▸';});
  $('rows').style.transform=`translateX(${-(t-1.9)*(s.slow?260:500)}px)`;}
 if(s.type=='photo'){const src=PH[s.src];if($('ph').getAttribute('src')!==src)$('ph').setAttribute('src',src);$('ph').style.objectPosition=s.pos||'50% 50%';
  $('ph').style.transform=`scale(${s.hero?1.05+lt*0.02:1.1-lt*0.3})`;
  $('ph').style.filter=s.end?`grayscale(1) brightness(${0.45-0.05*C(lt)})`:'none';}
 const inv=!!s.inv;$('stage').style.filter=inv?'invert(1) grayscale(1)':'none';
 $('FL').style.filter=(inv||(s.bg==COL.mint))?'grayscale(1) brightness(0)':'none';$('WM').style.filter=inv?'brightness(0)':'none';$('tag').style.color=inv?'#000':'#fff';$('tgi').setAttribute('stroke',inv?'#000':'#fff');
 // logo build-in at fixed spot
 $('FL').style.opacity=E((t-1.0)/0.5);$('FL').style.transform=t<1.92?`scale(${0.7+0.3*E((t-1.0)/0.9)})`:'none';$('WM').style.opacity=E((t-1.6)/0.3);
 $('tag').style.display='none';
 // end: IG icon replaces nothing, sits above logo
 const pe=t-9.0;$('end').style.display='none';$('ig').style.opacity=E(pe/0.3);
 $('igg').setAttribute('stroke',(Math.floor(pe*2.5)%3==1)?'url(#g)':'#fff');
}
seek(0);
</script></body></html>
