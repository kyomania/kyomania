<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#e9eeee;font-family:Inter}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#word{position:absolute;left:0;right:0;top:1380px;text-align:center;font-weight:900;font-size:230px;letter-spacing:-8px;color:#0b0f14;white-space:nowrap}
#word span{display:inline-block}
#lbl{position:absolute;left:0;right:0;top:1330px;text-align:center;font-weight:700;font-size:28px;letter-spacing:10px;color:#0e6e66}
#bar{position:absolute;left:390px;width:300px;height:6px;top:1650px;background:#5ee0d2;border-radius:3px;transform-origin:50% 50%}
#fl{position:absolute;inset:0;background:#fff;opacity:0}
#end{position:absolute;inset:0;background:#eef2f2;opacity:0}#lg{position:absolute;width:880px;left:100px;top:880px;opacity:0}
</style></head><body>
<img id="v"><div id="lbl"></div><div id="word"></div><div id="bar"></div><div id="fl"></div><div id="end"></div><img id="lg" src="logo_original.png">
<script>
const $=id=>document.getElementById(id);const C=x=>Math.min(Math.max(x,0),1);const E=x=>1-Math.pow(1-C(x),3);const EB=x=>{x=C(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const CH=[{t0:0,t1:5.0,clip:'a',off:0,w:'TRADE',n:'01 / 03',wt:1.9},{t0:5.0,t1:8.4,clip:'c',off:1.6,w:'TRACK',n:'02 / 03',wt:5.65},{t0:8.4,t1:11.8,clip:'b',off:1.6,w:'COLLECT',n:'03 / 03',wt:8.75}];
function seek(t){
 const ch=CH.find(c=>t>=c.t0&&t<c.t1)||CH[2];
 const ct=ch.off+(Math.min(t,11.8)-ch.t0);const f=Math.min(121,Math.max(1,Math.floor(ct*30)+1));
 $('v').src=`cf/${ch.clip}/${String(f).padStart(4,'0')}.jpg`;
 // chapter zoom-out punch at start, push-in at end
 const st=t-ch.t0,en=ch.t1-t;$('v').style.transform=`scale(${1+0.12*(1-E(st/0.35))+0.1*Math.pow(C(1-en/0.25),2)})`;$('v').style.filter=`blur(${6*(1-E(st/0.25))+8*Math.pow(C(1-en/0.2),2)}px)`;
 // word
 const wl=t-ch.wt;const w=$('word');if(w.dataset.w!==ch.w){w.dataset.w=ch.w;w.innerHTML=[...ch.w].map(c=>`<span>${c}</span>`).join('');w.style.fontSize='230px';const sw=w.scrollWidth;const ww=[...w.children].reduce((a,s)=>a+s.getBoundingClientRect().width,0);if(ww>900)w.style.fontSize=(230*900/ww)+'px';}
 [...w.children].forEach((s,i)=>{const q=(wl-i*0.04)/0.35;s.style.opacity=C(q*3);s.style.transform=`translateY(${(1-EB(q))*120}px) scale(${0.9+0.1*EB(q)})`;s.style.filter=`blur(${(1-E(q))*10}px)`});
 const out=C((t-(ch.t1-0.2))/0.2);w.style.opacity=1-out;w.style.transform=`scale(${1+out*0.15})`;
 $('lbl').textContent=ch.n;$('lbl').style.opacity=E((wl-0.2)/0.3)*(1-out);$('bar').style.transform=`scaleX(${E((wl-0.25)/0.5)})`;$('bar').style.opacity=1-out;
 let fo=0;[5.0,8.4,11.8].forEach(h=>{const q=t-h;if(q>=-0.06&&q<0.15)fo=Math.max(fo,q<0?1+q/0.06:0.9*(1-q/0.15))});$('fl').style.opacity=fo;
 const e=t-11.8;$('end').style.opacity=e>=0?1:0;$('lg').style.opacity=E((e-0.1)/0.45);$('lg').style.transform=`scale(${0.94+0.06*E((e-0.1)/1.0)})`;
}
seek(0);
</script></body></html>
