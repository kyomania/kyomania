<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#e9eeee;font-family:Inter}
#wrap{position:absolute;inset:0}#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wd{position:absolute;left:0;right:0;top:1330px;text-align:center;font-weight:900;letter-spacing:-10px;white-space:nowrap;line-height:1}
#w{color:#0e6e66;font-weight:600;letter-spacing:-4px}#wr,#wb{mix-blend-mode:multiply}#wr{color:#ff2bd6}#wb{color:#2bfff1}
#we{color:transparent;-webkit-text-stroke:3px #0b0f14}
#lbl{position:absolute;left:0;right:0;top:1270px;text-align:center;font-weight:700;font-size:26px;letter-spacing:12px;color:#0e6e66}
#fl{position:absolute;inset:0;background:#fff;opacity:0}#end{position:absolute;inset:0;background:#eef2f2;opacity:0}#lg{position:absolute;width:880px;left:100px;top:880px;opacity:0}
</style></head><body>
<div id="wrap"><img id="v"><img id="v2" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0"></div><div id="lbl"></div><div class="wd" id="we"></div><div class="wd" id="wr"></div><div class="wd" id="wb"></div><div class="wd" id="w"></div><img id="tl" src="logo_original.png" style="position:absolute;width:460px;left:310px;top:150px;opacity:0"><div id="fl"></div><div id="end"></div><img id="lg" src="logo_original.png">
<script>
const $=id=>document.getElementById(id);const C=x=>Math.min(Math.max(x,0),1);const E=x=>1-Math.pow(1-C(x),3);
// piecewise map: [vt0, vt1, clip, ct0, ct1]
const SEG=[
 [0.00,0.10,'a',0.0,0.033],[0.10,0.20,'a',0.033,0.066],[0.20,0.30,'a',0.066,0.1],[0.30,0.40,'a',0.1,0.133],[0.40,0.50,'a',0.133,0.166],[0.50,0.60,'a',0.166,0.2],
 [0.60,1.92,'a',0.2,1.8],[1.92,2.60,'a',1.8,2.14],[2.60,3.40,'a',2.14,3.8],[3.40,4.00,'a',3.8,1.3],
 [4.00,4.32,'c',1.55,2.2],[4.32,4.90,'c',2.2,2.48],[4.90,5.60,'c',2.48,3.9],[5.60,6.30,'c',3.9,1.3],
 [6.30,7.13,'b',1.0,1.9],[7.13,7.60,'b',1.9,2.14],[7.60,8.50,'b',2.14,3.9],[8.50,9.30,'b',3.9,0.9]];
const INV=new Set();
const W=[[1.92,3.4,'TRADE','01 / 03'],[4.32,5.6,'TRACK','02 / 03'],[7.13,8.5,'COLLECT','03 / 03']];
const PUNCH=[];
const WHIP=[];const XF=[[4.0,10],[6.3,14]];
function fr(si,t){const s=SEG[si];const ct=s[3]+(s[4]-s[3])*C((t-s[0])/(s[1]-s[0]));const f=Math.min(121,Math.max(1,Math.floor(ct*30)+1));return `cf/${s[2]}/${String(f).padStart(4,'0')}.jpg`}
function seek(t){
 let si=SEG.findIndex(s=>t>=s[0]&&t<s[1]);
 if(si>=0){const s=SEG[si];const ct=s[3]+(s[4]-s[3])*C((t-s[0])/(s[1]-s[0]));const f=Math.min(121,Math.max(1,Math.floor(ct*30)+1));$('v').src=`cf/${s[2]}/${String(f).padStart(4,'0')}.jpg`;
  $('v').style.filter=INV.has(si)?'invert(1) grayscale(1) contrast(1.3)':'none';}
 // punch zoom + shake
 let pz=0,sh=0;PUNCH.forEach(p=>{const q=t-p;if(q>=0&&q<0.35){pz=Math.max(pz,1-E(q/0.35));if(q<0.25)sh=Math.max(sh,1-q/0.25)}});
 let wx=0,wb=0;WHIP.forEach(p=>{const q=t-p;if(q>-0.12&&q<0){const k=(q+0.12)/0.12;wx=-k*k*700;wb=k*30}if(q>=0&&q<0.12){const k=1-q/0.12;wx=k*k*700;wb=k*30}});
 const sx=0,sy=0;
 $('wrap').style.transform=`translate(${sx+wx}px,${sy}px) scale(${1+0.16*pz})`;$('wrap').style.filter=`blur(${wb}px)`;
 // words
 const wd=W.find(w=>t>=w[0]-0.01&&t<w[1]);['w','wr','wb','we'].forEach(id=>$(id).style.opacity=0);$('lbl').style.opacity=0;
 if(wd){const q=t-wd[0];const fs=wd[2].length>5?185:210;const lw=wd[2].toLowerCase();$('w').innerHTML=lw+'<span style="color:#5ee0d2">.</span>';$('w').style.fontSize=fs+'px';
  const k=E(q/0.45);const sc=1.12-0.12*k+0.02*Math.max(0,q-0.45);const out=C((t-(wd[1]-0.15))/0.15);
  $('w').style.opacity=E(q/0.3)*(1-out);$('w').style.transform=`translate(${wx}px,${(1-k)*40-out*20}px) scale(${sc})`;$('w').style.filter=`blur(${(1-k)*8+out*6}px)`;
  const g=Math.max(0,1-q/0.3);$('wr').style.opacity=$('wb').style.opacity=0;$('wr').style.transform=`translate(${-26*g+wx}px,0) scale(${sc})`;$('wb').style.transform=`translate(${26*g+wx}px,0) scale(${sc})`;
  const eq=C(q/0.6);$('we').style.opacity=0;$('we').style.transform=`scale(${1+eq*0.9})`;
  $('lbl').textContent=wd[3];$('lbl').style.opacity=E((q-0.15)/0.2)*(1-out);}
 let fo=0;[].forEach(h=>{const q=t-h;if(q>=0&&q<0.12)fo=Math.max(fo,0.85*(1-q/0.12))});$('fl').style.opacity=fo;
 $('v2').style.opacity=0;XF.forEach(([T,nsi])=>{const q=(t-(T-0.3))/0.6;if(q>0&&q<1){// prev chapter held on its last frame underneath, new chapter fades in
  const prev=nsi-1;$('v').src=fr(prev,Math.min(t,SEG[prev][1]-0.001));$('v2').src=fr(nsi,Math.max(t,SEG[nsi][0]));$('v2').style.opacity=q*q*(3-2*q);}});
 $('tl').style.opacity=E((t-0.6)/0.4)*(1-E((t-9.1)/0.4));const e=t-9.1;$('end').style.opacity=E(e/0.5);$('lg').style.opacity=E((e-0.25)/0.5);$('lg').style.transform=`scale(${0.95+0.05*E((e-0.25)/1.2)})`;
}
seek(0);
</script></body></html>
