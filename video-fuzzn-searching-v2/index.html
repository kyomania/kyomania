<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FUZZN – Searching for a game v2</title>
<style>
  @font-face { font-family: "Anton"; src: url("node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2"); }
  @font-face { font-family: "InterB"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf"); }
  @font-face { font-family: "InterM"; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Medium.otf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
// FUZZN — "SEARCHING FOR A GAME"  ·  12 s seamless loop, deterministic render(t)
// Everything is periodic in T (or a divisor of T), so frame T == frame 0.
// =====================================================================
const W = 1920, H = 1080, T = 12, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// palette (sampled from the rooftop sunset)
const C = {
  night: '#140b22', plum: '#3a1c4c', violet: '#6b3a73', ember: '#ff7a3d',
  gold: '#ffc07a', red: '#d0212f', cream: '#fff1e4', ink: '#07050a'
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const ss = k => k * k * (3 - 2 * k);
const ph = (t, p) => ((t % p) + p) % p / p;      // phase 0..1 with period p
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const loadImg = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

let CHAR, CHAR_GLOW, TITLE, TITLE_MASK, GRAIN = [];
// character placement
const CS = 1.27;                                  // scale
let CW, CH, CX, CY;                               // drawn size / top-left
const SUN = { x: 700, y: 455, r: 380 };

// beat: a soft "punch" every 3 s
function beat(t) { const p = ph(t, 3); return Math.exp(-p * 9); }

// ------------------------------------------------ background
function background(t) {
  const b = beat(t);
  const breathe = .5 + .5 * Math.sin(TAU * t / T);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.night); g.addColorStop(.55, C.plum); g.addColorStop(1, '#5a2238');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // ember glow behind the character
  const r = ctx.createRadialGradient(SUN.x, SUN.y + 120, 0, SUN.x, SUN.y + 120, 1100);
  r.addColorStop(0, `rgba(255,122,61,${.55 + .15 * breathe + .15 * b})`);
  r.addColorStop(.45, 'rgba(160,50,80,.25)');
  r.addColorStop(1, 'rgba(20,11,34,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}

// huge outlined marquee type, alternating directions, seamless over T
const MQ = 'SEARCHING FOR A GAME  ✦  ';
let MQ_W = 0;
function marquee(t) {
  const b = beat(t);
  ctx.save();
  ctx.font = '250px Anton';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 2;
  const rows = 5;
  for (let i = 0; i < rows; i++) {
    const y = -40 + i * 290;
    const dir = i % 2 ? 1 : -1;
    const off = (ph(t, T) * MQ_W) * dir;
    ctx.strokeStyle = `rgba(255,220,200,${(i === 2 ? .16 : .09) + .07 * b})`;
    for (let k = -2; k <= 2; k++) {
      const x = off + k * MQ_W + (i % 2 ? -MQ_W * .37 : 0);
      if (x > W || x + MQ_W < 0) continue;
      ctx.strokeText(MQ, x, y);
    }
  }
  ctx.restore();
}

// retro striped sun disk
function sun(t) {
  const b = beat(t);
  const r = SUN.r * (1 + .02 * b);
  ctx.save();
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, r, 0, TAU); ctx.clip();
  const g = ctx.createLinearGradient(0, SUN.y - r, 0, SUN.y + r);
  g.addColorStop(0, C.gold); g.addColorStop(.5, C.ember); g.addColorStop(1, C.red);
  ctx.fillStyle = g; ctx.fillRect(SUN.x - r, SUN.y - r, 2 * r, 2 * r);
  // stripes sliding down (period 3s), thicker toward the bottom
  ctx.globalCompositeOperation = 'destination-out';
  const p = ph(t, 3);
  for (let i = -1; i < 12; i++) {
    const v = (i + p) / 11;                         // 0..1 from middle to bottom
    if (v < 0) continue;
    const y = SUN.y + v * r;
    const th = 2 + v * v * 34;
    ctx.fillRect(SUN.x - r, y, 2 * r, th);
  }
  ctx.restore();
  // soft halo
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const h = ctx.createRadialGradient(SUN.x, SUN.y, r * .9, SUN.x, SUN.y, r * 1.5);
  h.addColorStop(0, `rgba(255,150,80,${.35 + .25 * b})`); h.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = h; ctx.beginPath(); ctx.arc(SUN.x, SUN.y, r * 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}

// "searching" radar: expanding rings from the crow + rotating sweep around the sun
function radar(t) {
  const o = { x: CX + 520 * CS, y: CY + 210 * CS };     // crow
  ctx.save();
  for (let i = 0; i < 3; i++) {
    const p = ph(t + i, 3);
    const r = 30 + eo(p) * 900;
    ctx.strokeStyle = `rgba(255,236,220,${.45 * Math.pow(1 - p, 2)})`;
    ctx.lineWidth = 2.5 * (1 - p) + .5;
    ctx.beginPath(); ctx.arc(o.x, o.y, r, 0, TAU); ctx.stroke();
  }
  // sweep arc
  const a = ph(t, 6) * TAU - Math.PI / 2;
  const R = SUN.r + 70;
  for (let k = 0; k < 40; k++) {
    const aa = a - k * .018;
    ctx.strokeStyle = `rgba(255,236,220,${.6 * (1 - k / 40)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, R, aa - .02, aa); ctx.stroke();
  }
  // tick ring
  ctx.strokeStyle = 'rgba(255,236,220,.22)'; ctx.lineWidth = 2;
  for (let k = 0; k < 120; k++) {
    const aa = k / 120 * TAU + ph(t, T) * TAU / 12;
    const l = k % 10 ? 8 : 22;
    ctx.beginPath();
    ctx.moveTo(SUN.x + Math.cos(aa) * (R + 18), SUN.y + Math.sin(aa) * (R + 18));
    ctx.lineTo(SUN.x + Math.cos(aa) * (R + 18 + l), SUN.y + Math.sin(aa) * (R + 18 + l));
    ctx.stroke();
  }
  ctx.restore();
}

// rising embers
let EMB = [];
function embers(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of EMB) {
    const p = ph(t + e.o, e.per);
    const x = e.x + Math.sin(TAU * p * e.w + e.s) * e.a;
    const y = H + 40 - p * (H + 120);
    ctx.globalAlpha = Math.sin(Math.PI * p) * e.al;
    ctx.fillStyle = e.c;
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ------------------------------------------------ character
function character(t) {
  const b = beat(t);
  const breathe = Math.sin(TAU * t / 4);           // period 4 → divides 12
  const sx = 1 + .004 * breathe + .006 * b, sy = 1 + .007 * breathe + .006 * b;
  const px = Math.sin(TAU * t / T) * 8, py = Math.cos(TAU * t / T) * 5;
  ctx.save();
  ctx.translate(CX + CW / 2 + px, CY + CH + py);
  ctx.scale(sx, sy);
  ctx.translate(-CW / 2, -CH);
  // rim glow (ember) behind
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = .75 + .25 * b;
  ctx.drawImage(CHAR_GLOW, -60, -60, CW + 120, CH + 120);
  ctx.restore();
  // glitch: chromatic split on beats 6s
  const gk = glitchAmt(t);
  if (gk > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .55 * gk;
    ctx.filter = 'drop-shadow(0 0 0 #ff2040)';
    ctx.drawImage(CHAR_RED, -14 * gk, 0, CW, CH);
    ctx.drawImage(CHAR_CYAN, 14 * gk, 0, CW, CH);
    ctx.filter = 'none';
    ctx.restore();
  }
  ctx.drawImage(CHAR, 0, 0, CW, CH);
  // crow eye glint
  const ep = ph(t, 6);
  const eg = Math.exp(-Math.pow((ep - .15) / .05, 2));
  if (eg > .01) {
    const ex = 498 * CS, ey = 186 * CS;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 60);
    g.addColorStop(0, `rgba(255,40,40,${.95 * eg})`); g.addColorStop(.15, `rgba(255,30,30,${.5 * eg})`); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(ex - 60, ey - 60, 120, 120);
    ctx.fillStyle = `rgba(255,120,110,${eg})`;
    ctx.fillRect(ex - 40 * eg, ey - 1, 80 * eg, 2);
    ctx.restore();
  }
  ctx.restore();
  // floor fade (hides the flat sitting edge)
  const f = ctx.createLinearGradient(0, H - 340, 0, H);
  f.addColorStop(0, 'rgba(10,5,16,0)'); f.addColorStop(.55, 'rgba(10,5,16,.8)'); f.addColorStop(1, 'rgba(10,5,16,1)');
  ctx.fillStyle = f; ctx.fillRect(0, H - 340, W, 340);
}
let CHAR_RED, CHAR_CYAN;

// ------------------------------------------------ hero title
const TX = 985;               // left edge of title block
const L1Y = 470, L2Y = 640;    // baselines
function glitchAmt(t) {
  // two short glitches per loop
  const g = (a) => { const k = prog(t, a, a + .32); return k > 0 && k < 1 ? Math.sin(Math.PI * k) : 0; };
  return Math.max(g(5.55), g(11.55));
}

function buildTitle(t) {
  const x = TITLE.getContext('2d');
  x.clearRect(0, 0, W, H);
  x.textBaseline = 'alphabetic';
  // line 1 — SEARCHING, letters wave in sequence
  x.font = '178px Anton';
  let cx = TX;
  const word1 = 'SEARCHING';
  for (let i = 0; i < word1.length; i++) {
    const ch = word1[i];
    const p = ph(t - i * .09, 3);
    const lift = Math.exp(-Math.pow((p - .12) / .06, 2)) * 22;
    x.fillStyle = C.cream;
    x.fillText(ch, cx, L1Y - lift);
    cx += x.measureText(ch).width + 6;
  }
  // line 2 — FOR A GAME, ember gradient that flows
  const sh = ph(t, 6) * 800;
  const g = x.createLinearGradient(TX - 800 + sh, 0, TX + 800 + sh, 0);
  g.addColorStop(0, C.gold); g.addColorStop(.25, C.ember); g.addColorStop(.5, C.red); g.addColorStop(.75, C.ember); g.addColorStop(1, C.gold);
  x.fillStyle = g;
  x.font = '178px Anton';
  x.letterSpacing = '6px';
  x.fillText('FOR A GAME', TX, L2Y);
  x.letterSpacing = '0px';
  // light sweep across both lines (every 4 s)
  const sp = ph(t, 4);
  const sx = lerp(TX - 400, TX + 1300, eo(clamp(sp / .45)));
  x.save();
  x.globalCompositeOperation = 'source-atop';
  const s = x.createLinearGradient(sx - 140, 0, sx + 140, 0);
  s.addColorStop(0, 'rgba(255,255,255,0)'); s.addColorStop(.5, 'rgba(255,255,255,.85)'); s.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = s; x.fillRect(0, 0, W, H);
  x.restore();
}

function title(t) {
  buildTitle(t);
  const b = beat(t);
  const gk = glitchAmt(t);
  // shadow block (offset ink), gives a printed poster depth
  ctx.save();
  ctx.globalAlpha = .55;
  ctx.filter = 'brightness(0)';
  ctx.drawImage(TITLE, 10, 10);
  ctx.filter = 'none';
  ctx.restore();
  // glow
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .35 + .3 * b;
  ctx.filter = 'blur(18px)'; ctx.drawImage(TITLE, 0, 0); ctx.filter = 'none';
  ctx.restore();
  if (gk > 0) {
    // RGB split + horizontal slices
    const R = rng(Math.floor(t * 30));
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = .8 * gk;
    ctx.filter = 'drop-shadow(0 0 0 #ff0030) brightness(.6) sepia(1) saturate(8) hue-rotate(-50deg)';
    ctx.drawImage(TITLE, -18 * gk, 0);
    ctx.filter = 'brightness(.6) sepia(1) saturate(8) hue-rotate(140deg)';
    ctx.drawImage(TITLE, 18 * gk, 0);
    ctx.filter = 'none';
    ctx.restore();
    for (let y = 250; y < 720; y += 14 + Math.floor(R() * 30)) {
      const hgt = 6 + R() * 26, dx = (R() - .5) * 120 * gk;
      ctx.drawImage(TITLE, 0, y, W, hgt, dx, y, W, hgt);
    }
  } else {
    ctx.drawImage(TITLE, 0, 0);
  }

  // ---- UI around the title ----
  ctx.save();
  // red accent bar
  const barH = 380 * (.96 + .04 * b);
  ctx.fillStyle = C.red; ctx.fillRect(TX - 46, L1Y - 180, 10, barH);
  // kicker above
  ctx.font = '26px InterB'; ctx.letterSpacing = '9px';
  ctx.fillStyle = C.cream; ctx.globalAlpha = .9;
  ctx.fillText('MATCHMAKING', TX + 4, L1Y - 205);
  const kw = ctx.measureText('MATCHMAKING').width;
  ctx.font = '30px IPAPGothic'; ctx.letterSpacing = '6px';
  ctx.fillStyle = C.ember;
  ctx.fillText('マッチング中', TX + kw + 40, L1Y - 205);
  const jw = ctx.measureText('マッチング中').width;
  const DX = TX + kw + 40 + jw + 34;
  // live dot
  const dp = .5 + .5 * Math.sin(TAU * t / 1.5);
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(208,33,47,${.4 + .6 * dp})`;
  ctx.beginPath(); ctx.arc(DX, L1Y - 214, 8, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(208,33,47,${.6 * (1 - ph(t, 1.5))})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(DX, L1Y - 214, 8 + 18 * ph(t, 1.5), 0, TAU); ctx.stroke();

  // indeterminate loader
  const ly = L2Y + 70, lw = 800;
  ctx.fillStyle = 'rgba(255,241,228,.15)'; ctx.fillRect(TX + 4, ly, lw, 4);
  for (let k = 0; k < 2; k++) {
    const p = ph(t + k * 1, 2);
    const a = clamp(eo(p) * 1.25 - .25) * lw, z = clamp(eo(p) * 1.1) * lw;
    const g = ctx.createLinearGradient(TX + a, 0, TX + z, 0);
    g.addColorStop(0, 'rgba(255,122,61,0)'); g.addColorStop(1, C.gold);
    ctx.fillStyle = g; ctx.fillRect(TX + 4 + a, ly - 1, Math.max(0, z - a), 6);
  }
  // pulsing dots
  for (let k = 0; k < 3; k++) {
    const p = ph(t - k * .2, 1.5);
    const s = 1 + 1.2 * Math.exp(-Math.pow((p - .15) / .1, 2));
    ctx.fillStyle = C.cream; ctx.globalAlpha = .45 + .55 * (s - 1) / 1.2;
    ctx.beginPath(); ctx.arc(TX + lw - 50 + k * 24, ly + 48, 5 * s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = .55;
  ctx.font = '22px InterM'; ctx.letterSpacing = '7px'; ctx.fillStyle = C.cream;
  ctx.fillText('FUZZN', TX + 4, ly + 56);
  ctx.restore();
}

// ------------------------------------------------ post
function post(t) {
  const b = beat(t);
  // light leak from the right
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const l = ctx.createRadialGradient(W * 1.02, H * .3, 0, W * 1.02, H * .3, W * .55);
  l.addColorStop(0, `rgba(255,130,70,${.22 + .1 * Math.sin(TAU * t / T)})`); l.addColorStop(1, 'rgba(255,130,70,0)');
  ctx.fillStyle = l; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.1);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(5,0,12,.7)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // scanlines (very subtle)
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  // grain
  ctx.save(); ctx.globalAlpha = .05; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(GRAIN[Math.floor(t * 12) % GRAIN.length], 0, 0, W, H);
  ctx.restore();
  // beat flash
  if (b > .05) { ctx.fillStyle = `rgba(255,200,160,${.05 * b})`; ctx.fillRect(0, 0, W, H); }
}

// ------------------------------------------------ main
function render(t) {
  t = ((t % T) + T) % T;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  // camera punch on beats
  const b = beat(t);
  const z = 1 + .008 * b;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  background(t);
  marquee(t);
  sun(t);
  radar(t);
  embers(t);
  character(t);
  title(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  post(t);
}

function tint(img, color, w, h) {
  const c = mk(w, h), x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, w, h);
  return c;
}

window.ready = (async () => {
  CHAR = await loadImg('assets/character.png');
  await Promise.all(['200px Anton', '250px Anton', '26px InterB', '22px InterM', '30px IPAPGothic'].map(f => document.fonts.load(f, 'SEARCHINGマッチング中')));
  CW = CHAR.width * CS; CH = CHAR.height * CS;
  CX = 120; CY = H + 40 - CH;
  // glow: blurred ember silhouette
  const g = mk(Math.ceil(CW + 120), Math.ceil(CH + 120)), gx = g.getContext('2d');
  gx.filter = 'blur(22px)';
  gx.drawImage(tint(CHAR, '#ff7a3d', CW, CH), 60, 60);
  gx.filter = 'blur(6px)';
  gx.drawImage(tint(CHAR, '#ffb070', CW, CH), 60, 60);
  CHAR_GLOW = g;
  CHAR_RED = tint(CHAR, '#ff1e3c', CW, CH);
  CHAR_CYAN = tint(CHAR, '#20e0ff', CW, CH);
  TITLE = mk();
  ctx.font = '250px Anton'; MQ_W = ctx.measureText(MQ).width;
  const R = rng(4);
  for (let i = 0; i < 90; i++) EMB.push({ x: R() * W, per: [3, 4, 6, 12][Math.floor(R() * 4)], o: R() * 12, w: 1 + Math.floor(R() * 2), s: R() * TAU, a: 10 + R() * 40, r: .8 + R() * 2.4, al: .4 + R() * .6, c: R() < .7 ? '#ffb070' : '#ff5a3a' });
  for (let i = 0; i < 6; i++) {
    const c = mk(480, 270), x = c.getContext('2d'), id = x.createImageData(480, 270);
    for (let j = 0; j < id.data.length; j += 4) { const v = R() * 255; id.data[j] = id.data[j + 1] = id.data[j + 2] = v; id.data[j + 3] = 255; }
    x.putImageData(id, 0, 0); GRAIN.push(c);
  }
  window.render = render; window.T = T;
  return true;
})();

if (!navigator.webdriver) {
  window.ready.then(() => { const t0 = performance.now(); const loop = () => { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); });
}
</script>
</body>
</html>
