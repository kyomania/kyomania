      const ld = { v: 0 };
      tl.fromTo(ld, { v: 0 }, { v: 23, duration: 7.4, ease: "steps(23)", onUpdate: () => (stat.textContent = "LADE ... " + String(Math.round(ld.v)).padStart(2, "0") + "%") }, 0.5);
      tl.fromTo(bar, { scaleX: 0 }, { scaleX: 0.23, duration: 7.4, ease: "steps(12)" }, 0.5);

        tl.set(b, { innerHTML: '<div style="background:#f2efe6;border:1px solid #101827;padding:1px 2px;font-size:4px;color:#ef4040;font-family:PS2P">!!</div>' }, t0 - 0.3);
        tl.set(p, { scaleX: -1, transformOrigin: "50% 50%" }, t0);

        tl.to(hearts[4 - i], { opacity: 0, scale: 0, duration: 0.2, ease: "steps(3)" }, t0 + 0.1);
      });
      // the fast.site floppy flies in
      const fl = put(fx, 0, 0, sprite(S.floppy, pal({ g: "#3df07a", r: "#ef4040", y: "#ffd23f" }), 2));

      tl.fromTo(fl, { opacity: 1, x: 470, y: 30, rotation: 0 }, { x: 349, y: 82, rotation: 720, duration: 0.6, ease: "power2.in", immediateRender: false }, 7.32);

      tl.set(fl, { opacity: 0 }, 8.0);
      bigText(7.35, "POWER-UP!", 14, "#ffd23f", 0.55, 80);

      // ================= 7.98 DROP: instant + the PC overheats =================
      const D = 7.98;
      flash(D, 1, 0.3);
      tl.set(mask1, { scaleY: 0 }, D); tl.set(hour, { opacity: 0 }, D);
      tl.set(heroP, { opacity: 1 }, D); prods.forEach(([b, p]) => tl.set(p, { opacity: 1 }, D));
      tl.set(stat, { textContent: "✓ SOFORT GELADEN", color: "#1f8a3a" }, D); tl.set(bar, { scaleX: 1, backgroundColor: "#3d9b4a" }, D);
      tl.to("#temp", { scaleX: 1, backgroundColor: "#ef4040", duration: 0.3, ease: "steps(6)" }, D);

      tl.fromTo("#temp", { opacity: 1 }, { opacity: 0.5, duration: 0.15, yoyo: true, repeat: 30, ease: "steps(1)", immediateRender: false }, D + 0.3);
      bigText(D + 0.25, "SCHNELL!!", 30, "#f2efe6", 1.4, 96);
      score(D + 0.1, 10000, 0.6);
      shake(D, 1.4, 3); shake(9.4, 0.7, 1);
      tl.fromTo(led1, { backgroundColor: "#3d9b4a" }, { backgroundColor: "#3df07a", duration: 0.08, repeat: 120, yoyo: true, ease: "steps(1)" }, D);
      tl.fromTo(world, { x: -12, y: -7, scale: 1.05 }, { x: -6, y: -3, scale: 1.02, duration: 0.4, ease: "back.out(2)", immediateRender: false }, D);
      // smoke + sparks + flames
      const vents = [[344, 66], [356, 64], [368, 66], [378, 68]], mon = [[164, 40], [314, 44], [166, 96], [312, 100], [214, 22], [262, 22]];
      for (let i = 0; i < 60; i++) { const t = D + 0.05 + i * 0.07; const [x, y] = vents[i % 4]; puff(t, x + R(-3, 3), y, R(0.8, 1.3), R(1.3, 1.9)); }
      for (let i = 0; i < 40; i++) { const t = D + 0.2 + i * 0.1; const [x, y] = mon[i % 6]; puff(t, x + R(-3, 3), y + R(-4, 4), R(0.6, 1.0), R(1.2, 1.7)); }
      for (let i = 0; i < 10; i++) spark(D + i * 0.18, 340 + R(0, 44), 70);
      const flames = [[346, 58], [362, 56], [376, 58]].map(([x, y]) => put(fx, x, y, sprite(S.flame, pal(), 2)));
      flames.forEach((f, i) => { tl.set(f, { opacity: 0 }, 0); tl.set(f, { opacity: 1 }, D + 0.25 + i * 0.08); tl.fromTo(f, { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 0.7, duration: 0.08, repeat: 22, yoyo: true, ease: "steps(1)", immediateRender: false }, D + 0.3); tl.set(f, { opacity: 0 }, 10.0); });

      // ================= into the CRT: feature levels =================

      for (let i = 0; i < 70; i++) { const t = 10.3 + i * 0.2; const side = i % 2 ? [164, 60 + (i % 5) * 18] : [314, 60 + (i % 5) * 18]; puff(t, side[0] + R(-2, 2), side[1], R(0.5, 0.8), 1.4); }
      // L2

      tl.fromTo(xmark, { opacity: 1, scale: 2 }, { scale: 1, duration: 0.2, ease: "steps(4)", immediateRender: false }, V + 9.8);

      tl.fromTo(gate, { opacity: 1, y: 30 }, { y: 0, duration: 0.4, ease: "steps(8)", immediateRender: false }, 11.0);
      tl.fromTo(bleibt, { opacity: 1, scale: 2 }, { scale: 1, duration: 0.25, ease: "steps(5)", immediateRender: false }, V + 11.0);
      score(V + 11.0, 15000, 0.4);
      // L3
      crt(12.75, "#L3");
      flags.forEach((f, i) => { tl.set(f, { opacity: 0 }, 0); tl.fromTo(f, { opacity: 1, y: 8 }, { y: 0, duration: 0.25, ease: "steps(4)", immediateRender: false }, 13.2 + i * 0.12); });
      tl.set(warp, { opacity: 0 }, 0);
      tl.to(longPath, { backgroundColor: "#555577", duration: 0.1, stagger: 0.02 }, V + 13.3);
      tl.to(hero3, { opacity: 0, scale: 0.2, duration: 0.15, ease: "steps(3)" }, V + 13.2);

      tl.fromTo(warp, { opacity: 1, scale: 1.8 }, { scale: 1, duration: 0.2, ease: "steps(4)", immediateRender: false }, V + 13.4);
      spark(V + 13.4, 172 + 40, 36 + 64);

      // L4

      tl.fromTo([picIn, lblIn], { x: -40 }, { x: 0, duration: 0.5, ease: "steps(10)" }, 16.05);

      tl.set([picIn, lblIn], { opacity: 0 }, SQ);
      tl.fromTo(piston, { y: 0 }, { y: 6, duration: 0.08, repeat: 7, yoyo: true, ease: "steps(1)", immediateRender: false }, SQ);
      tl.fromTo(mach, { x: 0 }, { x: 1, duration: 0.05, repeat: 9, yoyo: true, ease: "steps(1)", immediateRender: false }, SQ);
      tl.fromTo(lamp, { backgroundColor: "#3df07a" }, { backgroundColor: "#ef4040", duration: 0.08, repeat: 7, yoyo: true, ease: "steps(1)", immediateRender: false }, SQ);
      tl.fromTo(picOut, { opacity: 1, x: -16 }, { x: 0, duration: 0.3, ease: "steps(6)", immediateRender: false }, SQ + 0.6);
      tl.set(lblOut, { opacity: 1 }, SQ + 0.8);
      tl.fromTo(dmg, { opacity: 1, y: 8 }, { y: -6, duration: 0.8, ease: "steps(8)", immediateRender: false }, V + 16.6);
      score(V + 16.7, 25000, 0.4);
      // L5
      crt(18.85, "#L5");
      tl.set(boom, { opacity: 0 }, 0); tl.set(blk, { opacity: 0 }, 0);
      tl.fromTo(boss, { y: 0 }, { y: -4, duration: 0.3, repeat: 7, yoyo: true, ease: "steps(2)" }, 19.0);
      pellets.forEach((p, i) => {
        const t0 = 19.3 + i * 0.12, y0 = 52 + R(-8, 8), y1 = 46 + R(-10, 14);
        tl.set(p, { opacity: 0 }, 0);
        tl.fromTo(p, { opacity: 1, x: 36, y: y0 }, { x: 82, y: y1, duration: 0.25, ease: "steps(6)", immediateRender: false }, t0);
        tl.set(p, { opacity: 0 }, t0 + 0.25);

      });
      tl.fromTo(blk, { opacity: 1 }, { opacity: 0, duration: 0.2, repeat: 7, yoyo: true, ease: "steps(1)", immediateRender: false }, 19.6);
      tl.fromTo(hp, { scaleX: 1 }, { scaleX: 0, duration: 1.7, ease: "steps(17)" }, 19.3);
      tl.set(boss, { opacity: 0 }, 21.05); tl.fromTo(boom, { opacity: 1, scale: 0.4 }, { scale: 1.2, duration: 0.25, ease: "steps(5)", immediateRender: false }, 21.05); tl.set(boom, { opacity: 0 }, 21.35);
      score(21.05, 35000, 0.3);
      // L6
      crt(21.35, "#L6");
      opts.forEach(([b, ck]) => tl.set(ck, { opacity: 0 }, 0)); tl.set(allT, { opacity: 0 }, 0);
      tl.set(cur, { x: 4, y: 40 }, 0);
      [[V + 20.55, 0], [V + 21.65, 1], [V + 22.62, 2]].forEach(([t, i]) => {
        tl.to(cur, { x: [2, 43, 84][i], y: 40, duration: 0.15, ease: "steps(3)" }, t - 0.1);
        tl.to(opts[i][0], { backgroundColor: "#2b4bd6", boxShadow: "0 0 0 2px #ffd23f", duration: 0.05, ease: "steps(1)" }, t);

      opts.forEach(([b, ck], i) => { tl.set(ck, { opacity: 1 }, V + 22.75); tl.to(b, { boxShadow: "0 0 0 2px #3df07a", duration: 0.05 }, V + 22.75 + i * 0.05); });
      tl.fromTo(allT, { opacity: 1 }, { opacity: 0.2, duration: 0.15, repeat: 5, yoyo: true, ease: "steps(1)", immediateRender: false }, V + 22.8);
      score(V + 22.8, 50000, 0.4);

      // ================= logo + CTA, back to the room =================
      const LOGO = V + 23.67;

      // visitors come back happy
      people.forEach(([p, b, x], i) => {

      // the PC keeps happily smoking
      for (let i = 0; i < 40; i++) { const t = 24.9 + i * 0.12; const [x, y] = vents[i % 4]; puff(t, x + R(-3, 3), y, R(0.8, 1.2), 1.6); }
      for (let i = 0; i < 18; i++) { const t = 25.0 + i * 0.25; const [x, y] = mon[i % 6]; puff(t, x, y, 0.8, 1.5); }

      flash(CLICK, 0.6, 0.25); shake(CLICK, 0.4, 2);

      for (let i = 0; i < 8; i++) spark(CLICK + i * 0.06, 200 + R(0, 80), 60 + R(0, 40));
      tl.to("#game", { opacity: 0, duration: 0.5, ease: "steps(5)" }, 29.45);

      window.__timelines["main"] = tl;
      tl.seek(0);
