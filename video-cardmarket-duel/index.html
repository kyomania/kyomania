<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/three.min.js"></script>
    <script src="assets/RoundedBoxGeometry.js"></script>
    <script src="assets/cmlib.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05090d; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(90% 55% at 50% 45%, #18303a 0%, #0b151c 50%, #05090d 100%); }
      .clip { position: absolute; inset: 0; }
      #out { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .slam { position: absolute; left: 0; right: 0; text-align: center; font-family: "Inter Tight", sans-serif; font-weight: 900;
        letter-spacing: -0.05em; line-height: 1; color: #5ee0d4; opacity: 0; }
      #tag { font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: .2em; text-transform: uppercase; color: #fff; text-align: center; }
      #flash { background: #e9fffc; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="0"><canvas id="out" width="1080" height="1920"></canvas></div>
      <div id="t1" class="slam clip" data-start="0" data-duration="8" data-track-index="1" style="inset:auto;left:0;right:0;top:250px;font-size:260px">TRADE</div>
      <div id="t2" class="slam clip" data-start="0" data-duration="8" data-track-index="2" style="inset:auto;left:0;right:0;top:1480px;font-size:260px;color:#fff">DEAL.</div>
      <img id="word" class="clip" src="assets/wordmark-dark.png" alt="cardmarket.pro" data-start="0" data-duration="8" data-track-index="3"
        style="inset:auto;left:90px;top:1520px;width:900px;height:auto;mix-blend-mode:lighten;opacity:0" />
      <div id="tag" class="clip" data-start="0" data-duration="8" data-track-index="4" style="inset:auto;left:0;right:0;top:1720px;opacity:0">Buy · Sell · Trade</div>
      <div id="flash" class="clip" data-start="0" data-duration="8" data-track-index="9"></div>

      <audio id="music" src="assets/music.mp3" data-start="0" data-duration="8" data-volume="0.7" data-fade-out="0.8" data-track-index="5"></audio>
      <audio id="wa" src="assets/whoosh.wav" data-start="0.9" data-duration="0.35" data-volume="0.6" data-track-index="6"></audio>
      <audio id="b1" src="assets/boom.wav" data-start="1.5" data-duration="0.9" data-volume="0.9" data-track-index="7"></audio>
      <audio id="wb" src="assets/whoosh.wav" data-start="3.45" data-duration="0.35" data-volume="0.6" data-track-index="6"></audio>
      <audio id="b2" src="assets/boom.wav" data-start="3.9" data-duration="0.9" data-volume="1.0" data-track-index="7"></audio>
      <audio id="sh" src="assets/shimmer.wav" data-start="4.0" data-duration="1.2" data-volume="0.6" data-track-index="8"></audio>
    </div>

    <script>
      const { MINT, TEAL, GR, W, mono, disp, mk, mark, minis, cl, E, lerp } = CM;
      const ctx = CM.setup(); const { scene, camera, tex, edge } = ctx;
      ctx.renderer.toneMappingExposure = 1.15;

      function front(cv, bg, fg, word, n) {
        const g = cv.getContext("2d");
        g.fillStyle = bg; g.fillRect(0, 0, 512, 716); minis(g, 512, 716, fg, 0.08);
        g.strokeStyle = fg; g.globalAlpha = .4; g.lineWidth = 3; g.strokeRect(22, 22, 468, 672); g.globalAlpha = 1;
        g.fillStyle = fg; g.font = mono(20, 700); g.textAlign = "left"; g.fillText("CARDMARKET.PRO", 44, 66); g.textAlign = "right"; g.fillText(n, 468, 66);
        let s = 140; g.font = disp(s); while (g.measureText(word).width > 420) { s -= 6; g.font = disp(s); }
        g.textAlign = "center"; g.fillText(word, 256, 400); mark(g, 256, 580, 0.14, fg, bg, fg);
      }
      function back(cv) { const g = cv.getContext("2d"); g.fillStyle = MINT; g.fillRect(0, 0, 512, 716); minis(g, 512, 716, TEAL, .25);
        g.strokeStyle = GR; g.lineWidth = 6; g.strokeRect(20, 20, 472, 676); mark(g, 256, 358, 0.36, GR, MINT, TEAL); }
      function logoFront(cv, t) {
        const g = cv.getContext("2d"); g.fillStyle = GR; g.fillRect(0, 0, 512, 716);
        const a = t * 1.8, grd = g.createLinearGradient(256 + Math.cos(a) * 500, 358 + Math.sin(a) * 700, 256 - Math.cos(a) * 500, 358 - Math.sin(a) * 700);
        ["#5ee0d4", "#9b8cff", "#ff8fd0", "#ffd36b", "#7cf0a8", "#5ec8ff", "#5ee0d4"].forEach((c, i) => grd.addColorStop(i / 6, c));
        g.globalAlpha = .5; g.fillStyle = grd; g.fillRect(0, 0, 512, 716); g.globalAlpha = 1;
        g.fillStyle = "rgba(10,17,24,.55)"; g.fillRect(36, 36, 440, 644); g.strokeStyle = W; g.lineWidth = 3; g.strokeRect(36, 36, 440, 644);
        mark(g, 256, 340, 0.4, MINT, GR, TEAL);
        g.fillStyle = W; g.font = mono(22, 700); g.textAlign = "center"; g.fillText("TRADE COMPLETE", 256, 600);
        g.font = mono(18); g.fillText("CARDMARKET.PRO", 256, 640);
      }
      const cvA = mk(512, 716), cvB = mk(512, 716), cvBack = mk(512, 716), cvL = mk(512, 716);
      const paint = () => { front(cvA, W, GR, "BUY", "01"); front(cvB, TEAL, W, "SELL", "02"); back(cvBack); logoFront(cvL, 0); ctx.texs.forEach((t) => (t.needsUpdate = true)); };
      paint();
      const geo = new THREE.RoundedBoxGeometry(1.3, 1.82, 0.03, 3, 0.012);
      const backM = new THREE.MeshStandardMaterial({ map: tex(cvBack), roughness: .4 });
      const card = (cv, r = .38, m = 0) => { const c = new THREE.Mesh(geo, [edge, edge, edge, edge, new THREE.MeshStandardMaterial({ map: tex(cv), roughness: r, metalness: m }), backM]); scene.add(c); return c; };
      const A = card(cvA), B = card(cvB), L = card(cvL, .18, .45); const Ltex = L.material[4].map;
      const glow = new THREE.PointLight(0x5ee0d4, 0, 8); scene.add(glow);
      const sp1 = CM.sparks(scene, 220, 7, 0x9ff5ec, 0.07), sp2 = CM.sparks(scene, 360, 11, 0xffffff, 0.08), sp3 = CM.sparks(scene, 160, 23, 0x5ee0d4, 0.06);
      const r1 = CM.ring(scene), r2 = CM.ring(scene), r3 = CM.ring(scene, 0xffffff);
      const O = new THREE.Vector3(0, 0.45, 0.2);
      const I1 = 1.5, I2 = 3.9;

      function pose(t) {
        // camera: dolly + shake
        const [sx, sy] = CM.shake(t, [I1, I2], 0.14);
        camera.position.set(sx, sy + 0.1, lerp(12.5, 10.2, E.io(cl(t / 8))));
        camera.lookAt(0, 0.35, 0);
        // phase 1: fly in fast, slow-mo near contact
        const p1 = E.expo(cl((t - 0.15) / (I1 - 0.15)));
        let ax = lerp(-9, -0.68, p1), bx = lerp(9, 0.68, p1), az = 0, bz = 0;
        let ary = (1 - p1) * Math.PI * 4, bry = -(1 - p1) * Math.PI * 4, arz = lerp(-0.6, -0.08, p1), brz = lerp(0.6, 0.08, p1);
        // phase 2: orbit swap (slow-mo)
        const th = Math.PI * E.io(cl((t - I1 - 0.1) / 1.4));
        if (t > I1) { ax = -0.75 * Math.cos(th); az = 0.9 * Math.sin(th); bx = 0.75 * Math.cos(th); bz = -0.9 * Math.sin(th);
          ary = -0.3 * Math.sin(th); bry = 0.3 * Math.sin(th); arz = lerp(-0.08, 0.08, th / Math.PI); brz = lerp(0.08, -0.08, th / Math.PI); }
        // phase 3: pull apart, then slam
        const pa = E.out(cl((t - 3.0) / 0.45)), sl = E.in(cl((t - 3.45) / 0.45));
        if (t > 3.0) { ax = lerp(0.75 + 0.55 * pa, 0.05, sl); bx = lerp(-0.75 - 0.55 * pa, -0.05, sl); az = bz = 0;
          ary = -0.5 * pa * (1 - sl) + sl * Math.PI * 2; bry = 0.5 * pa * (1 - sl) - sl * Math.PI * 2; arz = 0.25 * pa * (1 - sl); brz = -0.25 * pa * (1 - sl); }
        const vanish = 1 - E.in(cl((t - I2) / 0.12));
        A.position.set(ax, O.y, az); A.rotation.set(0.05, ary, arz); A.scale.setScalar(Math.max(0.001, vanish));
        B.position.set(bx, O.y, bz); B.rotation.set(0.05, bry, brz); B.scale.setScalar(Math.max(0.001, vanish));
        A.visible = B.visible = vanish > 0.002;
        // logo card bursts out
        const lp = cl((t - I2) / 0.9), ls = E.back(lp, 1.8);
        L.visible = t >= I2; L.scale.setScalar(Math.max(0.001, 1.4 * ls));
        L.position.set(0, O.y + 0.05 * Math.sin(t * 2.2), 0.6 * E.out(lp));
        L.rotation.set(-0.06 + 0.05 * Math.sin(t * 1.3), (1 - E.out(lp)) * Math.PI * 4 + 0.15 * Math.sin(t * 1.1) * E.out(lp), 0.03 * Math.sin(t));
        // fx
        sp1.set(I1, t, O, 1.1); sp2.set(I2, t, O, 1.4); sp3.set(I1 + 0.35, t, new THREE.Vector3(0, O.y, 0.9), 0.9);
        r1.set(I1, t, O, 5, 0.7); r2.set(I2, t, O, 7, 0.8); r3.set(I2 + 0.08, t, O, 4, 0.6);
        glow.position.copy(O).setZ(1.2);
        glow.intensity = 14 * Math.exp(-Math.max(0, t - I1) * 6) * (t >= I1 ? 1 : 0) + 20 * Math.exp(-Math.max(0, t - I2) * 4) * (t >= I2 ? 1 : 0);
      }

      const out = document.getElementById("out"), og = out.getContext("2d");
      let fontsOk = false;
      function draw(t) {
        if (!fontsOk && document.fonts && document.fonts.status === "loaded") { paint(); fontsOk = true; }
        logoFront(cvL, t); Ltex.needsUpdate = true;
        CM.blurDraw(og, ctx, pose, t, 6);
      }
      const state = { t: 0 };
      if (document.fonts) document.fonts.ready.then(() => { paint(); fontsOk = true; draw(state.t); });
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 8, duration: 8, ease: "none", onUpdate: () => draw(state.t) }, 0);
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, I1);
      tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, I2);
      tl.fromTo("#t1", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, I1);
      tl.to("#t1", { opacity: 0, y: -60, duration: 0.3, ease: "power2.in" }, 3.0);
      tl.fromTo("#t2", { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, I2);
      tl.to("#t2", { opacity: 0, y: -60, duration: 0.3, ease: "power2.in" }, 5.0);
      tl.fromTo("#word", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.5);
      tl.fromTo("#tag", { opacity: 0, y: 20 }, { opacity: 0.85, y: 0, duration: 0.5, ease: "power3.out" }, 5.8);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0); draw(0);
    </script>
  </body>
</html>
