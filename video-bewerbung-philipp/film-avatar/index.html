<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PGar"; font-weight: 500; src: url(assets/fonts/CormorantGaramond-Medium-1.woff2); }
      @font-face { font-family: "PGar"; font-weight: 600; src: url(assets/fonts/CormorantGaramond-SemiBold-1.woff2); }
      @font-face { font-family: "PSans"; font-weight: 400; src: url(assets/fonts/WorkSans-Regular.woff2); }
      @font-face { font-family: "PSans"; font-weight: 500; src: url(assets/fonts/WorkSans-Medium.woff2); }
      :root { --ivory: #f3e8d2; --navy: #0d1a30; --ink: #13233f; --gold: #c9a063; --gold2: #e6c993; --mute: #5b5446;
        --serif: "PGar", Georgia, serif; --sans: "PSans", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07101f; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07101f; -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      video.clip { object-fit: cover; }
      .ab { position: absolute; }
      .eb { font: 500 22px var(--sans); letter-spacing: 0.34em; text-transform: uppercase; color: var(--gold2); }
      .ser { font-family: var(--serif); font-weight: 600; letter-spacing: -0.005em; }
      .ln { display: block; overflow: hidden; padding-bottom: 0.08em; }
      .ln > span { display: inline-block; }
      .shade { text-shadow: 0 2px 24px rgba(0,0,0,0.55); }

      /* overlays */
      #vig { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(3,8,18,0.55) 100%); pointer-events: none; }
      .flash { background: radial-gradient(ellipse at 50% 50%, rgba(255,228,180,0.95) 0%, rgba(230,190,120,0.55) 35%, rgba(0,0,0,0) 75%); opacity: 0; mix-blend-mode: screen; }
      .bar { position: absolute; left: 0; width: 1920px; height: 0; background: #000; }

      /* S1 title */
      #t1 { left: 1070px; top: 330px; width: 760px; }
      #t1 .nm { font-size: 118px; line-height: 0.98; color: var(--ivory); margin-top: 22px; }
      #t1 .rl { font: 500 26px var(--sans); letter-spacing: 0.3em; text-transform: uppercase; color: var(--ivory); opacity: 0.86; margin-top: 30px; }
      #t1 .rule { width: 0; height: 2px; background: linear-gradient(90deg, var(--gold2), rgba(201,160,99,0)); margin-top: 28px; }

      /* S2 cards */
      .card { position: absolute; width: 470px; height: 314px; }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 26px 30px rgba(0,0,0,0.45)); }
      .card .tx { position: absolute; left: 60px; top: 58px; right: 50px; }
      .card .y { font: 600 50px/1 var(--serif); color: var(--ink); }
      .card .d { font: 500 30px/1.22 var(--sans); color: #2b2a26; margin-top: 14px; }
      .card .s { font: 400 23px/1.3 var(--sans); color: #4c463b; margin-top: 8px; }

      /* S3 path milestones */
      .ms { position: absolute; width: 640px; }
      .ms .y { font: 600 30px var(--sans); letter-spacing: 0.24em; color: var(--gold2); }
      .ms .t { font-size: 80px; line-height: 1; color: var(--ivory); margin-top: 8px; }
      .ms .d { font: 400 28px var(--sans); color: rgba(243,232,210,0.82); margin-top: 10px; letter-spacing: 0.02em; }
      #s3rule { left: 140px; top: 168px; width: 0; height: 1px; background: linear-gradient(90deg, var(--gold2), rgba(201,160,99,0.1)); }

      /* S4 KPI */
      .kpi { position: absolute; width: 400px; height: 238px; }
      .kpi img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.94; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5)); }
      .kpi .tx { position: absolute; left: 0; right: 0; top: 40px; text-align: center; }
      .kpi .v { font: 600 92px/1 var(--serif); color: var(--ink); }
      .kpi .l { font: 500 21px/1.3 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: #3e3a33; margin-top: 10px; }

      /* S5 skills */
      #scrim5 { left: 0; top: 0; width: 1000px; height: 1080px; background: linear-gradient(90deg, rgba(5,11,24,0.85) 0%, rgba(5,11,24,0.6) 65%, rgba(5,11,24,0) 100%); }
      .tab { position: absolute; width: 360px; height: 239px; }
      .tab img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 18px 26px rgba(0,0,0,0.5)); }
      .tab .tx { position: absolute; left: 44px; right: 30px; top: 88px; font: 600 46px/1 var(--serif); color: var(--gold2); }
      .tab .lv { position: absolute; left: 46px; top: 156px; width: 250px; height: 3px; background: rgba(230,201,147,0.22); }
      .tab .lv i { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--gold2); }

      /* S6 outro */
      #scrim6 { left: 0; top: 0; width: 1100px; height: 1080px; background: linear-gradient(90deg, rgba(5,11,24,0.86) 0%, rgba(5,11,24,0.6) 60%, rgba(5,11,24,0) 100%); }
      #seal { left: 140px; top: 210px; width: 270px; height: 271px; }
      #seal img { width: 100%; height: 100%; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); }
      #seal .in { position: absolute; left: 0; right: 0; top: 104px; text-align: center; font: 600 46px var(--serif); color: var(--gold2); }
      #t6 { left: 140px; top: 540px; width: 900px; }
      #t6 .big { font-size: 128px; line-height: 0.95; color: var(--ivory); margin-top: 16px; }
      #t6 .ct { font: 400 25px/1.7 var(--sans); color: rgba(243,232,210,0.88); margin-top: 34px; letter-spacing: 0.03em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="30">

      <!-- ===== Clips ===== -->
      <video id="c1" class="clip" src="assets/clips/c1.mp4" muted playsinline data-start="0" data-duration="5.4" data-media-start="0" data-track-index="1"></video>
      <video id="c2" class="clip" src="assets/clips/c2.mp4" muted playsinline data-start="5" data-duration="5.4" data-media-start="0" data-track-index="2"></video>
      <video id="c3" class="clip" src="assets/clips/c3.mp4" muted playsinline data-start="10" data-duration="5.4" data-media-start="0" data-track-index="3"></video>
      <video id="c4" class="clip" src="assets/clips/c4.mp4" muted playsinline data-start="15" data-duration="5.4" data-media-start="0" data-track-index="4"></video>
      <video id="c5" class="clip" src="assets/clips/c5.mp4" muted playsinline data-start="20" data-duration="5.4" data-media-start="0" data-track-index="5"></video>
      <video id="c6" class="clip" src="assets/clips/c6.mp4" muted playsinline data-start="25" data-duration="5" data-media-start="0" data-track-index="6"></video>

      <!-- ===== S1 Titel ===== -->
      <div id="g1" class="clip" data-start="0" data-duration="5.2" data-track-index="10" data-layout-ignore>
        <div id="t1" class="ab shade">
          <div class="eb ln"><span id="t1e">Bewerbung · Controlling</span></div>
          <div class="ser nm"><span class="ln"><span class="w">Philipp</span></span><span class="ln"><span class="w">Buschmeier</span></span></div>
          <div class="rule" id="t1r"></div>
          <div class="rl ln"><span id="t1s">Controller &amp; Analyst</span></div>
        </div>
      </div>

      <!-- ===== S2 Lebenslauf-Karten ===== -->
      <div id="g2" class="clip" data-start="5" data-duration="5.2" data-track-index="11" data-layout-ignore>
        <div id="cards"></div>
      </div>

      <!-- ===== S3 Weg ===== -->
      <div id="g3" class="clip" data-start="10" data-duration="5.2" data-track-index="12" data-layout-ignore>
        <div id="s3rule" class="ab"></div>
        <div id="mss"></div>
      </div>

      <!-- ===== S4 KPIs ===== -->
      <div id="g4" class="clip" data-start="15" data-duration="5.2" data-track-index="13" data-layout-ignore>
        <div id="kpis"></div>
      </div>

      <!-- ===== S5 Skills ===== -->
      <div id="g5" class="clip" data-start="20" data-duration="5.2" data-track-index="14" data-layout-ignore>
        <div id="scrim5" class="ab"></div>
        <div class="ab eb" id="s5e" style="left:120px; top:118px;">Werkzeugkasten</div>
        <div id="tabs"></div>
      </div>

      <!-- ===== S6 Fazit ===== -->
      <div id="g6" class="clip" data-start="25" data-duration="5" data-track-index="15" data-layout-ignore>
        <div id="scrim6" class="ab"></div>
        <div id="seal" class="ab"><img src="assets/el/h3_seal.png" alt="" /><div class="in">2026</div></div>
        <div id="t6" class="ab shade">
          <div class="eb ln"><span id="t6e">Investitionsempfehlung</span></div>
          <div class="ser big ln"><span id="t6b">Einladen.</span></div>
          <div class="ct" id="t6c"></div>
        </div>
      </div>

      <!-- ===== Look-Overlays ===== -->
      <div id="vig" class="clip" data-start="0" data-duration="30" data-track-index="20" data-layout-ignore></div>
      <div id="fx" class="clip" data-start="0" data-duration="30" data-track-index="21" data-layout-ignore>
        <div class="clip flash" id="f1"></div><div class="clip flash" id="f2"></div><div class="clip flash" id="f3"></div>
        <div class="clip flash" id="f4"></div><div class="clip flash" id="f5"></div><div class="clip flash" id="f0"></div>
        <div class="bar" id="bt" style="top:0"></div><div class="bar" id="bb" style="bottom:0"></div>
      </div>
    </div>

    <script>
      /* ================= DATEN (hier ändern) ================= */
      var CV = [ // Szene 2: Karten an der Lebenslauf-Wand
        { y: "2013", d: "Abitur", s: "Note 1,8" },
        { y: "2013–16", d: "Ausbildung Industriekaufmann", s: "Thüringer Maschinenbau GmbH" },
        { y: "2016–19", d: "B.A. BWL · Controlling", s: "Fachhochschule" }
      ];
      var PATH = [ // Szene 3: Weg nach vorn
        { y: "2019", t: "Junior Controller", d: "Logistikbranche" },
        { y: "seit 2021", t: "Controller", d: "Forecasts · Kostenstellen · Reporting" },
        { y: "2026", t: "Ihr Unternehmen?", d: "Der nächste Schritt" }
      ];
      var KPI = [ // Szene 4: Zahlen über den Türmen
        { v: -40, pre: "−", suf: " %", dec: 0, l: "Reporting-Zeit" },
        { v: 97, pre: "", suf: " %", dec: 0, l: "Forecast-Genauigkeit" },
        { v: 1.2, pre: "", suf: " Mio €", dec: 1, l: "Einsparpotenzial" }
      ];
      var SKILLS = [ { n: "SAP CO", p: 0.9 }, { n: "Power BI", p: 0.85 }, { n: "SQL", p: 0.75 }, { n: "Excel / VBA", p: 0.95 }, { n: "Kommunikation", p: 0.9 } ];
      var CONTACT = "philipp.buschmeier@beispiel.de<br>+49 000 000 000";
      /* ====================================================== */

      // Positionen (an die Clips angepasst)
      var CARD_POS = [ [1330, 120, -2.5], [1380, 420, 1.5], [1310, 720, -1] ];
      var MS_POS = [ [140, 210], [140, 450], [140, 690] ];
      var KPI_POS = [ [110, 500], [570, 250], [990, 30] ];
      var TAB_POS = [ [90, 180, -3], [420, 290, 2], [100, 470, 1.5], [430, 580, -2], [110, 770, -1] ];

      function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

      var cards = document.getElementById("cards");
      CV.forEach(function (c, i) {
        var d = el("div", "card"); d.id = "cv" + i;
        d.style.left = CARD_POS[i][0] + "px"; d.style.top = CARD_POS[i][1] + "px";
        d.appendChild(el("img")).src = "assets/el/h1_card.png";
        var tx = el("div", "tx"); tx.appendChild(el("div", "y", c.y)); tx.appendChild(el("div", "d", c.d)); tx.appendChild(el("div", "s", c.s));
        d.appendChild(tx); cards.appendChild(d);
      });
      var mss = document.getElementById("mss");
      PATH.forEach(function (m, i) {
        var d = el("div", "ms shade"); d.id = "ms" + i; d.style.left = MS_POS[i][0] + "px"; d.style.top = MS_POS[i][1] + "px";
        d.appendChild(el("div", "y", m.y)); d.appendChild(el("div", "t ser", m.t)); d.appendChild(el("div", "d", m.d)); mss.appendChild(d);
      });
      var kpis = document.getElementById("kpis");
      KPI.forEach(function (k, i) {
        var d = el("div", "kpi"); d.id = "kp" + i; d.style.left = KPI_POS[i][0] + "px"; d.style.top = KPI_POS[i][1] + "px";
        d.appendChild(el("img")).src = "assets/el/h5_vellum.png";
        var tx = el("div", "tx"); var v = el("div", "v", k.pre + "0" + k.suf); v.id = "kv" + i; tx.appendChild(v); tx.appendChild(el("div", "l", k.l));
        d.appendChild(tx); kpis.appendChild(d);
      });
      var tabs = document.getElementById("tabs");
      SKILLS.forEach(function (s, i) {
        var d = el("div", "tab"); d.id = "tb" + i; d.style.left = TAB_POS[i][0] + "px"; d.style.top = TAB_POS[i][1] + "px";
        d.appendChild(el("img")).src = "assets/el/h6_tab.png";
        d.appendChild(el("div", "tx", s.n)); var lv = el("div", "lv"); var bar = el("i"); bar.id = "lv" + i; lv.appendChild(bar); d.appendChild(lv);
        tabs.appendChild(d);
      });
      document.getElementById("t6c").innerHTML = CONTACT;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var E = "power3.out";

      // Kino-Balken + Einstieg
      tl.fromTo("#bt", { height: 540 }, { height: 0, duration: 1.4, ease: "power3.inOut" }, 0);
      tl.fromTo("#bb", { height: 540 }, { height: 0, duration: 1.4, ease: "power3.inOut" }, 0);
      tl.fromTo("#f0", { opacity: 0.0 }, { opacity: 0.7, duration: 0.5, ease: "sine.out" }, 0.5).to("#f0", { opacity: 0, duration: 1.0 }, 1.0);

      // Clip-Übergänge: Crossfade + Goldblitz
      [["#c2", 5], ["#c3", 10], ["#c4", 15], ["#c5", 20], ["#c6", 25]].forEach(function (p, i) {
        tl.fromTo(p[0], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, p[1]);
        var f = "#f" + (i + 1);
        tl.fromTo(f, { opacity: 0, scale: 0.8 }, { opacity: 0.85, scale: 1.1, duration: 0.22, ease: "sine.out" }, p[1] - 0.05)
          .to(f, { opacity: 0, scale: 1.4, duration: 0.5, ease: "sine.in" }, p[1] + 0.17);
      });

      // S1
      tl.from("#t1e", { yPercent: 110, duration: 0.8, ease: E }, 1.3);
      tl.from("#t1 .w", { yPercent: 110, duration: 1.0, ease: "expo.out", stagger: 0.14 }, 1.5);
      tl.to("#t1r", { width: 520, duration: 1.1, ease: "power2.inOut" }, 2.0);
      tl.from("#t1s", { yPercent: 110, duration: 0.8, ease: E }, 2.3);
      tl.to("#t1", { opacity: 0, x: -30, duration: 0.45, ease: "power2.in" }, 4.55);

      // S2 Karten "pinnen" sich an die Wand
      CV.forEach(function (c, i) {
        var t = 5.5 + i * 0.95, r = CARD_POS[i][2];
        tl.fromTo("#cv" + i, { opacity: 0, scale: 1.25, rotation: r - 8, y: -40, filter: "blur(10px)" },
          { opacity: 1, scale: 1, rotation: r, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, t);
      });
      tl.to("#cards", { scale: 1.06, duration: 4.6, ease: "none", transformOrigin: "100% 50%" }, 5.4);
      tl.to("#cards", { opacity: 0, duration: 0.4 }, 9.7);

      // S3 Meilensteine
      tl.to("#s3rule", { width: 560, duration: 1.2, ease: "power2.inOut" }, 10.3);
      PATH.forEach(function (m, i) {
        var t = 10.6 + i * 1.1;
        tl.fromTo("#ms" + i, { opacity: 0, x: -50, filter: "blur(8px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.9, ease: E }, t);
      });
      tl.to("#mss, #s3rule", { opacity: 0, duration: 0.4 }, 14.7);

      // S4 KPIs zählen hoch
      KPI.forEach(function (k, i) {
        var t = 15.6 + i * 0.75;
        tl.fromTo("#kp" + i, { opacity: 0, y: 60, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.4)" }, t);
        var o = { n: 0 };
        tl.to(o, { n: Math.abs(k.v), duration: 1.4, ease: "power2.out", onUpdate: function () {
          document.getElementById("kv" + i).textContent = k.pre + o.n.toFixed(k.dec).replace(".", ",") + k.suf;
        } }, t + 0.15);
      });
      tl.to("#kpis", { opacity: 0, duration: 0.4 }, 19.7);

      // S5 Skill-Tabs
      tl.fromTo("#scrim5", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 20.2);
      tl.from("#s5e", { opacity: 0, y: 14, duration: 0.6, ease: E }, 20.4);
      SKILLS.forEach(function (s, i) {
        var t = 20.6 + i * 0.42, r = TAB_POS[i][2];
        tl.fromTo("#tb" + i, { opacity: 0, rotationY: -70, x: -60, rotation: r }, { opacity: 1, rotationY: 0, x: 0, rotation: r, duration: 0.8, ease: "expo.out" }, t);
        tl.to("#lv" + i, { width: 250 * s.p, duration: 1.0, ease: "power2.out" }, t + 0.4);
      });
      tl.to("#g5 .tab, #s5e, #scrim5", { opacity: 0, duration: 0.4 }, 24.7);

      // S6 Fazit
      tl.fromTo("#scrim6", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 25.3);
      tl.fromTo("#seal", { opacity: 0, scale: 1.8, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "power4.in" }, 25.6);
      tl.fromTo("#seal", { y: 0 }, { y: 6, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, 26.3);
      tl.from("#t6e", { yPercent: 110, duration: 0.8, ease: E }, 26.5);
      tl.from("#t6b", { yPercent: 110, duration: 1.0, ease: "expo.out" }, 26.7);
      tl.from("#t6c", { opacity: 0, y: 20, duration: 0.8, ease: E }, 27.4);
      tl.to("#bt", { height: 70, duration: 1.2, ease: "power2.inOut" }, 28.6);
      tl.to("#bb", { height: 70, duration: 1.2, ease: "power2.inOut" }, 28.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
