<!doctype html>
<html lang="de" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "R3"; src: url(assets/fonts/archivo-black-latin-400-normal.woff2); }
      @font-face { font-family: "R7"; src: url(assets/fonts/bebas-neue-latin-400-normal.woff2); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0c1c; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0c1c; color: #fff; }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #base { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #flash { position: absolute; inset: 0; background: #fff6e0; opacity: 0; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%); }
      .rain { position: absolute; top: -220px; }
      #plate { transform-origin: 50% 50%; }
      /* Chat-Ebene per Homographie auf die schräge Monitorfläche gelegt (Ecken aus dem Video gemessen) */
      #chatplane { position: absolute; left: 0; top: 0; width: 300px; height: 150px; transform-origin: 0 0;
        transform: matrix3d(0.67807127,-0.01930168,0.00000000,-0.00018162,-0.01701344,1.03858531,0.00000000,-0.00000239,0.00000000,0.00000000,1.00000000,0.00000000,1542.00000000,436.00000000,0.00000000,1.00000000); }
      #chatbox { position: absolute; left: 0; top: 0; width: 300px; height: 150px; overflow: hidden;
        display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; padding: 0 4px 16px;
        font: 600 15px/1.25 "Inter", "Helvetica Neue", Arial, sans-serif; color: #efeff1;
        text-shadow: 0 0 6px rgba(190,170,255,0.35); filter: blur(0.3px); opacity: 0.93; }
      .msg { display: none; }
      .msg b { font-weight: 800; }
      #heart { opacity: 0; position: absolute; left: 1180px; top: 210px; font: 400 130px R3; color: #ff4f7a; text-shadow: 0 10px 24px rgba(0,0,0,0.5); }
      .piece { visibility: hidden; opacity: 0; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; filter: drop-shadow(0 16px 26px rgba(0,0,0,0.65)); }
      #hud { position: absolute; left: 56px; bottom: 44px; display: flex; align-items: center; gap: 18px; font: 400 30px "R3", sans-serif; letter-spacing: 0.04em;
        padding: 12px 22px; background: rgba(10,10,24,0.55); border-radius: 10px; }
      #rec { width: 22px; height: 22px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 0 6px rgba(255,59,59,0.18); }
      #hud .tw { font: 400 30px "R7", sans-serif; letter-spacing: 0.08em; color: #c9b8ff; margin-left: 16px; }
      #hud .ig { display: inline-flex; align-items: center; gap: 10px; margin-left: 14px; font: 400 30px "R7", sans-serif; letter-spacing: 0.08em; color: #ffb3d1; }
      #hud .ig svg { width: 30px; height: 30px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080" data-fps="30">

      <!-- Grundschnitt aus 12 Kling-Clips (v2/build_base.sh) -->
      <div id="shot" class="full">
        <div id="cam">
          <div id="plate" class="full">
            <video id="base" class="clip" data-start="0" data-duration="60" data-track-index="0" src="assets/video/base.mp4" muted playsinline></video>
            <!-- Twitch-Chat auf dem rechten Monitor (Zimmer 35-47 s, ohne Oma-Insert 39-42.5) -->
            <div id="chat" class="clip" data-start="35" data-duration="12" data-track-index="2">
              <div id="chatplane"><div id="chatbox">
                <div class="msg" id="m0"><b style="color:#ff7f50">VanooO_</b>: bin schon wieder voll wow</div>
                <div class="msg" id="m1"><b style="color:#9acd32">AbuKaetzchen</b>: any Sider?</div>
                <div class="msg" id="m2"><b style="color:#4aa8ff">satyrbe</b>: FeelsOkayMan</div>
                <div class="msg" id="m3"><b style="color:#daa520">dilard47</b>: Boah bin ich alt</div>
              </div></div>
            </div>
          </div>
          <div id="flash"></div>
        </div>
        <div id="vig"></div>
      </div>

      <!-- Papier-Regen (Higgsfield-Sprites) in den Außenszenen 0-35 s -->
      <div id="rain" class="clip" data-start="0" data-duration="35" data-track-index="4"><div id="rainin" class="full"></div></div>

      <!-- Herz am Oma-Foto -->
      <div id="fx" class="clip" data-start="0" data-duration="60" data-track-index="5">
        <div id="heart">&#10084;</div>
      </div>

      <!-- Papier-Risse: ausgehender Frame, mit v2/tear.py in zwei Hälften gerissen -->
      <div id="tx" class="clip" data-start="0" data-duration="60" data-track-index="15"></div>

      <!-- Musik (ElevenLabs, als 60-s-Loop) + Riss-/Uhr-SFX, gemischt -->
      <audio id="mix" data-start="0" data-duration="60" data-track-index="30" src="assets/audio/mix.wav"></audio>

      <div id="ovl" class="clip" data-start="0" data-duration="60" data-track-index="20">
        <div id="hud"><div id="rec"></div><span>LOOKING FOR MATCH</span><span class="tw">twitch.tv/fuzzn</span><span class="ig"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#ffffff" stroke-width="2.4"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="#ffffff" stroke-width="2.4"/><circle cx="17.6" cy="6.4" r="1.4" fill="#ffffff"/></svg>dfuzzn</span></div>
      </div>
    </div>

    <script>
      let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      // Riss-Übergänge: [Zeit, Richtung]  v = links/rechts, h = oben/unten
      const TEARS = [["14.5", "v"], ["23.5", "h"], ["35.0", "v"], ["47.0", "h"], ["59.4", "v"]];
      const tx = document.getElementById("tx");
      TEARS.forEach(([t, dir], k) => ["a", "b"].forEach((p) => {
        const im = document.createElement("img"); im.className = "piece"; im.id = "t" + k + p;
        im.src = "assets/img/v2/tear_" + t + "_" + p + ".png"; tx.appendChild(im);
      }));

      // Regen: Streifen + Tropfen
      const rain = document.getElementById("rainin");
      const RS = 38, RD = 7;
      for (let i = 0; i < RS + RD; i++) {
        const im = document.createElement("img"); im.className = "rain"; im.id = "r" + i;
        const streak = i < RS; im.src = "assets/img/v2/" + (streak ? "streak" : "drop") + ".png";
        const sc = streak ? 0.35 + rnd() * 0.45 : 0.25 + rnd() * 0.25;
        im.style.left = Math.round(rnd() * 2100 - 120) + "px";
        im.style.width = Math.round((streak ? 16 : 56) * sc) + "px";
        im.style.opacity = (streak ? 0.22 : 0.4) + rnd() * 0.25;
        rain.appendChild(im);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rec", { opacity: 1 }, { opacity: 0.2, duration: 0.6, ease: "steps(1)", yoyo: true, repeat: 99 }, 0);

      // Handkamera-Micro-Shake (deterministisch), Kamera leicht überskaliert gegen Ränder
      tl.set("#cam", { scale: 1.04, transformOrigin: "50% 50%" }, 0);
      let t = 0; while (t < 59.0) { const d = 0.5 + rnd() * 0.5; tl.to("#cam", { x: (rnd() - 0.5) * 14, y: (rnd() - 0.5) * 10, rotation: (rnd() - 0.5) * 0.5, duration: d, ease: "sine.inOut" }, t); t += d; }
      tl.to("#cam", { x: 0, y: 0, rotation: 0, duration: 60 - t, ease: "sine.inOut" }, t); // endet wie Frame 0 → nahtloser Loop

      // Punch-Zoom an harten Schnitten
      [3.2, 5.0, 8.6, 12.2, 17.3, 22.3, 27.0, 30.5, 39.0, 42.5, 52.0, 53.8].forEach((c) => {
        tl.fromTo("#plate", { scale: 1.09, filter: "blur(6px)" }, { scale: 1.0, filter: "blur(0px)", duration: 0.28, ease: "power3.out", immediateRender: false }, c);
      });
      // Freeze-Frame-Punch beim Döner-Biss
      tl.fromTo("#plate", { scale: 1.0 }, { scale: 1.22, duration: 0.18, ease: "power4.out", immediateRender: false }, 16.5);
      tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, 16.5);
      tl.to("#plate", { scale: 1.0, duration: 0.25, ease: "power2.inOut" }, 17.05);

      // Chat: Nachrichten kommen nacheinander rein, während des Oma-Inserts ausgeblendet
      [36.0, 37.0, 38.1, 43.2].forEach((ct, i) => {
        tl.set("#m" + i, { display: "block" }, ct);
        tl.fromTo("#m" + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, ct);
      });
      tl.set("#chatbox", { autoAlpha: 0 }, 39.0);
      tl.set("#chatbox", { autoAlpha: 0.93 }, 42.5);

      // Kein Regen in der Glut-Szene (drinnen am Fenster)
      tl.to("#rainin", { autoAlpha: 0, duration: 0.1 }, 27.0);
      tl.to("#rainin", { autoAlpha: 1, duration: 0.1 }, 30.5);

      // Regen fällt leicht schräg, Streifen schnell, Tropfen langsamer
      for (let i = 0; i < RS + RD; i++) {
        const streak = i < RS; const d = streak ? 0.55 + rnd() * 0.35 : 1.1 + rnd() * 0.7;
        const reps = Math.max(0, Math.floor(35 / d) - 1);
        tl.fromTo("#r" + i, { x: 0, y: 0, rotation: 9 }, { x: -200, y: 1400, rotation: 9, duration: d, ease: "none", repeat: reps }, rnd() * d);
      }

      // Herz am Oma-Foto
      tl.fromTo("#heart", { scale: 0, opacity: 0 }, { scale: 1.25, opacity: 1, duration: 0.4, ease: "back.out(3)", immediateRender: false }, 40.0);
      tl.to("#heart", { scale: 1.1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 40.4);
      tl.to("#heart", { y: -90, opacity: 0, duration: 0.7, ease: "sine.in" }, 41.6);

      // Riss: erst reißt das Papier von einer Seite her auf (kleine Drehung um das Rissende),
      // dann werden beide Hälften weggezogen. Leichte 3D-Wölbung wie bei echtem Papier.
      TEARS.forEach(([ts, dir], k) => {
        const T = parseFloat(ts), A = "#t" + k + "a", B = "#t" + k + "b", v = dir === "v";
        const o = v ? "50% 100%" : "0% 50%";
        tl.set([A, B], { autoAlpha: 1, x: 0, y: 0, rotation: 0, rotationX: 0, rotationY: 0, transformPerspective: 1800, transformOrigin: o }, T);
        const last = k === TEARS.length - 1; // Loop-Riss: kürzer, Hälften genau bei 60.0 aus dem Bild
        const o1 = last ? 0.2 : 0.34, p0 = last ? 0.2 : 0.36, p1 = last ? 0.38 : 0.55;
        if (v) {
          tl.to(A, { rotation: -2.6, x: -18, rotationY: 7, duration: o1, ease: "power2.out" }, T + 0.02);
          tl.to(B, { rotation: 2.6, x: 18, rotationY: -7, duration: o1, ease: "power2.out" }, T + 0.02);
          tl.to(A, { x: -1350, y: 90, rotation: -13, rotationY: 22, duration: p1, ease: "power2.in" }, T + p0);
          tl.to(B, { x: 1350, y: -50, rotation: 11, rotationY: -22, duration: last ? p1 - 0.02 : p1, ease: "power2.in" }, T + p0 + (last ? 0.02 : 0.04));
        } else {
          tl.to(A, { rotation: -2.2, y: -16, rotationX: -7, duration: 0.34, ease: "power2.out" }, T + 0.02);
          tl.to(B, { rotation: 2.2, y: 16, rotationX: 7, duration: 0.34, ease: "power2.out" }, T + 0.02);
          tl.to(A, { y: -1150, x: 80, rotation: -8, rotationX: -20, duration: 0.55, ease: "power2.in" }, T + 0.36);
          tl.to(B, { y: 1150, x: -60, rotation: 7, rotationX: 20, duration: 0.55, ease: "power2.in" }, T + 0.40);
        }
        tl.set([A, B], { autoAlpha: 0 }, last ? 59.99 : T + 0.97);
        tl.fromTo("#cam", { y: 0 }, { y: 6, duration: 0.05, ease: "steps(1)", yoyo: true, repeat: 3, immediateRender: false }, T + 0.02);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
